name: Validate ArmorStandPet 26.1.2.95 combat look

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Download exact validated look-modes baseline
        uses: actions/download-artifact@v4
        with:
          name: armorstandpet-neoforge-26.1.2.95-look-modes
          path: /tmp/base-artifact
          run-id: 34284230538
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct and audit narrow combat-look fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf baseline project artifact
          mkdir baseline project artifact
          source_zip=/tmp/base-artifact/ArmorStandPet-NeoForge-26.1.2.95-look-modes-source.zip
          echo 'db160cb36dfcae8b341b5e23e31d76f40721c4e241d37776b2b2a2edc5fc3a1b  '"$source_zip" | sha256sum --check
          unzip -q "$source_zip" -d baseline
          cp -a baseline/. project/
          echo '5daa8c295d494b7935f380902c4fc1c34aca84bf7ba9d4cbe09e3b85cd3cafbe  ci/armorstandpet-neoforge-26.1.2.95-combat-look.patch' | sha256sum --check
          (cd project && patch --batch --forward -p1 < ../ci/armorstandpet-neoforge-26.1.2.95-combat-look.patch)
          cp ci/armorstandpet-neoforge-26.1.2.95-combat-look.patch artifact/ArmorStandPet-NeoForge-26.1.2.95-combat-look.patch
          python3 - <<'PY'
          from pathlib import Path
          import sys
          base=Path('baseline/src/main/java'); new=Path('project/src/main/java')
          allowed={
              'io/github/kyzderp/armorstandpet/types/Pet.java',
              'io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.java',
          }
          bad=[]; checked=0
          for src in sorted(base.rglob('*.java')):
              rel=src.relative_to(base).as_posix()
              if rel in allowed: continue
              dst=new/rel
              if not dst.is_file() or src.read_bytes()!=dst.read_bytes(): bad.append(rel)
              checked += 1
          if bad:
              print('Unexpected production Java changes:', *bad, sep='\n - '); sys.exit(1)
          print(f'Byte-for-byte preserved {checked} production Java files outside Pet.java and OwnerAttackCombatController.java')

          pet=(new/'io/github/kyzderp/armorstandpet/types/Pet.java').read_text()
          combat=(new/'io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.java').read_text()
          checks=[
              ('generic living target', 'private LivingEntity combatLookTarget;' in pet and 'smoothLookAtEntity(LivingEntity target)' in pet),
              ('combat priority', pet.index('if (this.combatLookTarget != null)') < pet.index('if (this.walkingLookTarget == null)')),
              ('combat target begin', 'pet.beginCombatLookAt(target);' in combat),
              ('combat target release', 'state.pet.clearCombatLookTarget();' in combat),
              ('server clear target', 'state.pet.clearCombatLookTarget();' in combat[combat.index('public static void clearAll()'):]),
              ('walking-only usage retained', 'this.lookMode == LookMode.WALKING' in pet),
              ('owner ON retained', 'if (this.lookMode == LookMode.ON)' in pet and 'getPlayerByName(this.owner)' in pet),
              ('smooth tracking retained', 'LOOK_HEAD_YAW_SPEED_DEGREES' in pet and 'LOOK_BODY_TURN_THRESHOLD_DEGREES' in pet),
          ]
          failed=[name for name, ok in checks if not ok]
          if failed: raise SystemExit('Combat-look semantic audit failed: ' + ', '.join(failed))
          PY
          grep -q '^minecraft_version=26.1.2$' project/gradle.properties
          grep -q '^neo_version=26.1.2.95$' project/gradle.properties
          grep -Fq 'mod_version=3.0.5+neoforge.26.1.2-combat-look' project/gradle.properties
      - name: Build production JAR
        working-directory: project
        run: ./gradlew clean build --stacktrace --no-daemon --console=plain
      - name: Verify compiled combat-look logic and metadata
        shell: bash
        run: |
          set -euo pipefail
          javap -classpath project/build/classes/java/main -c -p io.github.kyzderp.armorstandpet.types.Pet > artifact/Pet-combat-look-javap.txt
          javap -classpath project/build/classes/java/main -c -p io.github.kyzderp.armorstandpet.combat.OwnerAttackCombatController > artifact/CombatController-javap.txt
          grep -Fq 'beginCombatLookAt' artifact/Pet-combat-look-javap.txt
          grep -Fq 'clearCombatLookTarget' artifact/Pet-combat-look-javap.txt
          grep -Fq 'smoothLookAtEntity' artifact/Pet-combat-look-javap.txt
          grep -Fq 'beginCombatLookAt' artifact/CombatController-javap.txt
          grep -Fq 'clearCombatLookTarget' artifact/CombatController-javap.txt
          jar="$(find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          test -n "$jar"
          unzip -p "$jar" META-INF/neoforge.mods.toml > /tmp/neoforge.mods.toml
          grep -Fq 'versionRange="[26.1.2.95,)"' /tmp/neoforge.mods.toml
          cp "$jar" artifact/ArmorStandPet-NeoForge-26.1.2.95-combat-look.jar
      - name: Dedicated-server smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project/run
          printf 'eula=true\n' > project/run/eula.txt
          printf 'online-mode=false\nserver-port=25594\n' > project/run/server.properties
          set +e
          (cd project && (sleep 90; echo stop) | timeout 360s ./gradlew runServer --no-daemon --console=plain) > artifact/ArmorStandPet-NeoForge-26.1.2.95-combat-look-server-smoke.log 2>&1
          status=$?
          set -e
          cat artifact/ArmorStandPet-NeoForge-26.1.2.95-combat-look-server-smoke.log
          grep -q 'Done (' artifact/ArmorStandPet-NeoForge-26.1.2.95-combat-look-server-smoke.log
          grep -q 'ArmorStandPet NeoForge 26.1.2 initialized.' artifact/ArmorStandPet-NeoForge-26.1.2.95-combat-look-server-smoke.log
          ! grep -Eiq '(^|\]) *(ERROR|FATAL) ' artifact/ArmorStandPet-NeoForge-26.1.2.95-combat-look-server-smoke.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
      - name: Package validated files
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'ArmorStandPet NeoForge 26.1.2.95 WALKING combat-look extension' \
            '============================================================' \
            'Minecraft: 26.1.2' \
            'NeoForge: 26.1.2.95' \
            'Java: 25' \
            'Mod version: 3.0.5+neoforge.26.1.2-combat-look' \
            '' \
            'When /aspet look walking is active and /aspet combat on starts an owner-directed attack, the active mob becomes the temporary highest-priority look target. The existing smooth head yaw/pitch and body-turn controller is reused for that mob. The combat look target is cleared when pursuit ends, the mob dies/leaves range, combat is disabled, or combat state is cleared; ordinary WALKING owner/player tracking then resumes.' \
            '' \
            'OFF and ON semantics are unchanged. Existing look modes, tell-approach fix, held-item renderer fix, movement, combat damage/timing, health, persistence and other commands are preserved.' \
            '' \
            'Validation: exact 3.0.4 baseline checksum, narrow Java scope audit, full Java 25/NeoForge 26.1.2.95 production build, compiled-method inspection, packaged dependency check, and dedicated-server startup.' \
            'Visual tracking feel still requires in-game observation.' \
            > artifact/VALIDATION.txt
          rm -rf project/.gradle project/build project/run
          (cd project && zip -qr ../artifact/ArmorStandPet-NeoForge-26.1.2.95-combat-look-source.zip . -x '.git/*' '.github/*' '.gradle/*' 'build/*' 'run/*')
          sha256sum artifact/ArmorStandPet-NeoForge-26.1.2.95-combat-look.jar artifact/ArmorStandPet-NeoForge-26.1.2.95-combat-look-source.zip artifact/ArmorStandPet-NeoForge-26.1.2.95-combat-look.patch artifact/ArmorStandPet-NeoForge-26.1.2.95-combat-look-server-smoke.log artifact/VALIDATION.txt > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: armorstandpet-neoforge-26.1.2.95-combat-look
          path: artifact/
          if-no-files-found: error
