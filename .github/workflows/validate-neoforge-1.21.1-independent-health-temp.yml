name: Validate NeoForge 1.21.1 independent-health port

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact Fabric independent-health source
        uses: actions/download-artifact@v4
        with:
          name: armorstandpet-independent-1.21.1-source
          path: /tmp/exact-source
          run-id: 30869378177
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconstruct exact baseline and apply audited NeoForge port
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/exact-source && sha256sum --check armorstandpet-independent-1.21.1-source.tar.gz.sha256)
          mkdir baseline project
          tar -xzf /tmp/exact-source/armorstandpet-independent-1.21.1-source.tar.gz -C baseline
          cp -a baseline/. project/

          base64 --decode ci/neoforge-1.21.1-independent-health-port.patch.xz.b64 > /tmp/neoforge-port.patch.xz
          echo 'a53bd5af28378c8192f2a8e60e52c1ed0ce300c4628a3cd73b6546a3d170a2dd  /tmp/neoforge-port.patch.xz' | sha256sum --check
          xz --decompress --stdout /tmp/neoforge-port.patch.xz > /tmp/neoforge-port.patch
          echo '9d095f1e07db54340ff7bbe60f8384a001c6bc2161fe5fe761f106567f0efdff  /tmp/neoforge-port.patch' | sha256sum --check
          (cd project && patch --batch --forward -p1 < /tmp/neoforge-port.patch)

      - name: Verify exact behavior-preservation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          base = Path('baseline')
          port = Path('project')
          allowed_main_changes = {
              'io/github/kyzderp/armorstandpet/ASPetMod.java',
              'io/github/kyzderp/armorstandpet/Lang.java',
              'io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.java',
              'io/github/kyzderp/armorstandpet/config/ModConfig.java',
              'io/github/kyzderp/armorstandpet/entity/ModEntities.java',
              'io/github/kyzderp/armorstandpet/entity/StandFactory.java',
              'io/github/kyzderp/armorstandpet/hooks/BuildingCheck.java',
              'io/github/kyzderp/armorstandpet/listeners/PetRespawnListener.java',
              'io/github/kyzderp/armorstandpet/listeners/PlayerActionListener.java',
              'io/github/kyzderp/armorstandpet/scheduler/TickScheduler.java',
          }
          base_java = base / 'src/main/java'
          port_java = port / 'src/main/java'
          failures = []
          checked = 0
          for source in sorted(base_java.rglob('*.java')):
              rel = source.relative_to(base_java).as_posix()
              if rel in allowed_main_changes:
                  continue
              target = port_java / rel
              if not target.is_file() or source.read_bytes() != target.read_bytes():
                  failures.append(rel)
              checked += 1
          old_renderer = base / 'src/client/java/io/github/kyzderp/armorstandpet/client/PetArmorStandRenderer.java'
          new_renderer = port / 'src/main/java/io/github/kyzderp/armorstandpet/client/PetArmorStandRenderer.java'
          if old_renderer.read_bytes() != new_renderer.read_bytes():
              failures.append('PetArmorStandRenderer.java relocation changed content')
          if failures:
              print('Unexpected behavior-source changes:', *failures, sep='\n - ')
              sys.exit(1)
          print(f'Byte-for-byte preserved {checked} original Java files plus exact renderer relocation.')

          baseline_combat = (base_java / 'io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.java').read_text()
          port_combat = (port_java / 'io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.java').read_text()
          port_combat = port_combat.replace('public static void tick(MinecraftServer server)', 'private static void onServerTick(MinecraftServer server)')
          port_combat = port_combat.replace('public static void clearAll()', 'private static void clearAll()')
          baseline_combat = baseline_combat.replace('import net.fabricmc.fabric.api.event.lifecycle.v1.ServerLifecycleEvents;\n', '')
          baseline_combat = baseline_combat.replace('import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;\n', '')
          baseline_combat = baseline_combat.replace('\tprivate static boolean registered;\n', '')
          start = baseline_combat.index('\tpublic static synchronized void register()')
          end = baseline_combat.index('\n\t/**', start)
          baseline_combat = baseline_combat[:start] + baseline_combat[end+1:]
          if baseline_combat != port_combat:
              print('Combat controller differs beyond loader event wiring/visibility.')
              sys.exit(1)
          print('Combat controller algorithm is exactly preserved after loader normalization.')
          PY

          ! grep -R --line-number 'net\.fabricmc\|fabric\.mod\.json\|fabric-loom' project/src project/build.gradle project/settings.gradle project/gradle.properties
          grep -q 'public float health' project/src/main/java/io/github/kyzderp/armorstandpet/types/Pet.java
          grep -q 'healthModelVersion' project/src/main/java/io/github/kyzderp/armorstandpet/storage/PetData.java
          grep -q 'pet.health - appliedDamage' project/src/main/java/io/github/kyzderp/armorstandpet/combat/PetMortalityController.java
          grep -q 'stand.setHealth(MAX_HEALTH)' project/src/main/java/io/github/kyzderp/armorstandpet/combat/PetMortalityController.java
          grep -q 'MOVEMENT_STEP_INTERVAL_TICKS = 3L' project/src/main/java/io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.java
          grep -q 'ATTACK_COOLDOWN_TICKS = 20L' project/src/main/java/io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.java
          grep -q 'ATTACK_ANIMATION_TICKS = 9L' project/src/main/java/io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.java
          grep -q 'pet.animateWalk();' project/src/main/java/io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.java
          grep -q 'pet.takeStep();' project/src/main/java/io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.java
          grep -q '@Mod(ASPetMod.MOD_ID)' project/src/main/java/io/github/kyzderp/armorstandpet/ASPetMod.java
          grep -q 'DeferredRegister.create(Registries.ENTITY_TYPE' project/src/main/java/io/github/kyzderp/armorstandpet/entity/ModEntities.java
          grep -q 'registerEntityRenderer' project/src/main/java/io/github/kyzderp/armorstandpet/client/ClientModEvents.java
          grep -q 'TickScheduler.tick(server);' project/src/main/java/io/github/kyzderp/armorstandpet/neoforge/NeoForgeEventHandlers.java
          grep -q 'OwnerAttackCombatController.tick(server);' project/src/main/java/io/github/kyzderp/armorstandpet/neoforge/NeoForgeEventHandlers.java
          grep -q 'PlayerActionListener.tick(server);' project/src/main/java/io/github/kyzderp/armorstandpet/neoforge/NeoForgeEventHandlers.java
          grep -q 'FMLPaths.CONFIGDIR.get().resolve("armorstandpet")' project/src/main/java/io/github/kyzderp/armorstandpet/Lang.java
          grep -q 'FMLPaths.CONFIGDIR.get().resolve("armorstandpet")' project/src/main/java/io/github/kyzderp/armorstandpet/config/ModConfig.java
          grep -q 'mod_version=2.0.0+neoforge.1.21.1' project/gradle.properties
          test -f project/src/main/resources/META-INF/neoforge.mods.toml
          test ! -e project/src/main/resources/fabric.mod.json

      - name: Install official NeoForge 1.21.1 MDK wrapper
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/neoforge-mdk.zip https://github.com/NeoForgeMDKs/MDK-1.21.1-ModDevGradle/archive/refs/heads/main.zip
          unzip -q /tmp/neoforge-mdk.zip -d /tmp/neoforge-mdk
          mdk="$(find /tmp/neoforge-mdk -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$mdk"
          cp "$mdk/gradlew" project/
          cp "$mdk/gradlew.bat" project/
          rm -rf project/gradle
          cp -a "$mdk/gradle" project/
          chmod +x project/gradlew

      - name: Compile production NeoForge JAR
        working-directory: project
        run: ./gradlew clean build --stacktrace --no-daemon --console=plain

      - name: Smoke-test dedicated NeoForge server
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nserver-port=25585\n' > run/server.properties
          set +e
          (sleep 90; echo stop) | timeout 360s ./gradlew runServer --no-daemon --console=plain > ../neoforge-1.21.1-server-smoke.log 2>&1
          status=${PIPESTATUS[1]}
          set -e
          cat ../neoforge-1.21.1-server-smoke.log
          grep -q 'Done (' ../neoforge-1.21.1-server-smoke.log
          ! grep -q 'Failed to complete lifecycle event' ../neoforge-1.21.1-server-smoke.log
          ! grep -q 'Exception caught during firing event' ../neoforge-1.21.1-server-smoke.log
          ! grep -Eiq '(^|\]) *(ERROR|FATAL) ' ../neoforge-1.21.1-server-smoke.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi

      - name: Package validated JAR, source, patch and audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifact
          jar="$(find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          test -n "$jar"
          cp "$jar" artifact/ArmorStandPet-NeoForge-1.21.1-independent-health.jar
          cp neoforge-1.21.1-server-smoke.log artifact/ArmorStandPet-NeoForge-1.21.1-independent-health-server-smoke.log
          cp /tmp/neoforge-port.patch artifact/ArmorStandPet-Fabric-1.21.1-to-NeoForge-1.21.1-port.patch
          unzip -t artifact/ArmorStandPet-NeoForge-1.21.1-independent-health.jar
          unzip -p artifact/ArmorStandPet-NeoForge-1.21.1-independent-health.jar META-INF/neoforge.mods.toml | grep -q 'modId="armorstandpet"'
          jar tf artifact/ArmorStandPet-NeoForge-1.21.1-independent-health.jar | grep -q 'io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.class'
          jar tf artifact/ArmorStandPet-NeoForge-1.21.1-independent-health.jar | grep -q 'io/github/kyzderp/armorstandpet/client/PetArmorStandRenderer.class'
          ! jar tf artifact/ArmorStandPet-NeoForge-1.21.1-independent-health.jar | grep -q 'fabric.mod.json'
          cat > artifact/PORT_VALIDATION.txt <<'EOF'
          ArmorStandPet NeoForge 1.21.1 independent-health port
          =====================================================
          Exact source baseline: Fabric 1.21.1 independent-health commit e1dac61fd7648c13c728ccc8bfb04b280ea9e9bc
          Port version: 2.0.0+neoforge.1.21.1
          Minecraft: 1.21.1
          NeoForge: 21.1.244
          Java: 21

          Validation performed:
          - exact preserved-source artifact checksum verification
          - strict source allowlist and byte-for-byte parity checks
          - normalized combat-controller equality check
          - independent-health and persistence marker checks
          - full NeoForge production compilation
          - JAR metadata/archive/class inspection
          - dedicated NeoForge server startup smoke test

          Movement, pathfinding, pet-type, animation, action, command, storage,
          attack cadence, damage, enchantment and durability algorithms were not
          rewritten for this port. Loader-specific lifecycle, event, registry,
          renderer, configuration-path and protection-hook integration was replaced
          with NeoForge 1.21.1 equivalents.
          EOF
          rm -rf project/.gradle project/build project/run
          (cd project && zip -qr ../artifact/ArmorStandPet-NeoForge-1.21.1-independent-health-source.zip . -x '.git/*' '.github/*' '.gradle/*' 'build/*' 'run/*')
          sha256sum artifact/*.jar artifact/*-source.zip artifact/*.patch > artifact/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: armorstandpet-neoforge-1.21.1-independent-health
          path: artifact/
          if-no-files-found: error
