name: Diagnose Forge port script

on:
  push:
    branches: [port/forge-1.20.1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and validate script
        shell: bash
        run: |
          set -euo pipefail
          cat ci/forge-port-script.b64.part-* | base64 --decode > port-to-forge-1.20.1.py
          wc -c port-to-forge-1.20.1.py
          sha256sum port-to-forge-1.20.1.py
          python3 -m py_compile port-to-forge-1.20.1.py
      - uses: actions/upload-artifact@v4
        with:
          name: assembled-forge-port-script
          path: port-to-forge-1.20.1.py
          if-no-files-found: error
