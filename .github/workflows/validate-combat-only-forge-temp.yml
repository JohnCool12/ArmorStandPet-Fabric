name: Validate combat-only Forge smoothing

on:
  pull_request:
    branches: [port/forge-1.20.1]

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact independent-health source input
        uses: actions/download-artifact@v4
        with:
          name: armorstandpet-independent-1.21.1-source
          path: /tmp/exact-source
          run-id: 30869378177
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct, validate, build, and smoke-test
        run: bash ci/run-forge-combat-only-validation.sh
      - name: Upload validated combat-only build
        uses: actions/upload-artifact@v4
        with:
          name: armorstandpet-forge-1.20.1-combat-only-smoothing
          path: artifact/
          if-no-files-found: error
