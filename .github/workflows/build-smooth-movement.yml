name: Build ArmorStandPet smooth movement

on:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Download validated independent-health source
        uses: actions/download-artifact@v4
        with:
          name: armorstandpet-complete-source
          path: /tmp/base-source
          run-id: 30740390219
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply smooth movement patch
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/base-source && sha256sum --check armorstandpet-complete-source.tar.gz.sha256)
          mkdir project
          tar -xzf /tmp/base-source/armorstandpet-complete-source.tar.gz -C project

          base64 --decode ci/smooth-movement-v2.patch.xz.b64 > /tmp/smooth-movement.patch.xz
          echo 'fc54c09c69c03af4ee511ceccb32e261df176333ceb9bf9ff8ee172735f818de  /tmp/smooth-movement.patch.xz' | sha256sum --check
          xz --decompress --stdout /tmp/smooth-movement.patch.xz > /tmp/smooth-movement.patch
          (cd project && patch --batch --forward -p4 < /tmp/smooth-movement.patch)
          sed -i 's/^mod_version=.*/mod_version=2.0.1+1.21.1/' project/gradle.properties

      - name: Validate movement and health source
        shell: bash
        run: |
          set -euo pipefail
          pet=project/src/main/java/io/github/kyzderp/armorstandpet/types/Pet.java
          combat=project/src/main/java/io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.java
          chase=project/src/main/java/io/github/kyzderp/armorstandpet/tasks/ChasePathTask.java
          mortality=project/src/main/java/io/github/kyzderp/armorstandpet/combat/PetMortalityController.java

          grep -q 'MOVEMENT_UPDATE_INTERVAL_TICKS = 1L' "$pet"
          grep -q 'LEGACY_MOVEMENT_INTERVAL_TICKS = 3.0D' "$pet"
          grep -q 'advanceWalkingTickToward' "$pet"
          grep -q 'MAX_COMBAT_YAW_CHANGE_PER_TICK = 35.0F' "$combat"
          grep -q 'ATTACK_APPROACH_DISTANCE = 1.75D' "$combat"
          grep -q 'stand.setRightArmPose(RIGHT_ARM_ATTACK_POSE)' "$combat"
          ! grep -q 'nextMovementTick' "$combat"
          grep -q 'MAX_NODE_MOVEMENT_TICKS = 60' "$chase"
          grep -q 'pet.health - appliedDamage' "$mortality"
          grep -q 'mod_version=2.0.1+1.21.1' project/gradle.properties

      - name: Build production JAR
        working-directory: project
        run: gradle clean build --stacktrace --no-daemon --console=plain

      - name: Smoke-test dedicated server startup
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nserver-port=25581\n' > run/server.properties
          set +e
          (sleep 45; echo stop) | timeout 120s gradle runServer --no-daemon --console=plain > ../server-smoke.log 2>&1
          status=${PIPESTATUS[1]}
          set -e
          cat ../server-smoke.log
          grep -q 'Done (' ../server-smoke.log
          ! grep -q 'Could not execute entrypoint' ../server-smoke.log
          ! grep -q 'Failed to start the minecraft server' ../server-smoke.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

      - name: Package validated build and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifact
          find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} artifact/ \;
          jar="$(find artifact -maxdepth 1 -type f -name '*.jar' -print -quit)"
          test -n "$jar"
          unzip -t "$jar"
          unzip -p "$jar" fabric.mod.json | grep -q '"minecraft": "~1.21.1"'
          unzip -p "$jar" fabric.mod.json | grep -q '"version": "2.0.1+1.21.1"'
          jar tf "$jar" | grep -qx 'io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.class'
          jar tf "$jar" | grep -qx 'io/github/kyzderp/armorstandpet/combat/PetMortalityController.class'

          cp server-smoke.log artifact/
          tar -czf artifact/ArmorStandPet-Fabric-1.21.1-independent-health-smooth-movement-source.tar.gz -C project .
          sha256sum artifact/* > artifact/SHA256SUMS.txt

      - name: Upload validated smooth movement build
        uses: actions/upload-artifact@v4
        with:
          name: armorstandpet-fabric-1.21.1-smooth-movement
          path: artifact/
          if-no-files-found: error
