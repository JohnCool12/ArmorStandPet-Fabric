name: Validate ArmorStandPet 26.1.2.95 tell approach fix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Download exact validated small-hand baseline
        uses: actions/download-artifact@v4
        with:
          name: armorstandpet-neoforge-26.1.2.95-small-hand-render-fix
          path: /tmp/base-artifact
          run-id: 34113273726
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct and audit narrow tell fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf baseline project artifact
          mkdir baseline project artifact
          source_zip=/tmp/base-artifact/ArmorStandPet-NeoForge-26.1.2.95-small-hand-render-fix-source.zip
          echo '9f920e422799597be72982ebeb97d8073c386ba108d154bb4bed18171ffd840a  '"$source_zip" | sha256sum --check
          unzip -q "$source_zip" -d baseline
          cp -a baseline/. project/
          (cd project && patch --batch --forward -p1 < ../ci/armorstandpet-neoforge-26.1.2.95-tell-approach-fix.patch)
          cp ci/armorstandpet-neoforge-26.1.2.95-tell-approach-fix.patch artifact/ArmorStandPet-NeoForge-26.1.2.95-tell-approach-fix.patch
          python3 - <<'PY'
          from pathlib import Path
          import sys
          base = Path('baseline/src/main/java')
          new = Path('project/src/main/java')
          allowed = {'io/github/kyzderp/armorstandpet/tasks/ChasePathTask.java'}
          bad = []
          checked = 0
          for src in sorted(base.rglob('*.java')):
              rel = src.relative_to(base).as_posix()
              if rel in allowed:
                  continue
              dst = new / rel
              if not dst.is_file() or src.read_bytes() != dst.read_bytes():
                  bad.append(rel)
              checked += 1
          if bad:
              print('Unexpected production Java changes:', *bad, sep='\n - ')
              sys.exit(1)
          print(f'Byte-for-byte preserved {checked} production Java files outside ChasePathTask.java')

          text = (new / 'io/github/kyzderp/armorstandpet/tasks/ChasePathTask.java').read_text()
          helper = 'finishImperativePlayerApproachIfCloseEnough()'
          call = 'if (this.finishImperativePlayerApproachIfCloseEnough())'
          path_same = 'if (this.path.isSame)'
          if helper not in text or call not in text:
              raise SystemExit('Missing close-enough interaction completion guard')
          if text.index(call) > text.index(path_same):
              raise SystemExit('Close-enough guard must execute before path.isSame teleport branch')
          if '!this.imperative || this.player == null || this.playerDistance == null' not in text:
              raise SystemExit('Guard is not restricted to imperative interaction chases')
          if 'this.pet.distanceSq(this.player) > this.playerDistance' not in text:
              raise SystemExit('Guard does not use the existing chase interaction distance semantics')
          PY
          grep -q '^minecraft_version=26.1.2$' project/gradle.properties
          grep -q '^neo_version=26.1.2.95$' project/gradle.properties
          grep -Fq 'mod_version=3.0.3+neoforge.26.1.2-tell-approach-fix' project/gradle.properties
      - name: Build production JAR
        working-directory: project
        run: ./gradlew clean build --stacktrace --no-daemon --console=plain
      - name: Verify packaged metadata and compiled chase logic
        shell: bash
        run: |
          set -euo pipefail
          javap -classpath project/build/classes/java/main -c -p io.github.kyzderp.armorstandpet.tasks.ChasePathTask > artifact/ChasePathTask-javap.txt
          grep -Fq 'finishImperativePlayerApproachIfCloseEnough' artifact/ChasePathTask-javap.txt
          jar="$(find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          test -n "$jar"
          unzip -p "$jar" META-INF/neoforge.mods.toml > /tmp/neoforge.mods.toml
          grep -Fq 'versionRange="[26.1.2.95,)"' /tmp/neoforge.mods.toml
          cp "$jar" artifact/ArmorStandPet-NeoForge-26.1.2.95-tell-approach-fix.jar
      - name: Dedicated-server smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project/run
          printf 'eula=true\n' > project/run/eula.txt
          printf 'online-mode=false\nserver-port=25592\n' > project/run/server.properties
          set +e
          (cd project && (sleep 90; echo stop) | timeout 360s ./gradlew runServer --no-daemon --console=plain) > artifact/ArmorStandPet-NeoForge-26.1.2.95-tell-approach-fix-server-smoke.log 2>&1
          status=$?
          set -e
          cat artifact/ArmorStandPet-NeoForge-26.1.2.95-tell-approach-fix-server-smoke.log
          grep -q 'Done (' artifact/ArmorStandPet-NeoForge-26.1.2.95-tell-approach-fix-server-smoke.log
          grep -q 'ArmorStandPet NeoForge 26.1.2 initialized.' artifact/ArmorStandPet-NeoForge-26.1.2.95-tell-approach-fix-server-smoke.log
          ! grep -Eiq '(^|\]) *(ERROR|FATAL) ' artifact/ArmorStandPet-NeoForge-26.1.2.95-tell-approach-fix-server-smoke.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
      - name: Package validated files
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'ArmorStandPet NeoForge 26.1.2.95 tell approach fix' \
            '=================================================' \
            'Minecraft: 26.1.2' \
            'NeoForge: 26.1.2.95' \
            'Java: 25' \
            'Mod version: 3.0.3+neoforge.26.1.2-tell-approach-fix' \
            '' \
            'Fix: imperative interaction chases (/aspet tell, insult, hug) now complete as soon as the pet reaches the command existing interaction-distance threshold. The check happens before path-is-same/endpoint handling, preventing the pet from walking into the target block and then using teleportToFrontOf as a corrective movement.' \
            '' \
            'Scope: only ChasePathTask.java changed in production Java. Non-imperative owner-follow and return chases are excluded by the imperative guard and retain their previous behavior. The prior small-armor-stand hand-render fix is preserved.' \
            '' \
            'Validation: exact previous source checksum; source-scope byte comparison; full NeoForge 26.1.2.95 production build; compiled ChasePathTask inspection; packaged dependency check; dedicated-server startup.' \
            > artifact/VALIDATION.txt
          rm -rf project/.gradle project/build project/run
          (cd project && zip -qr ../artifact/ArmorStandPet-NeoForge-26.1.2.95-tell-approach-fix-source.zip . -x '.git/*' '.github/*' '.gradle/*' 'build/*' 'run/*')
          sha256sum artifact/ArmorStandPet-NeoForge-26.1.2.95-tell-approach-fix.jar artifact/ArmorStandPet-NeoForge-26.1.2.95-tell-approach-fix-source.zip artifact/ArmorStandPet-NeoForge-26.1.2.95-tell-approach-fix.patch artifact/ArmorStandPet-NeoForge-26.1.2.95-tell-approach-fix-server-smoke.log artifact/ChasePathTask-javap.txt artifact/VALIDATION.txt > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: armorstandpet-neoforge-26.1.2.95-tell-approach-fix
          path: artifact/
          if-no-files-found: error
