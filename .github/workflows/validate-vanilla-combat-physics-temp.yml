name: Validate Forge vanilla combat physics

on:
  pull_request:
    branches: [port/forge-1.20.1]

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download exact interaction-fixed source input
        uses: actions/download-artifact@v4
        with:
          name: armorstandpet-independent-1.21.1-source
          path: /tmp/exact-source
          run-id: 30869378177
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconstruct, validate, build, and smoke-test
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/exact-source && sha256sum --check armorstandpet-independent-1.21.1-source.tar.gz.sha256)
          mkdir project
          tar -xzf /tmp/exact-source/armorstandpet-independent-1.21.1-source.tar.gz -C project

          cat ci/forge-port-script.b64.part-* | base64 --decode > /tmp/port-to-forge-1.20.1.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/port-to-forge-1.20.1.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace('return ItemStackEMPTY;', 'return ItemStack.EMPTY;')
          source = source.replace(
              "t = t.replace('\\n,\\t\\tHolderLookup.Provider registries = ASPetMod.getServer().registryAccess();\\n', '\\n')",
              "t = t.replace('\\n\\t\\tHolderLookup.Provider registries = ASPetMod.getServer().registryAccess();\\n', '\\n')",
          )
          path.write_text(source, encoding='utf-8')
          PY
          echo 'a73ae11aaac1ce330e459516c4371e3d06694c2bbf039c663cf3615d6c6615c0  /tmp/port-to-forge-1.20.1.py' | sha256sum --check
          python3 /tmp/port-to-forge-1.20.1.py
          python3 ci/fix-forge-1.20.1-compile.py

          base64 --decode ci/forge-vanilla-combat-physics.patch.xz.b64 > /tmp/vanilla-combat.patch.xz
          echo '6d2775e14803fb36070c58bfcdca46fa49f2944048c21860ba20fe6156dfbd7b  /tmp/vanilla-combat.patch.xz' | sha256sum --check
          xz --decompress --stdout /tmp/vanilla-combat.patch.xz > /tmp/vanilla-combat.patch
          (cd project && patch --batch --forward -p1 < /tmp/vanilla-combat.patch)

          src=project/src/main/java/io/github/kyzderp/armorstandpet
          combat="$src/combat/OwnerAttackCombatController.java"
          events="$src/forge/ForgeEventHandlers.java"
          grep -q 'applyVanillaCombatVelocity' "$combat"
          grep -q 'stand.setGravity(true)' "$combat"
          grep -q 'stand.setDeltaMovement' "$combat"
          grep -q 'stand.setGravity(state.restoreGravity)' "$combat"
          grep -q 'TickEvent.Phase.START' "$events"
          ! grep -q 'resolveCombatTerrain\|GRAVITY_ACCELERATION_PER_TICK\|MAX_FALL_SPEED_PER_TICK\|PathFinder.isWalkable\|teleportStandTo\|CombatPosition' "$combat"

          cd project
          echo '2f7a71169121931eefc2840be37d4e692920e0a3caf334e3f3b50231ceec6bd0  src/main/java/io/github/kyzderp/armorstandpet/tasks/WalkPlayerTask.java' | sha256sum --check
          echo '95e3bbfcc3efc4c5fc9593794a13b3d7d33f9c4d08215ff714aaa7def38dedc0  src/main/java/io/github/kyzderp/armorstandpet/tasks/WalkLocTask.java' | sha256sum --check
          echo '0a2e54bf1dea473377222c6b11fcd69ccc824f92b623057980609e6a620c6cbe  src/main/java/io/github/kyzderp/armorstandpet/tasks/ChasePathTask.java' | sha256sum --check
          echo 'd53e039367b14dc38a30e670c9a724ef528dd1beaa16edbd4c6d6a1251196e67  src/main/java/io/github/kyzderp/armorstandpet/types/NeedyChildPet.java' | sha256sum --check
          echo '71954d69bdc1b4215281284376d95ea9d2b6033394b6129ae5f27909a91f349a  src/main/java/io/github/kyzderp/armorstandpet/types/SillyWalkerPet.java' | sha256sum --check
          echo 'c47bcecd2bd3a4aa9e1a25f6faf3f0ac2ff1dc1191ad7468be72e461307879f6  src/main/java/io/github/kyzderp/armorstandpet/types/DemonPet.java' | sha256sum --check
          grep -q 'PlayerInteractEvent.EntityInteractSpecific event' src/main/java/io/github/kyzderp/armorstandpet/forge/ForgeEventHandlers.java
          grep -q 'public float health' src/main/java/io/github/kyzderp/armorstandpet/types/Pet.java
          grep -q 'pet.health - appliedDamage' src/main/java/io/github/kyzderp/armorstandpet/combat/PetMortalityController.java
          grep -q 'mod_version=2.0.2+forge.1.20.1-vanilla-combat-physics' gradle.properties

          curl --fail --location --retry 3 -o /tmp/forge-mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip
          unzip -q /tmp/forge-mdk.zip -d /tmp/forge-mdk
          cp /tmp/forge-mdk/gradlew .
          cp /tmp/forge-mdk/gradlew.bat .
          rm -rf gradle
          cp -a /tmp/forge-mdk/gradle .
          chmod +x gradlew
          ./gradlew clean build --stacktrace --no-daemon --console=plain

          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nserver-port=25583\n' > run/server.properties
          set +e
          (sleep 60; echo stop) | timeout 180s ./gradlew runServer --no-daemon --console=plain > ../forge-vanilla-combat-server-smoke.log 2>&1
          status=${PIPESTATUS[1]}
          set -e
          cat ../forge-vanilla-combat-server-smoke.log
          grep -q 'Done (' ../forge-vanilla-combat-server-smoke.log
          ! grep -q 'Failed to complete lifecycle event' ../forge-vanilla-combat-server-smoke.log
          ! grep -q 'Exception caught during firing event' ../forge-vanilla-combat-server-smoke.log
          ! grep -Eiq '(^|\]) *(ERROR|FATAL) ' ../forge-vanilla-combat-server-smoke.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi

          cd ..
          mkdir artifact
          jar="$(find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          test -n "$jar"
          cp "$jar" artifact/ArmorStandPet-Forge-1.20.1-vanilla-combat-physics.jar
          cp forge-vanilla-combat-server-smoke.log artifact/
          unzip -t artifact/ArmorStandPet-Forge-1.20.1-vanilla-combat-physics.jar
          javap -classpath artifact/ArmorStandPet-Forge-1.20.1-vanilla-combat-physics.jar -p -c io.github.kyzderp.armorstandpet.combat.OwnerAttackCombatController | tee artifact/OwnerAttackCombatController.javap.txt
          grep -q 'applyVanillaCombatVelocity' artifact/OwnerAttackCombatController.javap.txt
          grep -q 'PetArmorStandEntity.setGravity' artifact/OwnerAttackCombatController.javap.txt
          grep -q 'PetArmorStandEntity.setDeltaMovement' artifact/OwnerAttackCombatController.javap.txt
          ! grep -q 'resolveCombatTerrain' artifact/OwnerAttackCombatController.javap.txt
          rm -rf project/.gradle project/build project/run
          (cd project && zip -qr ../artifact/ArmorStandPet-Forge-1.20.1-vanilla-combat-physics-source.zip . -x '.git/*' '.github/*' '.gradle/*' 'build/*' 'run/*')
          sha256sum artifact/*.jar artifact/*-source.zip > artifact/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: armorstandpet-forge-1.20.1-vanilla-combat-physics
          path: artifact/
          if-no-files-found: error
