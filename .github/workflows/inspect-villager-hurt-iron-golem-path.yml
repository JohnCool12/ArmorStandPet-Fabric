name: Inspect Vanilla Villager Hurt Iron Golem Path

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Populate Loom Minecraft cache
        shell: bash
        run: |
          set -euo pipefail
          cat ci/egpatch.part-* | base64 --decode > /tmp/fabric-port.patch.xz
          git clone -q https://github.com/bigenergy/extra-golems-reborn.git project
          cd project
          git checkout -q 6b21ec4a59ca16e8362b26e38fc63b2807042bdf
          xz -dc /tmp/fabric-port.patch.xz | patch -p4 --batch --forward >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix1.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix2.patch >/dev/null
          gradle classes --no-daemon >/dev/null
      - name: Disassemble relevant vanilla classes
        shell: bash
        run: |
          set -euo pipefail
          found=''
          while IFS= read -r j; do
            if jar tf "$j" 2>/dev/null | grep -q '^net/minecraft/world/entity/npc/Villager.class$'; then
              found="$j"; break
            fi
          done < <(find ~/.gradle project/.gradle -type f -name '*.jar' 2>/dev/null)
          test -n "$found"
          echo "FOUND=$found"
          echo '===== Villager methods ====='
          javap -classpath "$found" -p -c -l net.minecraft.world.entity.npc.Villager > /tmp/Villager.javap
          sed -n '/setLastHurtByMob/,/^  [a-zA-Z].*(/p' /tmp/Villager.javap | head -260 || true
          sed -n '/onReputationEventFrom/,/^  [a-zA-Z].*(/p' /tmp/Villager.javap | head -320 || true
          echo '===== ServerLevel reputation/event methods ====='
          javap -classpath "$found" -p -c -l net.minecraft.server.level.ServerLevel > /tmp/ServerLevel.javap
          grep -n -A220 -B20 -E 'onReputationEvent|ReputationEvent|broadcastEntityEvent' /tmp/ServerLevel.javap | head -700 || true
          echo '===== ReputationEventHandler interface ====='
          javap -classpath "$found" -p -c net.minecraft.world.entity.ai.village.ReputationEventHandler 2>/dev/null || true
          echo '===== Villager references to IronGolem / setTarget / getEntitiesOfClass ====='
          grep -n -A80 -B30 -E 'IronGolem|setTarget|getEntitiesOfClass|getNearbyEntities|VILLAGER_HURT' /tmp/Villager.javap | head -1200 || true
          echo '===== IronGolem non-goal methods mentioning villager / attacker / target ====='
          javap -classpath "$found" -p -c -l net.minecraft.world.entity.animal.IronGolem > /tmp/IronGolem.javap
          grep -n -A100 -B30 -E 'Villager|LastHurt|setTarget|Reputation|Player' /tmp/IronGolem.javap | head -1600 || true
