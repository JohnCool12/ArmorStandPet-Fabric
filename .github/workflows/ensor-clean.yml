name: Ensorcellation clean CI

on:
  push:
    branches:
      - chatgpt/ensorcellation-clean-ci-20260815
  pull_request:
    branches:
      - main

concurrency:
  group: ensorcellation-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Reconstruct and verify clean port snapshot
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ensor
          cat ensor-clean-ci/part* | base64 -d > /tmp/ensor/project.tar.xz
          echo "f3251ef65c7eb85e0beee8846a5e31f7f2bf42b890fff80e133f8b205073fc70  /tmp/ensor/project.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ensor/project.tar.xz -C /tmp/ensor
          chmod +x /tmp/ensor/Ensorcellation-Fabric-1.21.1-clean/gradlew

      - name: Apply clean-port CI overlays
        shell: bash
        run: |
          set -euxo pipefail
          if [ -d ensor-clean-ci/overlay ]; then
            cp -a ensor-clean-ci/overlay/. /tmp/ensor/Ensorcellation-Fabric-1.21.1-clean/
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Extract official Minecraft 1.21.1 mapping diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL 'https://piston-data.mojang.com/v1/objects/2244b6f072256667bcd9a73df124d6c58de77992/client.txt' -o /tmp/ensor/client-mappings.txt
          python3 - <<'PY' > /tmp/ensor/mapping-diagnostic.txt
          from pathlib import Path
          lines = Path('/tmp/ensor/client-mappings.txt').read_text().splitlines()
          wanted = {
              'net.minecraft.world.level.block.state.BlockBehaviour$BlockStateBase',
              'net.minecraft.world.item.RangedWeaponItem',
              'net.minecraft.world.item.BowItem',
              'net.minecraft.world.entity.projectile.FishingHook',
              'net.minecraft.world.entity.LivingEntity',
          }
          keep = False
          current = None
          for line in lines:
              stripped = line.strip()
              is_class = bool(stripped) and stripped.endswith(':') and ' -> ' in stripped
              if is_class:
                  current = stripped.split(' -> ', 1)[0]
                  keep = current in wanted
                  if keep:
                      print('\n###', current)
                      print(line)
              elif keep:
                  print(line)
          PY
          cat /tmp/ensor/mapping-diagnostic.txt

      - name: Build against real Minecraft 1.21.1 and Fabric dependencies
        shell: bash
        working-directory: /tmp/ensor/Ensorcellation-Fabric-1.21.1-clean
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace build 2>&1 | tee /tmp/ensor/build.log

      - name: Upload build outputs, diagnostics and full log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ensorcellation-clean-ci
          if-no-files-found: warn
          path: |
            /tmp/ensor/build.log
            /tmp/ensor/mapping-diagnostic.txt
            /tmp/ensor/Ensorcellation-Fabric-1.21.1-clean/cofh-core/build/libs/*.jar
            /tmp/ensor/Ensorcellation-Fabric-1.21.1-clean/ensorcellation/build/libs/*.jar
