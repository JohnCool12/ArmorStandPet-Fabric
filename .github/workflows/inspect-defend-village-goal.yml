name: Inspect Vanilla DefendVillageTargetGoal

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Populate Loom Minecraft cache
        shell: bash
        run: |
          set -euo pipefail
          cat ci/egpatch.part-* | base64 --decode > /tmp/fabric-port.patch.xz
          git clone -q https://github.com/bigenergy/extra-golems-reborn.git project
          cd project
          git checkout -q 6b21ec4a59ca16e8362b26e38fc63b2807042bdf
          xz -dc /tmp/fabric-port.patch.xz | patch -p4 --batch --forward >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix1.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix2.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-bedrock-targetable.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix4.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-advanced-swim.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-surface-swim.patch >/dev/null
          gradle classes --no-daemon >/dev/null
      - name: Find and disassemble vanilla goal
        shell: bash
        run: |
          set -euo pipefail
          found=''
          while IFS= read -r j; do
            if jar tf "$j" 2>/dev/null | grep -q '^net/minecraft/world/entity/ai/goal/target/DefendVillageTargetGoal.class$'; then
              found="$j"
              echo "FOUND_MINECRAFT_JAR=$j"
              break
            fi
          done < <(find ~/.gradle project/.gradle -type f -name '*.jar' 2>/dev/null)
          test -n "$found"
          javap -classpath "$found" -p -c -l net.minecraft.world.entity.ai.goal.target.DefendVillageTargetGoal
          echo '--- IronGolem registerGoals ---'
          javap -classpath "$found" -p -c net.minecraft.world.entity.animal.IronGolem | sed -n '/registerGoals/,/}/p' | head -250 || true
