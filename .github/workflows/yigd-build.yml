name: Build YIGD NeoForge 26.1.2

on:
  push:
    branches:
      - chatgpt-yigd-26.1.2-build
    paths:
      - '.github/workflows/yigd-build.yml'
      - 'ci/yigd-patch.part-*'
      - 'ci/yigd-hotfix.patch'
      - 'ci/yigd-hotfix.patch.xz'
      - 'ci/yigd-hotfix2.patch'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build carrier
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Restore YIGD 26.1.2 source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 1.21-neoforge https://github.com/B1n-ry/Youre-in-grave-danger.git /tmp/yigd
          cat ci/yigd-patch.part-* | base64 --decode > /tmp/yigd.patch.xz
          echo '5993a1f2c914805de35cdcb008d8e2ca9fd43d6cf2e882df586c86831c873651  /tmp/yigd.patch.xz' | sha256sum --check
          xz -dc /tmp/yigd.patch.xz > /tmp/yigd.patch
          xz -dc ci/yigd-hotfix.patch.xz > /tmp/yigd-hotfix.patch
          echo 'a283a9afd3130078658b9fc00a69be83de642946e3011177f442102e96cfdb6b  /tmp/yigd-hotfix.patch' | sha256sum --check
          echo '5a985f358cf94f7f43f733c8e0a805b1558e68f9ce79c82ef8d6278a5ecab349  ci/yigd-hotfix2.patch' | sha256sum --check
          cd /tmp/yigd
          git apply --check /tmp/yigd.patch
          git apply /tmp/yigd.patch
          git apply --check /tmp/yigd-hotfix.patch
          git apply /tmp/yigd-hotfix.patch
          git apply --check "$GITHUB_WORKSPACE/ci/yigd-hotfix2.patch"
          git apply "$GITHUB_WORKSPACE/ci/yigd-hotfix2.patch"
          chmod +x gradlew
          grep -E 'minecraft_version|neo_version|mod_version' gradle.properties

      - name: Build YIGD
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/yigd
          gradle clean build --stacktrace --no-daemon

      - name: Collect production JAR
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifact
          find /tmp/yigd/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} artifact/ \;
          test -n "$(find artifact -maxdepth 1 -type f -name '*.jar' -print -quit)"
          sha256sum artifact/*.jar
          ls -lah artifact

      - name: Upload YIGD mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: yigd-neoforge-26.1.2
          path: artifact/*.jar
          if-no-files-found: error
