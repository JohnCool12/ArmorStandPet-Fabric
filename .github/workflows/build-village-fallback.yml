name: Build Village Golem Fallback Fix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Reconstruct cumulative production source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/egpatch.part-* | base64 --decode > /tmp/fabric-port.patch.xz
          echo '8b5eb02294d41d7ef3af71ce280dcded9920b2ae097f73043cf60c751f94c7ba  /tmp/fabric-port.patch.xz' | sha256sum --check
          git clone -q https://github.com/bigenergy/extra-golems-reborn.git project
          cd project
          git checkout -q 6b21ec4a59ca16e8362b26e38fc63b2807042bdf
          xz -dc /tmp/fabric-port.patch.xz | patch -p4 --batch --forward >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix1.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix2.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-bedrock-targetable.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix4.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-advanced-swim.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-surface-swim.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-bedrock-provocation.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-all-eyes-neutral.patch >/dev/null
          cp ../ci/GolemFinalEyesLayer.java src/main/java/com/mcmoddev/golems/client/entity/layer/GolemFinalEyesLayer.java
          cd ..
          python3 ci/apply-strict-neutral.py >/dev/null
          python3 ci/apply-legacy-neutral-migration.py >/dev/null
          python3 ci/apply-hybrid-village-neutral.py >/dev/null
          python3 ci/apply-bedrock-natural-hostility.py >/dev/null
          python3 ci/apply-stable-village-targeting.py >/dev/null
          python3 ci/apply-bedrock-true-vanilla-natural-ai.py >/dev/null
          python3 ci/apply-all-constructed-natural-ai.py >/dev/null
          python3 ci/apply-village-runtime-parity-fix.py >/dev/null
          python3 ci/apply-individual-player-target-provenance.py >/dev/null
          python3 ci/apply-minimum-iron-golem-speed.py >/dev/null
          python3 ci/apply-sculk-catalyst-player-blindness-exemption.py >/dev/null
          python3 ci/refine-sculk-catalyst-player-blindness-predicate.py >/dev/null
          python3 ci/apply-village-golem-pretracking-initialization.py >/dev/null
          python3 ci/apply-village-golem-failed-replacement-fallback.py

          grep -q 'if (spawned.isPresent())' project/src/main/java/com/mcmoddev/golems/mixin/VillagerMixin.java
          grep -q 'golem.getContainer().isPresent()' project/src/main/java/com/mcmoddev/golems/mixin/VillagerMixin.java
          grep -q 'golem.discard();' project/src/main/java/com/mcmoddev/golems/mixin/VillagerMixin.java
          grep -q 'return SpawnUtil.trySpawnMob(entityType' project/src/main/java/com/mcmoddev/golems/mixin/VillagerMixin.java
          cp project/src/main/java/com/mcmoddev/golems/mixin/VillagerMixin.java /tmp/production-VillagerMixin.java
          cp project/build.gradle /tmp/production-build.gradle
          cp project/src/main/resources/fabric.mod.json /tmp/production-fabric.mod.json

      - name: Install forced failed-replacement fallback GameTest
        shell: bash
        run: |
          set -euo pipefail
          cat >> project/build.gradle <<'EOF'

          loom {
              runs {
                  gametest {
                      server()
                      name "Village Failed Replacement Fallback Game Test"
                      vmArg "-Dfabric-api.gametest"
                      vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
                      runDir "run/gametest"
                  }
              }
          }
          EOF
          python3 ci/inject-village-fallback-gametest.py
          python3 ci/fix-village-fallback-gametest-strategy.py

      - name: Require failed Extra replacement to spawn vanilla Iron Golem
        working-directory: project
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p run/gametest
          printf 'eula=true\n' > run/gametest/eula.txt
          set +e
          gradle runGametest --no-daemon > ../village-fallback-gametest.log 2>&1
          status=$?
          set -e
          test -f build/junit.xml || { tail -500 ../village-fallback-gametest.log; exit 1; }
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases=list(ET.parse('build/junit.xml').getroot().iter('testcase'))
          wanted=[c for c in cases if 'failedextrareplacementfallsbacktovanillairongolem' in c.attrib.get('name','').lower()]
          if len(wanted)!=1: raise SystemExit('Village fallback GameTest missing/duplicate')
          node=wanted[0].find('failure') or wanted[0].find('error')
          if node is not None: raise SystemExit('Village fallback GameTest failed: '+str(node.attrib.get('message')))
          print('PASS: forced empty Extra replacement immediately fell back to a real minecraft:iron_golem.')
          PY
          if [ "$status" -ne 0 ]; then tail -500 ../village-fallback-gametest.log; exit 1; fi

      - name: Restore production source after GameTest
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/production-VillagerMixin.java project/src/main/java/com/mcmoddev/golems/mixin/VillagerMixin.java
          cp /tmp/production-build.gradle project/build.gradle
          cp /tmp/production-fabric.mod.json project/src/main/resources/fabric.mod.json
          rm -f project/src/main/java/com/mcmoddev/golems/test/VillageReplacementFallbackGameTest.java
          rm -rf project/run/gametest project/build/junit.xml

      - name: Build production JAR
        working-directory: project
        run: gradle clean build --stacktrace --no-daemon

      - name: Verify compiled fallback and cumulative resources
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          javap -classpath build/classes/java/main -p -c com.mcmoddev.golems.mixin.VillagerMixin > ../villager-fallback.txt
          grep -q 'Optional.isPresent' ../villager-fallback.txt
          grep -q 'GolemBase.getContainer' ../villager-fallback.txt
          grep -q 'GolemBase.discard' ../villager-fallback.txt
          count=$(grep -c 'SpawnUtil.trySpawnMob' ../villager-fallback.txt || true)
          test "$count" -ge 2
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('src/main/resources/data/golems/golems/golem')
          slow=[]
          for p in root.glob('*.json'):
              try: d=json.loads(p.read_text())
              except: continue
              a=d.get('attributes')
              if isinstance(a,dict) and 'speed' in a and float(a['speed']) < 0.25: slow.append((p.name,a['speed']))
          if slow: raise SystemExit('Sub-vanilla speeds remain: '+repr(slow))
          sculk=json.loads((root/'sculk_catalyst.json').read_text())
          matches=[]
          for b in sculk['brain']['behaviors']:
              a=b.get('apply',{}); e=a.get('effect',{})
              if b.get('type')=='golems:effect' and b.get('trigger')=='attack' and a.get('target')=='area' and e.get('id')=='minecraft:blindness': matches.append(a)
          assert len(matches)==1 and matches[0].get('exclude_bystander_players') is True
          assert matches[0].get('radius')==6.0 and matches[0]['effect'].get('duration')==260
          print('PASS: cumulative speed floor and Sculk blindness exemption preserved.')
          PY
          for f in diamond emerald sculk_catalyst ancient_debris obsidian crying_obsidian; do
            grep -q '"knockback_resistance": 1.0' "src/main/resources/data/golems/golems/golem/$f.json"
          done

      - name: Dedicated server smoke test
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          set +e
          timeout --signal=TERM 90s gradle runServer --no-daemon > ../server-village-fallback.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then cat ../server-village-fallback.log; exit "$status"; fi
          grep -q 'Done (' run/server/logs/latest.log

      - name: Client render/resource smoke test
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          setsid env ALSOFT_DRIVERS=null LIBGL_ALWAYS_SOFTWARE=true xvfb-run -a gradle runClient --no-daemon > ../client-village-fallback.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 90); do
            if [ -f run/client/logs/latest.log ] && grep -q 'minecraft:textures/atlas/blocks.png-atlas' run/client/logs/latest.log; then sleep 10; kill -0 "$pid" 2>/dev/null && ok=1; break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill -TERM -- -"$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          test "$ok" -eq 1

      - name: Collect production artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp project/build/libs/Extra-Golems-Reborn-Fabric-1.21.1-21.1.0.1-fabric.jar artifact/
          unzip -t artifact/Extra-Golems-Reborn-Fabric-1.21.1-21.1.0.1-fabric.jar
          sha256sum artifact/Extra-Golems-Reborn-Fabric-1.21.1-21.1.0.1-fabric.jar

      - uses: actions/upload-artifact@v4
        with:
          name: extra-golems-reborn-fabric-1.21.1-village-failed-replacement-fallback
          path: artifact/*.jar
