name: MobBattle Fabric 1.21.1 Targeted Mod Compatibility

on:
  push:
    branches: [mobbattle-fabric-121-full-parity]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Reconstruct exact stable full-parity overlay
        shell: bash
        run: |
          set -euo pipefail
          cat \
            mobbattle-port/overlay.part0.b64 \
            mobbattle-port/overlay.part1.b64 \
            mobbattle-port/overlay.part2.b64 \
            mobbattle-port/overlay.part3a.b64 \
            mobbattle-port/overlay.part3c0.b64 \
            mobbattle-port/overlay.part3c1.b64 \
            mobbattle-port/overlay.part3c2.b64 \
            mobbattle-port/overlay.part3c3.b64 \
            mobbattle-port/overlay.part3c4.b64 \
            mobbattle-port/overlay.part3c5.b64 \
            mobbattle-port/overlay.part3c6.b64 \
            mobbattle-port/overlay.part3c7.b64 \
            mobbattle-port/overlay.part4a0.b64 \
            mobbattle-port/overlay.part4a1.b64 \
            mobbattle-port/overlay.part4a2.b64 > /tmp/full-parity.b64
          base64 --decode /tmp/full-parity.b64 > /tmp/full-parity.zip
          echo '39d51d3a842abaf416a5ca3067babca6e5d87f520af0c1d006275e8a7a6fc85a  /tmp/full-parity.zip' | sha256sum -c
          unzip -t /tmp/full-parity.zip

      - name: Clone exact upstream and apply stable port plus targeted adapters
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Flemmli97/MobBattle.git upstream
          cd upstream
          git checkout --detach d87a81a96dc8a3b0246c4396efe8c96ef2beac24
          test "$(grep '^minecraft_version=' gradle.properties)" = 'minecraft_version=1.21.1'
          test "$(grep '^mod_version=' gradle.properties)" = 'mod_version=2.8.0'
          cd ..
          unzip -o /tmp/full-parity.zip -d upstream
          cp mobbattle-port/targeted/GuardVillagersCompatMixin.java upstream/common/src/main/java/io/github/flemmli97/mobbattle/mixin/GuardVillagersCompatMixin.java
          cp mobbattle-port/targeted/ExtraGolemsCompatMixin.java upstream/common/src/main/java/io/github/flemmli97/mobbattle/mixin/ExtraGolemsCompatMixin.java
          cp mobbattle-port/targeted/BetterNetherSkullCompatMixin.java upstream/common/src/main/java/io/github/flemmli97/mobbattle/mixin/BetterNetherSkullCompatMixin.java
          cp mobbattle-port/targeted/mobbattle.mixins.json upstream/common/src/main/resources/mobbattle.mixins.json
          sed -i 's/^mod_version=.*/mod_version=2.8.0-full-parity-targeted-compat.3-guard-native-extragolems/' upstream/gradle.properties

      - name: Build Fabric 1.21.1
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :fabric:build --stacktrace --no-daemon

      - name: Production Fabric server smoke test with exact Guard Villagers 2.1.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit prodserver/mods
          printf 'eula=true\n' > prodserver/eula.txt
          printf 'online-mode=false\nserver-port=25575\n' > prodserver/server.properties

          FINAL="$(find upstream/fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          test -n "$FINAL"
          cp "$FINAL" prodserver/mods/mobbattle.jar

          python3 - <<'PY' > /tmp/guard.url
          import json, urllib.request
          with urllib.request.urlopen('https://api.modrinth.com/v2/version/ea8J4gbH') as r:
              data = json.load(r)
          files = [f for f in data['files'] if f.get('primary')] or data['files']
          print(files[0]['url'])
          PY
          curl --fail --location --retry 4 --retry-delay 2 "$(cat /tmp/guard.url)" -o prodserver/mods/guardvillagers-2.1.2-1.21.1.jar
          echo 'b7a2683564635186a37c1ab6def07cecab7505bd054357d0aa9bbc8f889345c8  prodserver/mods/guardvillagers-2.1.2-1.21.1.jar' | sha256sum -c

          python3 - <<'PY' > /tmp/fapi.url
          import json, urllib.parse, urllib.request
          q = urllib.parse.urlencode({'loaders':'["fabric"]','game_versions':'["1.21.1"]'})
          with urllib.request.urlopen('https://api.modrinth.com/v2/project/P7dR8mSH/version?' + q) as r:
              versions = json.load(r)
          exact = [v for v in versions if v.get('version_number') == '0.116.4+1.21.1']
          if not exact:
              raise SystemExit('Fabric API 0.116.4+1.21.1 not found')
          files = [f for f in exact[0]['files'] if f.get('primary')] or exact[0]['files']
          print(files[0]['url'])
          PY
          curl --fail --location --retry 4 --retry-delay 2 "$(cat /tmp/fapi.url)" -o prodserver/mods/fabric-api.jar

          curl --fail --location --retry 4 --retry-delay 2 \
            'https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.16.14/1.0.3/server/jar' \
            -o prodserver/fabric-server.jar

          set +e
          (cd prodserver && timeout 120s java -Xms512M -Xmx1536M -jar fabric-server.jar nogui) > audit/server-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then cat audit/server-smoke.log; exit "$code"; fi
          grep -Eq 'Done \([0-9.]+s\)!' audit/server-smoke.log || { cat audit/server-smoke.log; exit 1; }
          grep -q 'guardvillagers 2.1.2-1.21.1' audit/server-smoke.log || { cat audit/server-smoke.log; exit 1; }
          grep -q 'mobbattle ' audit/server-smoke.log || { cat audit/server-smoke.log; exit 1; }
          if grep -Eiq 'Mixin apply failed|InvalidMixinException|InjectionError|Critical injection failure|EntrypointException|Could not execute entrypoint|FATAL' audit/server-smoke.log; then cat audit/server-smoke.log; exit 1; fi

      - name: Audit and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact audit
          FINAL="$(find upstream/fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          test -n "$FINAL"
          OUT=artifact/MobBattle-Fabric-1.21.1-2.8.0-FULL-PARITY-GUARD-NATIVE-EXTRAGOLEMS-FIX.jar
          cp "$FINAL" "$OUT"
          unzip -t "$OUT" | tee audit/unzip-test.txt
          unzip -p "$OUT" fabric.mod.json | tee audit/fabric.mod.json
          unzip -p "$OUT" mobbattle.mixins.json | tee audit/mobbattle.mixins.json
          jar tf "$OUT" | sort > audit/final-entries.txt

          for x in \
            io/github/flemmli97/mobbattle/common/entity/goal/ForcedTargetGoal.class \
            io/github/flemmli97/mobbattle/common/items/MobStickOneWay.class \
            io/github/flemmli97/mobbattle/common/items/MobGroupOneWay.class \
            io/github/flemmli97/mobbattle/common/utils/ActiveBattlePersistenceCompat.class \
            io/github/flemmli97/mobbattle/common/utils/PiglinAngerCompat.class \
            io/github/flemmli97/mobbattle/common/utils/SelectionPersistenceMobbattle.class \
            io/github/flemmli97/mobbattle/mixin/GuardVillagersCompatMixin.class \
            io/github/flemmli97/mobbattle/mixin/ExtraGolemsCompatMixin.class \
            io/github/flemmli97/mobbattle/mixin/BetterNetherSkullCompatMixin.class \
            io/github/flemmli97/mobbattle/mixin/MobSelectionPersistenceMixin.class \
            io/github/flemmli97/mobbattle/mixin/PiglinAiMixin.class \
            io/github/flemmli97/mobbattle/mixin/PiglinBruteAiMixin.class; do
              grep -Fxq "$x" audit/final-entries.txt || { echo "MISSING $x"; exit 1; }
          done

          grep -q 'GuardVillagersCompatMixin' audit/mobbattle.mixins.json
          grep -q 'ExtraGolemsCompatMixin' audit/mobbattle.mixins.json
          grep -q 'BetterNetherSkullCompatMixin' audit/mobbattle.mixins.json

          curl --fail --location --retry 4 --retry-delay 2 \
            'https://cdn.modrinth.com/data/LbrJcAlI/versions/alNL2wP0/mobbattle-1.21.1-2.8.0-fabric.jar' \
            -o /tmp/official.jar
          jar tf /tmp/official.jar | sort > audit/official-entries.txt
          comm -23 audit/official-entries.txt audit/final-entries.txt > audit/missing-stock-entries.txt
          if [ -s audit/missing-stock-entries.txt ]; then
            echo 'Stock entries missing from targeted compatibility build:'
            cat audit/missing-stock-entries.txt
            exit 1
          fi

          sha256sum "$OUT" | tee audit/SHA256SUMS.txt
          tar --exclude='.git' --exclude='.gradle' --exclude='build' --exclude='run' --exclude='fabric/run' -czf artifact/MobBattle-Fabric-1.21.1-2.8.0-FULL-PARITY-GUARD-NATIVE-EXTRAGOLEMS-FIX-source.tar.gz -C upstream .

      - uses: actions/upload-artifact@v4
        with:
          name: mobbattle-fabric-1.21.1-guard-native-extragolems-fix
          path: |
            artifact/*
            audit/*
          if-no-files-found: error
