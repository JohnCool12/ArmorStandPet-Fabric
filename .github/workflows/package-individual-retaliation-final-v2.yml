name: Package Extra Golems Individual Retaliation Final V2

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Reconstruct exact verified production source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/egpatch.part-* | base64 --decode > /tmp/fabric-port.patch.xz
          echo '8b5eb02294d41d7ef3af71ce280dcded9920b2ae097f73043cf60c751f94c7ba  /tmp/fabric-port.patch.xz' | sha256sum --check
          git clone -q https://github.com/bigenergy/extra-golems-reborn.git project
          cd project
          git checkout -q 6b21ec4a59ca16e8362b26e38fc63b2807042bdf
          xz -dc /tmp/fabric-port.patch.xz | patch -p4 --batch --forward >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix1.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix2.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-bedrock-targetable.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix4.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-advanced-swim.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-surface-swim.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-bedrock-provocation.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-all-eyes-neutral.patch >/dev/null
          cp ../ci/GolemFinalEyesLayer.java src/main/java/com/mcmoddev/golems/client/entity/layer/GolemFinalEyesLayer.java
          cd ..
          python3 ci/apply-strict-neutral.py >/dev/null
          python3 ci/apply-legacy-neutral-migration.py >/dev/null
          python3 ci/apply-hybrid-village-neutral.py >/dev/null
          python3 ci/apply-bedrock-natural-hostility.py >/dev/null
          python3 ci/apply-stable-village-targeting.py >/dev/null
          python3 ci/apply-bedrock-true-vanilla-natural-ai.py >/dev/null
          python3 ci/apply-all-constructed-natural-ai.py >/dev/null
          python3 ci/apply-village-runtime-parity-fix.py >/dev/null
          python3 ci/apply-individual-player-target-provenance.py
          python3 ci/apply-minimum-iron-golem-speed.py
          f=project/src/main/java/com/mcmoddev/golems/entity/GolemBase.java
          grep -q 'hasVanillaVillageReputationReason' "$f"
          grep -q 'getPlayerReputation(player) <= -100' "$f"
          grep -q 'this.getLastHurtByMob() != player' "$f"
          grep -q '!this.isAngryAt(player)' "$f"
          ! grep -q '\.setAlertOthers(' "$f"
          grep -q 'migrateLegacyPlayerCreatedConstructedGolem' "$f"

      - name: Build production JAR
        working-directory: project
        run: gradle clean build --stacktrace --no-daemon

      - name: Verify compiled target provenance and AI classes
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          javap -classpath build/classes/java/main -p -c com.mcmoddev.golems.entity.GolemBase > ../GolemBase-final.javap
          grep -q 'hasVanillaVillageReputationReason' ../GolemBase-final.javap
          grep -q 'getLastHurtByMob' ../GolemBase-final.javap
          grep -q 'isAngryAt' ../GolemBase-final.javap
          grep -q 'migrateLegacyPlayerCreatedConstructedGolem' ../GolemBase-final.javap
          # Anonymous DefendVillageTargetGoal wrapper is emitted as an inner class;
          # inspect all GolemBase classfiles together rather than assuming the outer
          # class constant pool retains every goal class name.
          find build/classes/java/main/com/mcmoddev/golems/entity -maxdepth 1 -name 'GolemBase*.class' -print0 | xargs -0 strings > ../GolemBase-all-strings.txt
          grep -q 'DefendVillageTargetGoal' ../GolemBase-all-strings.txt
          grep -q 'HurtByTargetGoal' ../GolemBase-all-strings.txt
          grep -q 'NearestAttackableTargetGoal' ../GolemBase-all-strings.txt
          grep -q 'ResetUniversalAngerTargetGoal' ../GolemBase-all-strings.txt
          ! grep -q 'setAlertOthers' ../GolemBase-all-strings.txt
          echo 'PASS: compiled individual-retaliation provenance and natural Iron Golem target stack verified.'

      - name: Verify cumulative resources
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('src/main/resources/data/golems/golems/golem')
          slow=[]; values=[]
          for p in root.glob('*.json'):
              try: d=json.loads(p.read_text())
              except Exception: continue
              a=d.get('attributes')
              if isinstance(a,dict) and 'speed' in a:
                  v=float(a['speed']); values.append(v)
                  if v < 0.25: slow.append((p.name,v))
          if slow: raise SystemExit('Sub-vanilla speeds remain: '+repr(slow))
          if not values or max(values) < 0.32: raise SystemExit('Faster speed definitions were unexpectedly flattened')
          print('PASS: minimum explicit speed >=0.25 and faster values preserved through', max(values))
          PY
          for f in diamond emerald sculk_catalyst ancient_debris obsidian crying_obsidian; do
            grep -q '"knockback_resistance": 1.0' "src/main/resources/data/golems/golems/golem/$f.json"
          done
          test -f src/main/java/com/mcmoddev/golems/client/entity/layer/GolemFinalEyesLayer.java

      - name: Dedicated server smoke test
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          set +e
          timeout --signal=TERM 90s gradle runServer --no-daemon > ../server-package-final.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then cat ../server-package-final.log; exit "$status"; fi
          grep -q 'Done (' run/server/logs/latest.log

      - name: Client render/resource smoke test
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          setsid env ALSOFT_DRIVERS=null LIBGL_ALWAYS_SOFTWARE=true xvfb-run -a gradle runClient --no-daemon > ../client-package-final.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 90); do
            if [ -f run/client/logs/latest.log ] && grep -q 'minecraft:textures/atlas/blocks.png-atlas' run/client/logs/latest.log; then
              sleep 10
              kill -0 "$pid" 2>/dev/null && ok=1
              break
            fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill -TERM -- -"$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          test "$ok" -eq 1

      - name: Collect production artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp project/build/libs/Extra-Golems-Reborn-Fabric-1.21.1-21.1.0.1-fabric.jar artifact/
          unzip -t artifact/Extra-Golems-Reborn-Fabric-1.21.1-21.1.0.1-fabric.jar
          sha256sum artifact/Extra-Golems-Reborn-Fabric-1.21.1-21.1.0.1-fabric.jar

      - uses: actions/upload-artifact@v4
        with:
          name: extra-golems-reborn-fabric-1.21.1-individual-retaliation-village-exception-final
          path: artifact/*.jar
          if-no-files-found: error
