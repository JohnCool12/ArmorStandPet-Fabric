name: Build Extra Golems Individual Retaliation Final

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Reconstruct cumulative production source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/egpatch.part-* | base64 --decode > /tmp/fabric-port.patch.xz
          echo '8b5eb02294d41d7ef3af71ce280dcded9920b2ae097f73043cf60c751f94c7ba  /tmp/fabric-port.patch.xz' | sha256sum --check
          git clone -q https://github.com/bigenergy/extra-golems-reborn.git project
          cd project
          git checkout -q 6b21ec4a59ca16e8362b26e38fc63b2807042bdf
          xz -dc /tmp/fabric-port.patch.xz | patch -p4 --batch --forward >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix1.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix2.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-bedrock-targetable.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix4.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-advanced-swim.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-surface-swim.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-bedrock-provocation.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-all-eyes-neutral.patch >/dev/null
          cp ../ci/GolemFinalEyesLayer.java src/main/java/com/mcmoddev/golems/client/entity/layer/GolemFinalEyesLayer.java
          cd ..
          python3 ci/apply-strict-neutral.py >/dev/null
          python3 ci/apply-legacy-neutral-migration.py >/dev/null
          python3 ci/apply-hybrid-village-neutral.py >/dev/null
          python3 ci/apply-bedrock-natural-hostility.py >/dev/null
          python3 ci/apply-stable-village-targeting.py >/dev/null
          python3 ci/apply-bedrock-true-vanilla-natural-ai.py >/dev/null
          python3 ci/apply-all-constructed-natural-ai.py >/dev/null
          python3 ci/apply-village-runtime-parity-fix.py >/dev/null
          python3 ci/apply-individual-player-target-provenance.py
          python3 ci/apply-minimum-iron-golem-speed.py

          grep -q 'assigningVillageDefensePlayerTarget' project/src/main/java/com/mcmoddev/golems/entity/GolemBase.java
          grep -q 'this.getLastHurtByMob() != player' project/src/main/java/com/mcmoddev/golems/entity/GolemBase.java
          grep -q '!this.isAngryAt(player)' project/src/main/java/com/mcmoddev/golems/entity/GolemBase.java
          ! grep -q '\.setAlertOthers(' project/src/main/java/com/mcmoddev/golems/entity/GolemBase.java
          grep -q 'migrateLegacyPlayerCreatedConstructedGolem' project/src/main/java/com/mcmoddev/golems/entity/GolemBase.java
          for f in diamond emerald sculk_catalyst ancient_debris obsidian crying_obsidian; do
            grep -q '"knockback_resistance": 1.0' "project/src/main/resources/data/golems/golems/golem/$f.json"
          done
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('project/src/main/resources/data/golems/golems/golem')
          slow=[]
          vals=[]
          for p in root.glob('*.json'):
              try: d=json.loads(p.read_text())
              except: continue
              a=d.get('attributes')
              if isinstance(a,dict) and 'speed' in a:
                  v=float(a['speed']); vals.append((p.name,v))
                  if v < 0.25: slow.append((p.name,v))
          if slow: raise SystemExit('Sub-vanilla speed remains: '+repr(slow))
          print('PASS: no explicit Extra Golem speed definition below 0.25; max=', max(v for _,v in vals))
          PY
          cp project/build.gradle /tmp/eg-production-build.gradle
          cp project/src/main/resources/fabric.mod.json /tmp/eg-production-fabric.mod.json

      - name: Install individual-retaliation GameTests
        shell: bash
        run: |
          set -euo pipefail
          cat >> project/build.gradle <<'EOF'

          loom {
              runs {
                  gametest {
                      server()
                      name "Individual Retaliation Final Game Test"
                      vmArg "-Dfabric-api.gametest"
                      vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
                      runDir "run/gametest"
                  }
              }
          }
          EOF
          python3 ci/inject-individual-retaliation-gametest.py
          python3 ci/patch-individual-retaliation-gametest-v2.py

      - name: Require individual retaliation with village exception
        working-directory: project
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p run/gametest
          printf 'eula=true\n' > run/gametest/eula.txt
          set +e
          gradle runGametest --no-daemon > ../individual-retaliation-final.log 2>&1
          status=$?
          set -e
          test -f build/junit.xml || { tail -500 ../individual-retaliation-final.log; exit 1; }
          set +e
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases=list(ET.parse('build/junit.xml').getroot().iter('testcase'))
          wanted=('directpunchdoesnotalertbystanderextragolem','vanillanaturalirongolemdirectpunchisindividual','lowvillagerreputationcanmakemultipleextragolemshostile')
          for token in wanted:
              found=[c for c in cases if token in c.attrib.get('name','').lower()]
              if len(found)!=1: raise SystemExit(f'Missing/duplicate {token}')
              node=found[0].find('failure')
              if node is None: node=found[0].find('error')
              if node is not None: raise SystemExit(f'{token} failed: {node.attrib.get("message")}')
          print('PASS: direct retaliation individual; unprovenanced copy rejected; low-reputation multi-golem hostility preserved.')
          PY
          parse=$?
          set -e
          if [ "$status" -ne 0 ] || [ "$parse" -ne 0 ]; then tail -500 ../individual-retaliation-final.log; exit 1; fi

      - name: Restore production sources after retaliation test
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/eg-production-build.gradle project/build.gradle
          cp /tmp/eg-production-fabric.mod.json project/src/main/resources/fabric.mod.json
          rm -f project/src/main/java/com/mcmoddev/golems/test/IndividualRetaliationGameTest.java
          rm -rf project/run/gametest project/build/junit.xml

      - name: Install deep village runtime GameTests
        shell: bash
        run: |
          set -euo pipefail
          cat >> project/build.gradle <<'EOF'

          loom {
              runs {
                  gametest {
                      server()
                      name "Deep Village Runtime Final Game Test"
                      vmArg "-Dfabric-api.gametest"
                      vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
                      runDir "run/gametest"
                  }
              }
          }
          EOF
          python3 ci/inject-village-runtime-deep-gametests.py
          python3 ci/patch-village-runtime-bedrock-spawn-test.py
          python3 ci/patch-village-runtime-villager-hurt-test.py

      - name: Require construction, legacy migration, Bedrock and villager-hurt parity
        working-directory: project
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p run/gametest
          printf 'eula=true\n' > run/gametest/eula.txt
          set +e
          gradle runGametest --no-daemon > ../deep-village-final.log 2>&1
          status=$?
          set -e
          test -f build/junit.xml || { tail -500 ../deep-village-final.log; exit 1; }
          set +e
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases=list(ET.parse('build/junit.xml').getroot().iter('testcase'))
          expected=(
              'realtconstructedobsidianusesruntimevillagereputation',
              'realtconstructedbedrockusesruntimevillagereputation',
              'legacyplayercreatedgolemmigratesonloadandusesruntimereputation',
              'villagerhurteventmakesrealtconstructedgolemhostilelikevanilla',
          )
          for token in expected:
              found=[c for c in cases if token in c.attrib.get('name','').lower()]
              if len(found)!=1: raise SystemExit(f'Expected {token} exactly once; cases={[c.attrib.get("name") for c in cases]}')
              node=found[0].find('failure')
              if node is None: node=found[0].find('error')
              if node is not None: raise SystemExit(f'{token} failed: {node.attrib.get("message")}')
              print('PASS:', token)
          PY
          parse=$?
          set -e
          if [ "$status" -ne 0 ] || [ "$parse" -ne 0 ]; then tail -500 ../deep-village-final.log; exit 1; fi

      - name: Restore production sources after village tests
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/eg-production-build.gradle project/build.gradle
          cp /tmp/eg-production-fabric.mod.json project/src/main/resources/fabric.mod.json
          rm -f project/src/main/java/com/mcmoddev/golems/test/VillageRuntimeParityGameTest.java
          rm -rf project/run/gametest project/build/junit.xml

      - name: Rerun Bedrock retaliation and hostile-reacquisition regression
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/inject-bedrock-ai-gametest.py >/dev/null
          python3 ci/patch-bedrock-gametest-normal-difficulty.py >/dev/null
          python3 ci/patch-bedrock-gametest-candidate-debug.py >/dev/null
          mkdir -p project/run/gametest
          printf 'eula=true\n' > project/run/gametest/eula.txt
          cd project
          set +e
          gradle runGametest --no-daemon > ../bedrock-retaliation-final.log 2>&1
          status=$?
          set -e
          test -f build/junit.xml
          set +e
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases=list(ET.parse('build/junit.xml').getroot().iter('testcase'))
          wanted=[c for c in cases if 'bedrockrecovershostiletargetafterplayerretaliation' in c.attrib.get('name','').lower()]
          if len(wanted)!=1: raise SystemExit('Bedrock regression case missing')
          node=wanted[0].find('failure')
          if node is None: node=wanted[0].find('error')
          if node is not None: raise SystemExit('Bedrock regression failed: '+str(node.attrib.get('message')))
          print('PASS: Bedrock retaliation/disengagement/hostile reacquisition preserved.')
          PY
          parse=$?
          set -e
          if [ "$parse" -ne 0 ] || [ "$status" -ne 0 ]; then tail -500 ../bedrock-retaliation-final.log; exit 1; fi
          cd ..
          python3 ci/remove-bedrock-ai-gametest.py >/dev/null
          rm -rf project/run/gametest project/build/junit.xml

      - name: Build production JAR
        working-directory: project
        run: gradle clean build --stacktrace --no-daemon

      - name: Verify compiled provenance and natural AI
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          javap -classpath build/classes/java/main -p -c com.mcmoddev.golems.entity.GolemBase > ../golem-base-individual-final.txt
          grep -q 'assigningVillageDefensePlayerTarget' ../golem-base-individual-final.txt
          grep -q 'isAngryAt' ../golem-base-individual-final.txt
          grep -q 'getLastHurtByMob' ../golem-base-individual-final.txt
          grep -q 'DefendVillageTargetGoal' ../golem-base-individual-final.txt
          grep -q 'HurtByTargetGoal' ../golem-base-individual-final.txt
          grep -q 'NearestAttackableTargetGoal' ../golem-base-individual-final.txt
          grep -q 'ResetUniversalAngerTargetGoal' ../golem-base-individual-final.txt
          grep -q 'migrateLegacyPlayerCreatedConstructedGolem' ../golem-base-individual-final.txt

      - name: Verify final resources and speed floor
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('src/main/resources/data/golems/golems/golem')
          slow=[]
          for p in root.glob('*.json'):
              try: d=json.loads(p.read_text())
              except: continue
              a=d.get('attributes')
              if isinstance(a,dict) and 'speed' in a and float(a['speed']) < 0.25:
                  slow.append((p.name,float(a['speed'])))
          if slow: raise SystemExit('Sub-vanilla speeds remain: '+repr(slow))
          print('PASS: movement-speed floor preserved.')
          PY
          for f in diamond emerald sculk_catalyst ancient_debris obsidian crying_obsidian; do
            grep -q '"knockback_resistance": 1.0' "src/main/resources/data/golems/golems/golem/$f.json"
          done

      - name: Dedicated server smoke test
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          set +e
          timeout --signal=TERM 90s gradle runServer --no-daemon > ../server-individual-final.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then cat ../server-individual-final.log; exit "$status"; fi
          grep -q 'Done (' run/server/logs/latest.log

      - name: Client render/resource smoke test
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          setsid env ALSOFT_DRIVERS=null LIBGL_ALWAYS_SOFTWARE=true xvfb-run -a gradle runClient --no-daemon > ../client-individual-final.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 90); do
            if [ -f run/client/logs/latest.log ] && grep -q 'minecraft:textures/atlas/blocks.png-atlas' run/client/logs/latest.log; then sleep 10; kill -0 "$pid" 2>/dev/null && ok=1; break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill -TERM -- -"$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          test "$ok" -eq 1

      - name: Collect verified production JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp project/build/libs/Extra-Golems-Reborn-Fabric-1.21.1-21.1.0.1-fabric.jar artifact/
          unzip -t artifact/Extra-Golems-Reborn-Fabric-1.21.1-21.1.0.1-fabric.jar
          sha256sum artifact/Extra-Golems-Reborn-Fabric-1.21.1-21.1.0.1-fabric.jar

      - uses: actions/upload-artifact@v4
        with:
          name: extra-golems-reborn-fabric-1.21.1-individual-retaliation-final
          path: artifact/*.jar
          if-no-files-found: error
