name: Inspect Vanilla 1.21.1 Hurt AI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Reconstruct and inspect Iron Golem anger and retarget lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cat ci/egpatch.part-* | base64 --decode > /tmp/fabric-port.patch.xz
          git clone -q https://github.com/bigenergy/extra-golems-reborn.git project
          cd project
          git checkout -q 6b21ec4a59ca16e8362b26e38fc63b2807042bdf
          xz -dc /tmp/fabric-port.patch.xz | patch -p4 --batch --forward >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix1.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix2.patch >/dev/null
          cd ..
          python3 ci/apply-strict-neutral.py >/dev/null
          cd project
          gradle compileJava --no-daemon >/dev/null
          JAR=$(find .gradle/loom-cache/minecraftMaven/net/minecraft -type f -name '*.jar' | grep -v sources | head -1)
          echo "MAPPED_JAR=$JAR"
          for C in \
            net.minecraft.world.entity.animal.IronGolem \
            net.minecraft.world.entity.NeutralMob \
            net.minecraft.world.entity.ai.goal.target.HurtByTargetGoal \
            net.minecraft.world.entity.ai.goal.target.NearestAttackableTargetGoal \
            net.minecraft.world.entity.ai.goal.target.TargetGoal \
            net.minecraft.world.entity.Mob \
            net.minecraft.world.entity.LivingEntity; do
            echo "===== $C ====="
            javap -classpath "$JAR" -p -c "$C" || true
          done
