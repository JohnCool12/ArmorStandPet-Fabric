name: Validate ArmorStandPet 26.1.2.95 look modes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Download exact validated tell-fix baseline
        uses: actions/download-artifact@v4
        with:
          name: armorstandpet-neoforge-26.1.2.95-tell-approach-fix
          path: /tmp/base-artifact
          run-id: 34136466895
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct and audit look-mode source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf baseline project artifact
          mkdir baseline project artifact
          source_zip=/tmp/base-artifact/ArmorStandPet-NeoForge-26.1.2.95-tell-approach-fix-source.zip
          echo '1eedfa03cf0a99896fa99c99ef7b696159cbf499ed0927c8224dd2a0545413be  '"$source_zip" | sha256sum --check
          unzip -q "$source_zip" -d baseline
          cp -a baseline/. project/
          base64 --decode ci/armorstandpet-neoforge-26.1.2.95-look-modes.patch.xz.b64 > /tmp/look.patch.xz
          xz --decompress --stdout /tmp/look.patch.xz > /tmp/look.patch
          echo '3e0c0e7722235e266b969c2eae34711c72b908ff35ebb66c9daf966769bdc383  /tmp/look.patch' | sha256sum --check
          (cd project && patch --batch --forward -p1 < /tmp/look.patch)
          cp /tmp/look.patch artifact/ArmorStandPet-NeoForge-26.1.2.95-look-modes.patch
          python3 - <<'PY'
          from pathlib import Path
          import sys
          base = Path('baseline/src/main/java')
          new = Path('project/src/main/java')
          allowed_existing = {
              'io/github/kyzderp/armorstandpet/actions/NotBusyAction.java',
              'io/github/kyzderp/armorstandpet/actions/walk/ChasePathAction.java',
              'io/github/kyzderp/armorstandpet/actions/walk/WalkPlayerAction.java',
              'io/github/kyzderp/armorstandpet/neoforge/NeoForgeEventHandlers.java',
              'io/github/kyzderp/armorstandpet/normalcommands/ASPetCommand.java',
              'io/github/kyzderp/armorstandpet/storage/PetData.java',
              'io/github/kyzderp/armorstandpet/types/Pet.java',
          }
          expected_new = {
              'io/github/kyzderp/armorstandpet/look/LookController.java',
              'io/github/kyzderp/armorstandpet/normalcommands/LookCommand.java',
              'io/github/kyzderp/armorstandpet/types/LookMode.java',
          }
          bad=[]; checked=0
          for src in sorted(base.rglob('*.java')):
              rel=src.relative_to(base).as_posix()
              if rel in allowed_existing:
                  continue
              dst=new/rel
              if not dst.is_file() or src.read_bytes()!=dst.read_bytes():
                  bad.append(rel)
              checked += 1
          if bad:
              print('Unexpected production Java changes:', *bad, sep='\n - ')
              sys.exit(1)
          for rel in expected_new:
              if not (new/rel).is_file():
                  raise SystemExit(f'Missing expected new source: {rel}')
          print(f'Byte-for-byte preserved {checked} production Java files outside the intended look-mode scope.')

          pet=(new/'io/github/kyzderp/armorstandpet/types/Pet.java').read_text()
          data=(new/'io/github/kyzderp/armorstandpet/storage/PetData.java').read_text()
          command=(new/'io/github/kyzderp/armorstandpet/normalcommands/LookCommand.java').read_text()
          chase=(new/'io/github/kyzderp/armorstandpet/actions/walk/ChasePathAction.java').read_text()
          direct=(new/'io/github/kyzderp/armorstandpet/actions/walk/WalkPlayerAction.java').read_text()
          notbusy=(new/'io/github/kyzderp/armorstandpet/actions/NotBusyAction.java').read_text()
          events=(new/'io/github/kyzderp/armorstandpet/neoforge/NeoForgeEventHandlers.java').read_text()

          checks = [
              ('default OFF', 'this.lookMode = LookMode.OFF;' in pet),
              ('persistent save', 'data.lookMode = this.lookMode.serializedName();' in pet),
              ('persistent load', 'this.lookMode = LookMode.fromString(data.lookMode);' in pet),
              ('old-save fallback', 'public String lookMode = "off";' in data),
              ('three command modes', all(x in command for x in ['LookMode.ON','LookMode.OFF','LookMode.WALKING'])),
              ('smooth body threshold', 'LOOK_BODY_TURN_THRESHOLD_DEGREES' in pet and 'LOOK_BODY_TURN_SPEED_DEGREES' in pet),
              ('smooth head yaw', 'LOOK_HEAD_YAW_SPEED_DEGREES' in pet and 'approachDegrees' in pet),
              ('smooth head pitch', 'LOOK_HEAD_PITCH_SPEED_DEGREES' in pet and 'approachLinear' in pet),
              ('path chase target capture', 'beginWalkingLookAt(this.player)' in chase),
              ('direct chase target capture', 'beginWalkingLookAt(this.destination)' in direct),
              ('action-end target clear', 'clearWalkingLookTarget()' in notbusy),
              ('look tick after movement', events.index('PlayerActionListener.tick(event.getServer());') < events.index('LookController.tick(event.getServer());')),
              ('OFF leaves direct movement legacy look', 'if (this.lookMode == LookMode.OFF)' in pet and 'this.lookAtPlayer(player);' in pet),
          ]
          failed=[name for name,ok in checks if not ok]
          if failed:
              raise SystemExit('Look-mode semantic audit failed: ' + ', '.join(failed))
          PY
          grep -q '^minecraft_version=26.1.2$' project/gradle.properties
          grep -q '^neo_version=26.1.2.95$' project/gradle.properties
          grep -Fq 'mod_version=3.0.4+neoforge.26.1.2-look-modes' project/gradle.properties
      - name: Build production JAR
        working-directory: project
        run: ./gradlew clean build --stacktrace --no-daemon --console=plain
      - name: Verify compiled look logic and metadata
        shell: bash
        run: |
          set -euo pipefail
          javap -classpath project/build/classes/java/main -c -p io.github.kyzderp.armorstandpet.types.Pet > artifact/Pet-look-javap.txt
          javap -classpath project/build/classes/java/main -c -p io.github.kyzderp.armorstandpet.normalcommands.LookCommand > artifact/LookCommand-javap.txt
          javap -classpath project/build/classes/java/main -c -p io.github.kyzderp.armorstandpet.look.LookController > artifact/LookController-javap.txt
          grep -Fq 'tickLookTracking' artifact/Pet-look-javap.txt
          grep -Fq 'beginWalkingLookAt' artifact/Pet-look-javap.txt
          grep -Fq 'clearWalkingLookTarget' artifact/Pet-look-javap.txt
          grep -Fq 'smoothLookAtPlayer' artifact/Pet-look-javap.txt
          grep -Fq 'LookMode.WALKING' artifact/LookCommand-javap.txt
          grep -Fq 'tickLookTracking' artifact/LookController-javap.txt
          jar="$(find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          test -n "$jar"
          unzip -p "$jar" META-INF/neoforge.mods.toml > /tmp/neoforge.mods.toml
          grep -Fq 'versionRange="[26.1.2.95,)"' /tmp/neoforge.mods.toml
          cp "$jar" artifact/ArmorStandPet-NeoForge-26.1.2.95-look-modes.jar
      - name: Dedicated-server smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project/run
          printf 'eula=true\n' > project/run/eula.txt
          printf 'online-mode=false\nserver-port=25593\n' > project/run/server.properties
          set +e
          (cd project && (sleep 90; echo stop) | timeout 360s ./gradlew runServer --no-daemon --console=plain) > artifact/ArmorStandPet-NeoForge-26.1.2.95-look-modes-server-smoke.log 2>&1
          status=$?
          set -e
          cat artifact/ArmorStandPet-NeoForge-26.1.2.95-look-modes-server-smoke.log
          grep -q 'Done (' artifact/ArmorStandPet-NeoForge-26.1.2.95-look-modes-server-smoke.log
          grep -q 'ArmorStandPet NeoForge 26.1.2 initialized.' artifact/ArmorStandPet-NeoForge-26.1.2.95-look-modes-server-smoke.log
          ! grep -Eiq '(^|\]) *(ERROR|FATAL) ' artifact/ArmorStandPet-NeoForge-26.1.2.95-look-modes-server-smoke.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
      - name: Package validated files
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'ArmorStandPet NeoForge 26.1.2.95 look modes' \
            '===========================================' \
            'Minecraft: 26.1.2' \
            'NeoForge: 26.1.2.95' \
            'Java: 25' \
            'Mod version: 3.0.4+neoforge.26.1.2-look-modes' \
            '' \
            'Adds persistent /aspet look <on|off|walking>.' \
            'OFF is the default and preserves the pre-feature behavior.' \
            'ON smoothly tracks the owner every server tick.' \
            'WALKING tracks the player of the active chase/action: the owner during normal follow/return and another player through tell/hug/insult interaction chains.' \
            'Head yaw/pitch interpolate gradually; body yaw only follows when the target leaves a comfortable head-turn cone.' \
            'Transient WALKING targets are cleared when the action chain returns to not-busy.' \
            '' \
            'The prior tell-approach and small-armor-stand held-item fixes are preserved. Validation includes exact-baseline checksum, narrow source audit, full Java 25/NeoForge 26.1.2.95 production build, compiled look-method inspection, packaged dependency verification, and dedicated-server startup.' \
            'Client-side visual feel still requires in-game observation.' \
            > artifact/VALIDATION.txt
          rm -rf project/.gradle project/build project/run
          (cd project && zip -qr ../artifact/ArmorStandPet-NeoForge-26.1.2.95-look-modes-source.zip . -x '.git/*' '.github/*' '.gradle/*' 'build/*' 'run/*')
          sha256sum artifact/ArmorStandPet-NeoForge-26.1.2.95-look-modes.jar artifact/ArmorStandPet-NeoForge-26.1.2.95-look-modes-source.zip artifact/ArmorStandPet-NeoForge-26.1.2.95-look-modes.patch artifact/ArmorStandPet-NeoForge-26.1.2.95-look-modes-server-smoke.log artifact/VALIDATION.txt > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: armorstandpet-neoforge-26.1.2.95-look-modes
          path: artifact/
          if-no-files-found: error
