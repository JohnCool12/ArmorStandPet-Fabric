name: Inspect NeoForge 26.1.2.95 armor stand rendering

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Download exact validated 26.1.2.95 source
        uses: actions/download-artifact@v4
        with:
          name: armorstandpet-neoforge-26.1.2.95-uninterrupted-follow
          path: /tmp/base-artifact
          run-id: 34109877198
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve NeoForge workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project inspect
          mkdir project inspect
          unzip -q /tmp/base-artifact/ArmorStandPet-NeoForge-26.1.2.95-uninterrupted-follow-source.zip -d project
          cd project
          ./gradlew compileJava --no-daemon --console=plain
      - name: Inspect exact Minecraft client bytecode
        shell: bash
        run: |
          set -euo pipefail
          : > inspect/armorstand-rendering-javap.txt
          found=''
          while IFS= read -r jar; do
            if jar tf "$jar" 2>/dev/null | grep -q '^net/minecraft/client/renderer/entity/ArmorStandRenderer.class$'; then
              found="$jar"
              break
            fi
          done < <(find "$HOME/.gradle/caches" -type f -name '*.jar' 2>/dev/null)
          if [ -z "$found" ]; then
            echo 'Could not locate jar containing ArmorStandRenderer.class' >&2
            find "$HOME/.gradle/caches" -type f -name '*.jar' | head -200 >&2
            exit 1
          fi
          echo "JAR=$found" | tee -a inspect/armorstand-rendering-javap.txt
          for cls in \
            net.minecraft.client.renderer.entity.ArmorStandRenderer \
            net.minecraft.client.renderer.entity.layers.ItemInHandLayer \
            net.minecraft.client.model.ArmorStandModel \
            net.minecraft.client.model.ArmorStandArmorModel \
            net.minecraft.world.entity.decoration.ArmorStand \
            net.minecraft.client.renderer.entity.state.ArmorStandRenderState \
            net.minecraft.client.renderer.entity.state.LivingEntityRenderState; do
            echo >> inspect/armorstand-rendering-javap.txt
            echo "===== $cls =====" >> inspect/armorstand-rendering-javap.txt
            javap -classpath "$found" -c -p -s "$cls" >> inspect/armorstand-rendering-javap.txt 2>&1 || true
          done
          cat inspect/armorstand-rendering-javap.txt
      - uses: actions/upload-artifact@v4
        with:
          name: armorstand-rendering-javap-26.1.2.95
          path: inspect/armorstand-rendering-javap.txt
          if-no-files-found: error
