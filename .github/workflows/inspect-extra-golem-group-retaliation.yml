name: Inspect Extra Golem Group Retaliation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Reconstruct cumulative production source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/egpatch.part-* | base64 --decode > /tmp/fabric-port.patch.xz
          git clone -q https://github.com/bigenergy/extra-golems-reborn.git project
          cd project
          git checkout -q 6b21ec4a59ca16e8362b26e38fc63b2807042bdf
          xz -dc /tmp/fabric-port.patch.xz | patch -p4 --batch --forward >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix1.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix2.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-bedrock-targetable.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix4.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-advanced-swim.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-surface-swim.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-bedrock-provocation.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-all-eyes-neutral.patch >/dev/null
          cp ../ci/GolemFinalEyesLayer.java src/main/java/com/mcmoddev/golems/client/entity/layer/GolemFinalEyesLayer.java
          cd ..
          python3 ci/apply-strict-neutral.py >/dev/null
          python3 ci/apply-legacy-neutral-migration.py >/dev/null
          python3 ci/apply-hybrid-village-neutral.py >/dev/null
          python3 ci/apply-bedrock-natural-hostility.py >/dev/null
          python3 ci/apply-stable-village-targeting.py >/dev/null
          python3 ci/apply-bedrock-true-vanilla-natural-ai.py >/dev/null
          python3 ci/apply-all-constructed-natural-ai.py >/dev/null
          python3 ci/apply-village-runtime-parity-fix.py >/dev/null
      - name: Inspect GolemBase retaliation and target propagation
        shell: bash
        run: |
          set -euo pipefail
          f=project/src/main/java/com/mcmoddev/golems/entity/GolemBase.java
          echo '===== keyword hits ====='
          grep -n -E 'HurtByTargetGoal|setAlertOthers|alertOthers|setLastHurtByMob|setTarget\(|getEntitiesOfClass|getNearbyEntities|broadcast|persistentAnger|isAngryAt|PlayerCreated|maintainConstructed' "$f" || true
          echo '===== hurt method ====='
          sed -n '/public boolean hurt(final DamageSource/,/^\t}/p' "$f" || true
          echo '===== setTarget override ====='
          sed -n '/public void setTarget(/,/^\t}/p' "$f" || true
          echo '===== natural target helper ====='
          sed -n '/configureBedrockNaturalIronGolemTargeting/,/^\t}/p' "$f" || true
          echo '===== constructed maintenance ====='
          sed -n '/maintainConstructedNeutralRetaliation/,/^\t}/p' "$f" || true
          echo '===== legacy migration ====='
          sed -n '/migrateLegacyPlayerCreatedConstructedGolem/,/^\t}/p' "$f" || true
      - name: Inspect vanilla 1.21.1 HurtByTargetGoal
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          gradle classes --no-daemon >/dev/null
          found=''
          while IFS= read -r j; do
            if jar tf "$j" 2>/dev/null | grep -q '^net/minecraft/world/entity/ai/goal/target/HurtByTargetGoal.class$'; then found="$j"; break; fi
          done < <(find ~/.gradle .gradle -type f -name '*.jar' 2>/dev/null)
          test -n "$found"
          javap -classpath "$found" -p -c net.minecraft.world.entity.ai.goal.target.HurtByTargetGoal
