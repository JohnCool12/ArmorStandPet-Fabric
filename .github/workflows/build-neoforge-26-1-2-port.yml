name: Build NeoForge 26.1.2 Port
on:
  push:
    branches:
      - ci-neoforge-26-1-2-port-head-20260827
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Prepare NeoForge 26.1.2 source
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/bigenergy/extra-golems-reborn.git project
          cd project
          git checkout -q 6b21ec4a59ca16e8362b26e38fc63b2807042bdf
          cd ..
          python3 ci/port-neoforge-26-1-2-base.py
      - name: Build port
        id: build
        continue-on-error: true
        shell: bash
        working-directory: project
        run: |
          set -o pipefail
          gradle clean build --stacktrace --no-daemon --console=plain 2>&1 | tee ../build-neoforge-26.1.2.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extra-golems-neoforge-26.1.2-build
          if-no-files-found: warn
          path: |
            build-neoforge-26.1.2.log
            project/build/libs/*.jar
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
