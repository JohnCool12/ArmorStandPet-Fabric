name: Build NeoForge 26.1.2 Port
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Prepare NeoForge 26.1.2 source
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/bigenergy/extra-golems-reborn.git project
          cd project
          git checkout -q 6b21ec4a59ca16e8362b26e38fc63b2807042bdf
          cd ..
          python3 ci/port-neoforge-26-1-2-base.py
      - name: Compile baseline port
        working-directory: project
        run: gradle clean compileJava --stacktrace --no-daemon
