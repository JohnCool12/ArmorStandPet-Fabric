name: MobBattle Fabric 1.21.1 Guard Golem Target Lock

on:
  push:
    branches: [mobbattle-fabric-121-full-parity]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Reconstruct stable full-parity overlay
        shell: bash
        run: |
          set -euo pipefail
          cat \
            mobbattle-port/overlay.part0.b64 \
            mobbattle-port/overlay.part1.b64 \
            mobbattle-port/overlay.part2.b64 \
            mobbattle-port/overlay.part3a.b64 \
            mobbattle-port/overlay.part3c0.b64 \
            mobbattle-port/overlay.part3c1.b64 \
            mobbattle-port/overlay.part3c2.b64 \
            mobbattle-port/overlay.part3c3.b64 \
            mobbattle-port/overlay.part3c4.b64 \
            mobbattle-port/overlay.part3c5.b64 \
            mobbattle-port/overlay.part3c6.b64 \
            mobbattle-port/overlay.part3c7.b64 \
            mobbattle-port/overlay.part4a0.b64 \
            mobbattle-port/overlay.part4a1.b64 \
            mobbattle-port/overlay.part4a2.b64 > /tmp/full-parity.b64
          base64 --decode /tmp/full-parity.b64 > /tmp/full-parity.zip
          echo '39d51d3a842abaf416a5ca3067babca6e5d87f520af0c1d006275e8a7a6fc85a  /tmp/full-parity.zip' | sha256sum -c
          unzip -t /tmp/full-parity.zip

      - name: Prepare exact 1.21.1 source with targeted compatibility
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Flemmli97/MobBattle.git upstream
          cd upstream
          git checkout --detach d87a81a96dc8a3b0246c4396efe8c96ef2beac24
          test "$(grep '^minecraft_version=' gradle.properties)" = 'minecraft_version=1.21.1'
          test "$(grep '^mod_version=' gradle.properties)" = 'mod_version=2.8.0'
          cd ..
          unzip -o /tmp/full-parity.zip -d upstream

          cp mobbattle-port/targeted/ForcedTargetGoal.java upstream/common/src/main/java/io/github/flemmli97/mobbattle/common/entity/goal/ForcedTargetGoal.java
          cp mobbattle-port/targeted/GuardVillagersCompatMixin.java upstream/common/src/main/java/io/github/flemmli97/mobbattle/mixin/GuardVillagersCompatMixin.java
          cp mobbattle-port/targeted/ExtraGolemsCompatMixin.java upstream/common/src/main/java/io/github/flemmli97/mobbattle/mixin/ExtraGolemsCompatMixin.java
          cp mobbattle-port/targeted/BetterNetherSkullCompatMixin.java upstream/common/src/main/java/io/github/flemmli97/mobbattle/mixin/BetterNetherSkullCompatMixin.java
          cp mobbattle-port/targeted/mobbattle.mixins.json upstream/common/src/main/resources/mobbattle.mixins.json
          sed -i 's/^mod_version=.*/mod_version=2.8.0-full-parity-target-lock.1-guard-golems/' upstream/gradle.properties

          grep -Fq 'EnumSet.of(Goal.Flag.TARGET)' upstream/common/src/main/java/io/github/flemmli97/mobbattle/common/entity/goal/ForcedTargetGoal.java

      - name: Build Fabric 1.21.1
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :fabric:build --stacktrace --no-daemon

      - name: Audit and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact audit
          FINAL="$(find upstream/fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          test -n "$FINAL"
          OUT=artifact/MobBattle-Fabric-1.21.1-2.8.0-FULL-PARITY-GUARD-GOLEM-TARGET-LOCK-FIX.jar
          cp "$FINAL" "$OUT"
          unzip -t "$OUT" | tee audit/unzip-test.txt
          unzip -p "$OUT" fabric.mod.json | tee audit/fabric.mod.json
          unzip -p "$OUT" mobbattle.mixins.json | tee audit/mobbattle.mixins.json
          jar tf "$OUT" | sort > audit/final-entries.txt

          for x in \
            io/github/flemmli97/mobbattle/common/entity/goal/ForcedTargetGoal.class \
            io/github/flemmli97/mobbattle/common/items/MobStickOneWay.class \
            io/github/flemmli97/mobbattle/common/items/MobGroupOneWay.class \
            io/github/flemmli97/mobbattle/common/utils/ActiveBattlePersistenceCompat.class \
            io/github/flemmli97/mobbattle/common/utils/PiglinAngerCompat.class \
            io/github/flemmli97/mobbattle/common/utils/SelectionPersistenceMobbattle.class \
            io/github/flemmli97/mobbattle/mixin/GuardVillagersCompatMixin.class \
            io/github/flemmli97/mobbattle/mixin/ExtraGolemsCompatMixin.class \
            io/github/flemmli97/mobbattle/mixin/BetterNetherSkullCompatMixin.class; do
              grep -Fxq "$x" audit/final-entries.txt || { echo "MISSING $x"; exit 1; }
          done

          javap -classpath "$OUT" -c -p io.github.flemmli97.mobbattle.common.entity.goal.ForcedTargetGoal > audit/ForcedTargetGoal.javap.txt
          # Production Fabric JAR is intermediary-remapped. Goal.Control.TARGET = field_18408.
          grep -q 'field_18408' audit/ForcedTargetGoal.javap.txt || { cat audit/ForcedTargetGoal.javap.txt; exit 1; }

          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            'https://cdn.modrinth.com/data/LbrJcAlI/versions/alNL2wP0/mobbattle-1.21.1-2.8.0-fabric.jar' \
            -o /tmp/official.jar
          jar tf /tmp/official.jar | sort > audit/official-entries.txt
          comm -23 audit/official-entries.txt audit/final-entries.txt > audit/missing-stock-entries.txt
          test ! -s audit/missing-stock-entries.txt || { cat audit/missing-stock-entries.txt; exit 1; }

          sha256sum "$OUT" | tee audit/SHA256SUMS.txt
          tar --exclude='.git' --exclude='.gradle' --exclude='build' --exclude='run' --exclude='fabric/run' \
            -czf artifact/MobBattle-Fabric-1.21.1-2.8.0-FULL-PARITY-GUARD-GOLEM-TARGET-LOCK-FIX-source.tar.gz -C upstream .

      - uses: actions/upload-artifact@v4
        with:
          name: mobbattle-fabric-1.21.1-guard-golem-target-lock-fix
          path: |
            artifact/*
            audit/*
          if-no-files-found: error
