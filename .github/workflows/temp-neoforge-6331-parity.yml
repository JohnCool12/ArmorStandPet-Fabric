name: Validate ArmorStandPet NeoForge 26.1.2.95 parity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: armorstandpet-neoforge-1.21.1-uninterrupted-follow
          path: /tmp/base-artifact
          run-id: 30962742017
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and validate NeoForge parity port
        run: bash ci/run-neoforge6331-validation.sh
      - uses: actions/upload-artifact@v4
        with:
          name: armorstandpet-neoforge-26.1.2-6331-parity
          path: artifact/
          if-no-files-found: error
