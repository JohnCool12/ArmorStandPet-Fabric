name: Validate ArmorStandPet 6.33.1 NeoForge 26.1.2 Port

on:
  push:
    branches: [chatgpt/neoforge-26.1.2-6331-port-build2]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download exact validated NeoForge 26.1.2 baseline
        uses: actions/download-artifact@v4
        with:
          name: armorstandpet-neoforge-26.1.2-uninterrupted-follow-clean
          path: /tmp/base-artifact
          run-id: 34103115504
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconstruct 6.33.1 parity port
        shell: bash
        run: |
          set -euo pipefail
          echo 'f74690679b3b6fe763851e6c2502f5706803facb4a403d9a73e56eb18eab5c19  /tmp/base-artifact/ArmorStandPet-NeoForge-26.1.2-uninterrupted-follow-source.zip' | sha256sum --check
          cat ci/port6331/part-* | base64 --decode > /tmp/port.patch.xz
          echo 'bbcdca43d5e505260d2b0640bcbd103d45b55bdc024dce417cd4b49c79de430a  /tmp/port.patch.xz' | sha256sum --check
          xz --decompress --stdout /tmp/port.patch.xz > /tmp/port.patch
          echo 'c2826459e99926dcba203165123831e7573dbc98e5427cf7b4e33bd8b625a2ee  /tmp/port.patch' | sha256sum --check

          rm -rf project artifact
          mkdir -p project artifact
          unzip -q /tmp/base-artifact/ArmorStandPet-NeoForge-26.1.2-uninterrupted-follow-source.zip -d project
          (cd project && patch --batch --forward -p1 < /tmp/port.patch)

          grep -q '^minecraft_version=26.1.2$' project/gradle.properties
          grep -q '^neo_version=26.1.2.95$' project/gradle.properties
          grep -Fq 'mod_version=3.1.0+neoforge.26.1.2-fabric-6.33.1-parity' project/gradle.properties
          grep -q 'JavaLanguageVersion.of(25)' project/build.gradle
          test -f project/src/main/resources/META-INF/neoforge.mods.toml
          ! find project -name fabric.mod.json -print -quit | grep -q .
          ! grep -R --line-number -E 'net\.fabricmc|fabric-loom' project/src project/build.gradle project/settings.gradle project/gradle.properties

          grep -R -q 'targetlock' project/src/main/java/io/github/kyzderp/armorstandpet
          grep -R -q 'SwimCommand' project/src/main/java/io/github/kyzderp/armorstandpet
          grep -R -q 'AquaticRuntime' project/src/main/java/io/github/kyzderp/armorstandpet
          grep -R -q 'PetBowCombatRuntime' project/src/main/java/io/github/kyzderp/armorstandpet
          grep -R -q 'PetSpecialRangedCombatRuntime' project/src/main/java/io/github/kyzderp/armorstandpet

      - name: Build production NeoForge JAR
        working-directory: project
        run: ./gradlew clean build --stacktrace --no-daemon --console=plain

      - name: Dedicated-server smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project/run
          printf 'eula=true\n' > project/run/eula.txt
          printf 'online-mode=false\nserver-port=25591\n' > project/run/server.properties
          set +e
          (cd project && (sleep 90; echo stop) | timeout 360s ./gradlew runServer --no-daemon --console=plain) > artifact/server-smoke.log 2>&1
          status=$?
          set -e
          cat artifact/server-smoke.log
          grep -q 'Done (' artifact/server-smoke.log
          ! grep -q 'Failed to complete lifecycle event' artifact/server-smoke.log
          ! grep -q 'Exception caught during firing event' artifact/server-smoke.log
          ! grep -Eiq '(^|\]) *(ERROR|FATAL) ' artifact/server-smoke.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi

      - name: Package validated port
        shell: bash
        run: |
          set -euo pipefail
          jarfile="$(find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          test -n "$jarfile"
          cp "$jarfile" artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.0-fabric-6.33.1-parity.jar

          unzip -t artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.0-fabric-6.33.1-parity.jar
          unzip -p artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.0-fabric-6.33.1-parity.jar META-INF/neoforge.mods.toml | grep -q 'modId="armorstandpet"'
          jar tf artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.0-fabric-6.33.1-parity.jar | grep -q 'io/github/kyzderp/armorstandpet/swim/AquaticRuntime.class'
          jar tf artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.0-fabric-6.33.1-parity.jar | grep -q 'io/github/kyzderp/armorstandpet/normalcommands/TargetLockCommand.class'
          jar tf artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.0-fabric-6.33.1-parity.jar | grep -q 'io/github/kyzderp/armorstandpet/combat/PetBowCombatRuntime.class'
          jar tf artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.0-fabric-6.33.1-parity.jar | grep -q 'io/github/kyzderp/armorstandpet/combat/PetSpecialRangedCombatRuntime.class'
          ! jar tf artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.0-fabric-6.33.1-parity.jar | grep -q 'fabric.mod.json'

          cp /tmp/port.patch artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.0-fabric-6.33.1-parity.patch

          cat > artifact/VALIDATION.txt <<'TXT'
ArmorStandPet NeoForge 26.1.2.95 — Fabric 6.33.1 parity port
==============================================================
Target: Minecraft 26.1.2 / NeoForge 26.1.2.95 / Java 25
Port version: 3.1.0+neoforge.26.1.2-fabric-6.33.1-parity

Port base:
- exact previously validated NeoForge 26.1.2 uninterrupted-follow source artifact
- later NeoForge lifecycle, persistence, dimension, ditch, chunk, and presentation/ABI fixes merged
- Fabric 6.33.1 gameplay features ported into that NeoForge architecture

Feature parity carried forward:
- independent pet health / death / healing
- smooth movement and bounded pathfinding improvements
- owner-directed melee combat and ghost-aggro cleanup
- bow combat, tipped/spectral arrow support and ranged repositioning
- trident and splash-potion combat behavior
- Loyalty cleanup behavior
- unlimited combat pursuit behavior
- /aspet swim on|off and custom aquatic movement
- surface buoyancy/bobbing from the 6.33 line
- shore transition fixes
- /aspet teleport behavior
- /aspet targetlock on|off, OFF by default and persisted per pet
- target lock holds one living target until death/removal
- NeoForge-specific persistence, chunk, dimension and presentation fixes retained

Validation gates:
- exact baseline source SHA-256 verified
- exact parity patch SHA-256 verified
- no Fabric loader/API production references
- full Java 25 NeoForge production compilation succeeded
- dedicated NeoForge server reached Done
- no ERROR/FATAL lifecycle/event failure in smoke log
- production JAR metadata and key parity classes inspected
TXT

          rm -rf project/.gradle project/build project/run
          (cd project && zip -qr ../artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.0-fabric-6.33.1-parity-source.zip . -x '.git/*' '.github/*' '.gradle/*' 'build/*' 'run/*')
          sha256sum             artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.0-fabric-6.33.1-parity.jar             artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.0-fabric-6.33.1-parity-source.zip             artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.0-fabric-6.33.1-parity.patch             artifact/VALIDATION.txt             artifact/server-smoke.log > artifact/SHA256SUMS.txt

      - name: Upload validated port
        uses: actions/upload-artifact@v4
        with:
          name: armorstandpet-neoforge-26.1.2-6331-parity
          path: artifact/
          if-no-files-found: error
