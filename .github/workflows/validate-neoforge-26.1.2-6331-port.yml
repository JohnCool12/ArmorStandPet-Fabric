name: Validate ArmorStandPet 6.33.1 NeoForge 26.1.2 Port

on:
  push:
    branches:
      - chatgpt/neoforge-26.1.2-6331-port-build2
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download exact validated NeoForge 26.1.2 baseline
        uses: actions/download-artifact@v4
        with:
          name: armorstandpet-neoforge-26.1.2-uninterrupted-follow-clean
          path: /tmp/base-artifact
          run-id: 34103115504
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconstruct 6.33.1 parity port
        shell: bash
        run: |
          set -euo pipefail
          echo 'f74690679b3b6fe763851e6c2502f5706803facb4a403d9a73e56eb18eab5c19  /tmp/base-artifact/ArmorStandPet-NeoForge-26.1.2-uninterrupted-follow-source.zip' | sha256sum --check
          cat ci/port6331/part-* | base64 --decode > /tmp/port.patch.xz
          echo 'bbcdca43d5e505260d2b0640bcbd103d45b55bdc024dce417cd4b49c79de430a  /tmp/port.patch.xz' | sha256sum --check
          xz --decompress --stdout /tmp/port.patch.xz > /tmp/port.patch
          echo 'c2826459e99926dcba203165123831e7573dbc98e5427cf7b4e33bd8b625a2ee  /tmp/port.patch' | sha256sum --check

          rm -rf project artifact
          mkdir -p project artifact
          unzip -q /tmp/base-artifact/ArmorStandPet-NeoForge-26.1.2-uninterrupted-follow-source.zip -d project
          (cd project && patch --batch --forward -p1 < /tmp/port.patch)
          (cd project && patch --batch --forward -p1 < ../ci/port6331/compile-fix-001-last-hurt-player.patch)
          (cd project && patch --batch --forward -p1 < ../ci/port6331/compile-fix-002-runtime-safe.patch)

          grep -q '^minecraft_version=26.1.2$' project/gradle.properties
          grep -q '^neo_version=26.1.2.95$' project/gradle.properties
          grep -Fq 'mod_version=3.1.1+neoforge.26.1.2-fabric-6.33.1-parity-runtime-safe' project/gradle.properties
          grep -q 'JavaLanguageVersion.of(25)' project/build.gradle
          test -f project/src/main/resources/META-INF/neoforge.mods.toml
          if find project -name fabric.mod.json -print -quit | grep -q .; then exit 1; fi
          if grep -R --line-number -E 'net\.fabricmc|fabric-loom' project/src project/build.gradle project/settings.gradle project/gradle.properties; then exit 1; fi

          grep -R -q 'targetlock' project/src/main/java/io/github/kyzderp/armorstandpet
          grep -R -q 'SwimCommand' project/src/main/java/io/github/kyzderp/armorstandpet
          grep -R -q 'AquaticRuntime' project/src/main/java/io/github/kyzderp/armorstandpet
          grep -R -q 'PetBowCombatRuntime' project/src/main/java/io/github/kyzderp/armorstandpet
          grep -R -q 'PetSpecialRangedCombatRuntime' project/src/main/java/io/github/kyzderp/armorstandpet

      - name: Build production NeoForge JAR
        working-directory: project
        run: ./gradlew clean build --stacktrace --no-daemon --console=plain

      - name: Dedicated-server smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project/run
          printf 'eula=true\n' > project/run/eula.txt
          printf 'online-mode=false\nserver-port=25591\n' > project/run/server.properties
          set +e
          (cd project && (sleep 90; echo stop) | timeout 360s ./gradlew runServer --no-daemon --console=plain) > artifact/server-smoke.log 2>&1
          status=$?
          set -e
          cat artifact/server-smoke.log
          grep -q 'Done (' artifact/server-smoke.log
          if grep -q 'Failed to complete lifecycle event' artifact/server-smoke.log; then exit 1; fi
          if grep -q 'Exception caught during firing event' artifact/server-smoke.log; then exit 1; fi
          if grep -Eiq '(^|\]) *(ERROR|FATAL) ' artifact/server-smoke.log; then exit 1; fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi

      - name: Package validated port
        shell: bash
        run: |
          set -euo pipefail
          jarfile="$(find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          test -n "$jarfile"
          cp "$jarfile" artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.1-fabric-6.33.1-parity-runtime-safe.jar

          unzip -t artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.1-fabric-6.33.1-parity-runtime-safe.jar
          unzip -p artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.1-fabric-6.33.1-parity-runtime-safe.jar META-INF/neoforge.mods.toml | grep -q 'modId="armorstandpet"'
          jar tf artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.1-fabric-6.33.1-parity-runtime-safe.jar | grep -q 'io/github/kyzderp/armorstandpet/swim/AquaticRuntime.class'
          jar tf artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.1-fabric-6.33.1-parity-runtime-safe.jar | grep -q 'io/github/kyzderp/armorstandpet/normalcommands/TargetLockCommand.class'
          jar tf artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.1-fabric-6.33.1-parity-runtime-safe.jar | grep -q 'io/github/kyzderp/armorstandpet/combat/PetBowCombatRuntime.class'
          jar tf artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.1-fabric-6.33.1-parity-runtime-safe.jar | grep -q 'io/github/kyzderp/armorstandpet/combat/PetSpecialRangedCombatRuntime.class'
          if jar tf artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.1-fabric-6.33.1-parity-runtime-safe.jar | grep -q 'fabric.mod.json'; then exit 1; fi\n          if unzip -p artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.1-fabric-6.33.1-parity-runtime-safe.jar io/github/kyzderp/armorstandpet/combat/PetBowCombatRuntime.class | strings | grep -q FabricLookRuntime; then exit 1; fi\n          if unzip -p artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.1-fabric-6.33.1-parity-runtime-safe.jar io/github/kyzderp/armorstandpet/combat/PetSpecialRangedCombatRuntime.class | strings | grep -q FabricLookRuntime; then exit 1; fi

          cat /tmp/port.patch ../ci/port6331/compile-fix-001-last-hurt-player.patch ../ci/port6331/compile-fix-002-runtime-safe.patch > artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.1-fabric-6.33.1-parity-runtime-safe.patch

          printf '%s\n'             'ArmorStandPet NeoForge 26.1.2.95 — Fabric 6.33.1 parity port'             '================================================================'             'Target: Minecraft 26.1.2 / NeoForge 26.1.2.95 / Java 25'             'Port version: 3.1.1+neoforge.26.1.2-fabric-6.33.1-parity-runtime-safe'             ''             'Port base: exact previously validated NeoForge 26.1.2 source, with later NeoForge lifecycle/persistence/dimension/presentation fixes and Fabric 6.33.1 gameplay parity merged.'             ''             'Parity includes targetlock, swim/aquatic movement, surface buoyancy, shore fixes, bow/trident/potion ranged combat, Loyalty cleanup, unlimited pursuit, teleport behavior, independent health, ghost-aggro cleanup, and NeoForge-specific stability fixes.'             ''             'Validation: exact baseline and patch hashes verified; no Fabric loader/API refs; Java 25 NeoForge build succeeded; dedicated server reached Done; key parity classes present in production JAR.'             > artifact/VALIDATION.txt

          rm -rf project/.gradle project/build project/run
          (cd project && zip -qr ../artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.1-fabric-6.33.1-parity-runtime-safe-source.zip . -x '.git/*' '.github/*' '.gradle/*' 'build/*' 'run/*')
          sha256sum             artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.1-fabric-6.33.1-parity-runtime-safe.jar             artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.1-fabric-6.33.1-parity-runtime-safe-source.zip             artifact/ArmorStandPet-NeoForge-26.1.2.95-3.1.1-fabric-6.33.1-parity-runtime-safe.patch             artifact/VALIDATION.txt             artifact/server-smoke.log > artifact/SHA256SUMS.txt

      - name: Upload validated port
        uses: actions/upload-artifact@v4
        with:
          name: armorstandpet-neoforge-26.1.2-6331-parity-final
          path: artifact/
          if-no-files-found: error
