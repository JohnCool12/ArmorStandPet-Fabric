name: Build Sculk Catalyst Player Blindness Exemption

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Reconstruct cumulative production source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/egpatch.part-* | base64 --decode > /tmp/fabric-port.patch.xz
          echo '8b5eb02294d41d7ef3af71ce280dcded9920b2ae097f73043cf60c751f94c7ba  /tmp/fabric-port.patch.xz' | sha256sum --check
          git clone -q https://github.com/bigenergy/extra-golems-reborn.git project
          cd project
          git checkout -q 6b21ec4a59ca16e8362b26e38fc63b2807042bdf
          xz -dc /tmp/fabric-port.patch.xz | patch -p4 --batch --forward >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix1.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix2.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-bedrock-targetable.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix4.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-advanced-swim.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-surface-swim.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-bedrock-provocation.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-all-eyes-neutral.patch >/dev/null
          cp ../ci/GolemFinalEyesLayer.java src/main/java/com/mcmoddev/golems/client/entity/layer/GolemFinalEyesLayer.java
          cd ..
          python3 ci/apply-strict-neutral.py >/dev/null
          python3 ci/apply-legacy-neutral-migration.py >/dev/null
          python3 ci/apply-hybrid-village-neutral.py >/dev/null
          python3 ci/apply-bedrock-natural-hostility.py >/dev/null
          python3 ci/apply-stable-village-targeting.py >/dev/null
          python3 ci/apply-bedrock-true-vanilla-natural-ai.py >/dev/null
          python3 ci/apply-all-constructed-natural-ai.py >/dev/null
          python3 ci/apply-village-runtime-parity-fix.py >/dev/null
          python3 ci/apply-individual-player-target-provenance.py >/dev/null
          python3 ci/apply-minimum-iron-golem-speed.py >/dev/null
          python3 ci/apply-sculk-catalyst-player-blindness-exemption.py

          grep -q 'exclude_bystander_players' project/src/main/resources/data/golems/golems/golem/sculk_catalyst.json
          grep -q 'excludeBystanderPlayers' project/src/main/java/com/mcmoddev/golems/data/behavior/util/TargetedMobEffects.java
          grep -q 'target != directAttackTarget' project/src/main/java/com/mcmoddev/golems/data/behavior/util/TargetedMobEffects.java
          grep -q 'targetedMobEffects.apply(entity.asMob(), target)' project/src/main/java/com/mcmoddev/golems/data/behavior/EffectBehavior.java

          cp project/build.gradle /tmp/eg-production-build.gradle
          cp project/src/main/resources/fabric.mod.json /tmp/eg-production-fabric.mod.json

      - name: Install Sculk Catalyst blindness GameTest
        shell: bash
        run: |
          set -euo pipefail
          cat >> project/build.gradle <<'EOF'

          loom {
              runs {
                  gametest {
                      server()
                      name "Sculk Catalyst Blindness Game Test"
                      vmArg "-Dfabric-api.gametest"
                      vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
                      runDir "run/gametest"
                  }
              }
          }
          EOF
          python3 ci/inject-sculk-catalyst-blindness-gametest.py

      - name: Require player bystander exemption and direct-player blindness
        working-directory: project
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p run/gametest
          printf 'eula=true\n' > run/gametest/eula.txt
          set +e
          gradle runGametest --no-daemon > ../sculk-blindness-gametest.log 2>&1
          status=$?
          set -e
          test -f build/junit.xml || { tail -500 ../sculk-blindness-gametest.log; exit 1; }
          set +e
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases=list(ET.parse('build/junit.xml').getroot().iter('testcase'))
          wanted=[c for c in cases if 'sculkcatalystareablindnessskipsplayerbystandersbuthitsdirectplayer' in c.attrib.get('name','').lower()]
          if len(wanted)!=1: raise SystemExit('Sculk Catalyst blindness GameTest missing/duplicate')
          node=wanted[0].find('failure')
          if node is None: node=wanted[0].find('error')
          if node is not None: raise SystemExit('Sculk Catalyst blindness GameTest failed: '+str(node.attrib.get('message')))
          print('PASS: player bystanders exempt; direct player blinded; non-player AoE preserved.')
          PY
          parse=$?
          set -e
          if [ "$status" -ne 0 ] || [ "$parse" -ne 0 ]; then tail -500 ../sculk-blindness-gametest.log; exit 1; fi

      - name: Restore production source after GameTest
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/eg-production-build.gradle project/build.gradle
          cp /tmp/eg-production-fabric.mod.json project/src/main/resources/fabric.mod.json
          rm -f project/src/main/java/com/mcmoddev/golems/test/SculkCatalystBlindnessGameTest.java
          rm -rf project/run/gametest project/build/junit.xml

      - name: Build production JAR
        working-directory: project
        run: gradle clean build --stacktrace --no-daemon

      - name: Verify compiled implementation and resources
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          javap -classpath build/classes/java/main -p -c com.mcmoddev.golems.data.behavior.util.TargetedMobEffects > ../targeted-effects-sculk-final.txt
          javap -classpath build/classes/java/main -p -c com.mcmoddev.golems.data.behavior.EffectBehavior > ../effect-behavior-sculk-final.txt
          grep -q 'excludeBystanderPlayers' ../targeted-effects-sculk-final.txt
          grep -q 'directAttackTarget' ../targeted-effects-sculk-final.txt || grep -q 'Player' ../targeted-effects-sculk-final.txt
          grep -q 'apply.*Entity' ../effect-behavior-sculk-final.txt || grep -q 'TargetedMobEffects.apply' ../effect-behavior-sculk-final.txt
          python3 - <<'PY'
          import json
          p='src/main/resources/data/golems/golems/golem/sculk_catalyst.json'
          d=json.load(open(p))
          matches=[]
          for b in d['brain']['behaviors']:
              a=b.get('apply',{})
              e=a.get('effect',{})
              if b.get('type')=='golems:effect' and b.get('trigger')=='attack' and a.get('target')=='area' and e.get('id')=='minecraft:blindness':
                  matches.append(a)
          assert len(matches)==1
          assert matches[0].get('radius')==6.0
          assert matches[0].get('exclude_bystander_players') is True
          assert matches[0]['effect'].get('duration')==260
          print('PASS: original Sculk Catalyst blindness radius/duration preserved with bystander-player exemption.')
          PY
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('src/main/resources/data/golems/golems/golem')
          slow=[]
          for p in root.glob('*.json'):
              try: d=json.loads(p.read_text())
              except: continue
              a=d.get('attributes')
              if isinstance(a,dict) and 'speed' in a and float(a['speed']) < 0.25:
                  slow.append((p.name,float(a['speed'])))
          if slow: raise SystemExit('Sub-vanilla speeds remain: '+repr(slow))
          print('PASS: movement-speed floor preserved.')
          PY
          for f in diamond emerald sculk_catalyst ancient_debris obsidian crying_obsidian; do
            grep -q '"knockback_resistance": 1.0' "src/main/resources/data/golems/golems/golem/$f.json"
          done

      - name: Dedicated server smoke test
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          set +e
          timeout --signal=TERM 90s gradle runServer --no-daemon > ../server-sculk-final.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then cat ../server-sculk-final.log; exit "$status"; fi
          grep -q 'Done (' run/server/logs/latest.log

      - name: Client render/resource smoke test
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          setsid env ALSOFT_DRIVERS=null LIBGL_ALWAYS_SOFTWARE=true xvfb-run -a gradle runClient --no-daemon > ../client-sculk-final.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 90); do
            if [ -f run/client/logs/latest.log ] && grep -q 'minecraft:textures/atlas/blocks.png-atlas' run/client/logs/latest.log; then sleep 10; kill -0 "$pid" 2>/dev/null && ok=1; break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill -TERM -- -"$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          test "$ok" -eq 1

      - name: Collect production artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp project/build/libs/Extra-Golems-Reborn-Fabric-1.21.1-21.1.0.1-fabric.jar artifact/
          unzip -t artifact/Extra-Golems-Reborn-Fabric-1.21.1-21.1.0.1-fabric.jar
          sha256sum artifact/Extra-Golems-Reborn-Fabric-1.21.1-21.1.0.1-fabric.jar

      - uses: actions/upload-artifact@v4
        with:
          name: extra-golems-reborn-fabric-1.21.1-sculk-player-bystander-exemption
          path: artifact/*.jar
