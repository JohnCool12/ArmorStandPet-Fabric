name: Build Extra Golems Bedrock True Vanilla Natural AI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build carrier
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Reconstruct Fabric port patch
        shell: bash
        run: |
          set -euo pipefail
          cat ci/egpatch.part-* | base64 --decode > /tmp/fabric-port.patch.xz
          echo '8b5eb02294d41d7ef3af71ce280dcded9920b2ae097f73043cf60c751f94c7ba  /tmp/fabric-port.patch.xz' | sha256sum --check

      - name: Restore source and apply cumulative fixes
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/bigenergy/extra-golems-reborn.git project
          cd project
          git checkout 6b21ec4a59ca16e8362b26e38fc63b2807042bdf
          xz -dc /tmp/fabric-port.patch.xz | patch -p4 --batch --forward
          patch -p1 --batch --forward < ../ci/eg-fix1.patch
          patch -p1 --batch --forward < ../ci/eg-fix2.patch
          patch -p1 --batch --forward < ../ci/eg-bedrock-targetable.patch
          patch -p1 --batch --forward < ../ci/eg-fix4.patch
          patch -p1 --batch --forward < ../ci/eg-advanced-swim.patch
          patch -p1 --batch --forward < ../ci/eg-surface-swim.patch
          patch -p1 --batch --forward < ../ci/eg-bedrock-provocation.patch
          patch -p1 --batch --forward < ../ci/eg-all-eyes-neutral.patch
          cp ../ci/GolemFinalEyesLayer.java src/main/java/com/mcmoddev/golems/client/entity/layer/GolemFinalEyesLayer.java
          cd ..
          python3 ci/apply-strict-neutral.py
          python3 ci/apply-legacy-neutral-migration.py
          python3 ci/apply-hybrid-village-neutral.py
          python3 ci/apply-bedrock-natural-hostility.py
          python3 ci/apply-stable-village-targeting.py
          python3 ci/apply-bedrock-true-vanilla-natural-ai.py
          cd project

          test -f build.gradle
          test -f src/main/resources/fabric.mod.json
          grep -q 'extra_golems_bedrock_true_vanilla_natural_ai_v4' src/main/java/com/mcmoddev/golems/entity/GolemBase.java
          grep -q 'configureBedrockNaturalIronGolemTargeting' src/main/java/com/mcmoddev/golems/entity/GolemBase.java
          grep -q 'if (isBedrockGolem()) {' src/main/java/com/mcmoddev/golems/entity/GolemBase.java
          grep -q 'this.removeTag(NEUTRAL_CONSTRUCTED_TAG);' src/main/java/com/mcmoddev/golems/entity/GolemBase.java
          grep -q 'this.setPlayerCreated(false);' src/main/java/com/mcmoddev/golems/entity/GolemBase.java
          grep -q '!isBedrockGolem() && !isConstructedNeutral()' src/main/java/com/mcmoddev/golems/entity/GolemBase.java
          grep -q 'new DefendVillageTargetGoal(this)' src/main/java/com/mcmoddev/golems/entity/GolemBase.java
          grep -q 'new HurtByTargetGoal(this)' src/main/java/com/mcmoddev/golems/entity/GolemBase.java
          grep -q 'entity instanceof Enemy && !(entity instanceof Creeper)' src/main/java/com/mcmoddev/golems/entity/GolemBase.java
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src/main/java/com/mcmoddev/golems/entity/GolemBase.java').read_text()
          start = s.index('\tprivate void configureBedrockNaturalIronGolemTargeting() {')
          end = s.index('\n\tprivate ', start + 2)
          natural = s[start:end]
          assert natural.count('targetSelector.getAvailableGoals().clear()') == 1
          assert 'new DefendVillageTargetGoal(this)' in natural
          assert 'new HurtByTargetGoal(this)' in natural
          assert 'new NearestAttackableTargetGoal<>(this, Player.class, 10, true, false' in natural
          assert 'this::isAngryAt' in natural
          assert 'entity instanceof Enemy && !(entity instanceof Creeper)' in natural
          assert 'new ResetUniversalAngerTargetGoal<>(this, false)' in natural
          assert 'isConstructedNeutralInVillage()' not in natural
          mark_start = s.index('\tpublic void markConstructedNeutral() {')
          mark_end = s.index('\n\tprivate ', mark_start + 2)
          mark = s[mark_start:mark_end]
          bedrock_branch = mark[mark.index('if (isBedrockGolem()) {'):mark.index('\n\t\tthis.addTag(NEUTRAL_CONSTRUCTED_TAG);')]
          assert 'removeTag(NEUTRAL_CONSTRUCTED_TAG)' in bedrock_branch
          assert 'setPlayerCreated(false)' in bedrock_branch
          assert 'configureBedrockNaturalIronGolemTargeting()' in bedrock_branch
          assert 'addTag(BEDROCK_NATURAL_HOSTILITY_TAG)' in bedrock_branch
          hurt_start = s.index('\tpublic boolean hurt(final DamageSource source, final float amount) {')
          hurt_end = s.index('\n\t@Override', hurt_start + 10)
          hurt = s[hurt_start:hurt_end]
          b = hurt[hurt.index('if (isBedrockGolem() && sourceEntity instanceof LivingEntity attacker'):]
          assert 'this.setLastHurtByMob(attacker);' in b
          assert 'this.setTarget(attacker);' not in b
          assert 'this.startPersistentAngerTimer();' not in b
          print('Bedrock true-vanilla-natural AI static verification passed')
          PY
          grep -q 'GolemFinalEyesLayer' src/main/java/com/mcmoddev/golems/client/entity/GolemRenderer.java
          grep -q 'this.setInvulnerable(false);' src/main/java/com/mcmoddev/golems/entity/GolemBase.java
          grep -q 'usesIronGolemSounds' src/main/java/com/mcmoddev/golems/entity/GolemBase.java
          grep -q 'Surface swimming AI' src/main/java/com/mcmoddev/golems/entity/GolemBase.java
          for f in diamond emerald sculk_catalyst ancient_debris obsidian crying_obsidian; do
            grep -q '"knockback_resistance": 1.0' "src/main/resources/data/golems/golems/golem/$f.json"
          done

      - name: Inject Bedrock AI regression GameTest
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/inject-bedrock-ai-gametest.py
          grep -q 'fabric-gametest' project/src/main/resources/fabric.mod.json
          test -f project/src/main/java/com/mcmoddev/golems/test/BedrockNaturalAiGameTest.java

      - name: Run Bedrock-vs-vanilla combat AI GameTest
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/gametest
          printf 'eula=true\n' > run/gametest/eula.txt
          gradle tasks --all --no-daemon | grep -i 'runGametest'
          set +e
          gradle runGametest --stacktrace --no-daemon
          gametest_status=$?
          set -e
          test -f build/junit.xml
          cat build/junit.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('build/junit.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
          failures = sum(int(s.attrib.get('failures', '0')) for s in suites)
          errors = sum(int(s.attrib.get('errors', '0')) for s in suites)
          for case in root.iter('testcase'):
              for tag in ('failure', 'error'):
                  node = case.find(tag)
                  if node is not None:
                      print(f"ASSERTION DETAIL: {case.attrib.get('name')}: {node.attrib.get('message')}")
                      if node.text:
                          print(node.text)
          if failures or errors:
              raise SystemExit(f'GameTest report contains failures={failures}, errors={errors}')
          print('Bedrock-vs-vanilla combat AI GameTest report passed')
          PY
          if [ "$gametest_status" -ne 0 ]; then
            echo "runGametest returned $gametest_status despite a clean parsed report"
            exit "$gametest_status"
          fi

      - name: Remove CI-only GameTest harness
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/remove-bedrock-ai-gametest.py
          ! grep -q 'fabric-gametest' project/src/main/resources/fabric.mod.json
          test ! -e project/src/main/java/com/mcmoddev/golems/test/BedrockNaturalAiGameTest.java

      - name: Build production JAR
        working-directory: project
        run: gradle clean build --stacktrace --no-daemon

      - name: Inspect compiled Bedrock AI bytecode
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          javap -classpath build/classes/java/main -p -c com.mcmoddev.golems.entity.GolemBase > ../golem-base-javap.txt
          grep -n -A90 'configureBedrockNaturalIronGolemTargeting' ../golem-base-javap.txt
          grep -n -A80 'markConstructedNeutral' ../golem-base-javap.txt
          grep -q 'configureBedrockNaturalIronGolemTargeting' ../golem-base-javap.txt

      - name: Smoke-test dedicated Fabric server
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          set +e
          timeout --signal=TERM 90s gradle runServer --no-daemon > ../server-smoke.log 2>&1
          status=$?
          set -e
          cat ../server-smoke.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
          test -f run/server/logs/latest.log
          grep -q 'Done (' run/server/logs/latest.log

      - name: Smoke-test Fabric client
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run
          setsid env ALSOFT_DRIVERS=null LIBGL_ALWAYS_SOFTWARE=true xvfb-run -a gradle runClient --no-daemon > ../client-smoke.log 2>&1 &
          pid=$!
          success=0
          for i in $(seq 1 90); do
            if [ -f run/client/logs/latest.log ] && grep -q 'minecraft:textures/atlas/blocks.png-atlas' run/client/logs/latest.log; then
              sleep 10
              if kill -0 "$pid" 2>/dev/null; then success=1; fi
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          cat ../client-smoke.log
          if [ -f run/client/logs/latest.log ] && grep -q 'Mixin apply for mod golems failed' run/client/logs/latest.log; then success=0; fi
          kill -TERM -- -"$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ "$success" -ne 1 ]; then exit 1; fi

      - name: Collect production JAR
        shell: bash
        run: |
          mkdir -p artifact
          find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} artifact/ \;
          test -n "$(find artifact -maxdepth 1 -type f -name '*.jar' -print -quit)"
          ls -lah artifact

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: extra-golems-reborn-fabric-1.21.1-bedrock-true-vanilla-natural-ai-gametest-verified
          path: artifact/*.jar
          if-no-files-found: error