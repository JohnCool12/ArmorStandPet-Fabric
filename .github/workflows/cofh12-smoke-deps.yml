name: CoFH Core 12 smoke deps

on:
  push:
    branches:
      - chatgpt/cofhcore-exact-12-build-20260816
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch launcher-only dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out/net/fabricmc/dev-launch-injector/0.2.1+build.8
          mkdir -p out/net/minecrell/terminalconsoleappender/1.3.0
          curl -fL 'https://maven.fabricmc.net/net/fabricmc/dev-launch-injector/0.2.1%2Bbuild.8/dev-launch-injector-0.2.1%2Bbuild.8.jar' -o 'out/net/fabricmc/dev-launch-injector/0.2.1+build.8/dev-launch-injector-0.2.1+build.8.jar'
          curl -fL 'https://maven.fabricmc.net/net/fabricmc/dev-launch-injector/0.2.1%2Bbuild.8/dev-launch-injector-0.2.1%2Bbuild.8.pom' -o 'out/net/fabricmc/dev-launch-injector/0.2.1+build.8/dev-launch-injector-0.2.1+build.8.pom'

          cat > /tmp/pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>local</groupId><artifactId>cofh-smoke-deps</artifactId><version>1</version>
            <dependencies>
              <dependency><groupId>net.minecrell</groupId><artifactId>terminalconsoleappender</artifactId><version>1.3.0</version></dependency>
            </dependencies>
          </project>
          EOF
          mvn -q -f /tmp/pom.xml dependency:go-offline
          mkdir -p out/net/minecrell out/org/jline
          cp -a "$HOME/.m2/repository/net/minecrell/terminalconsoleappender" out/net/minecrell/
          cp -a "$HOME/.m2/repository/org/jline/." out/org/jline/
          if [ -d "$HOME/.m2/repository/org/fusesource" ]; then mkdir -p out/org/fusesource; cp -a "$HOME/.m2/repository/org/fusesource/." out/org/fusesource/; fi
          find out -type f -maxdepth 12 -print -exec sha256sum {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: cofh12-smoke-deps
          if-no-files-found: error
          path: out
