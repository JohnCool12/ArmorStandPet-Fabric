name: MobBattle Fabric 1.21.1 Full Parity Temp

on:
  push:
    branches: [mobbattle-fabric-121-full-parity]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Clone exact Mob Battle 2.8.0 / Minecraft 1.21.1 source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Flemmli97/MobBattle.git upstream
          cd upstream
          git checkout --detach d87a81a96dc8a3b0246c4396efe8c96ef2beac24
          test "$(git rev-parse HEAD)" = 'd87a81a96dc8a3b0246c4396efe8c96ef2beac24'
          test "$(grep '^minecraft_version=' gradle.properties)" = 'minecraft_version=1.21.1'
          test "$(grep '^mod_version=' gradle.properties)" = 'mod_version=2.8.0'
      - name: Verify and apply full-parity overlay
        shell: bash
        run: |
          set -euo pipefail
          echo '85cfae2b7b38063baa343f5d1cbe5f26299a0b2bcb129bb37e7d0990a426f378  mobbattle-port/overlay.part0.b64' | sha256sum -c
          echo '779f458c8bab95a9415ecdac0229d338b01bf9f5766dadaadd2020bb3e4debd8  mobbattle-port/overlay.part1.b64' | sha256sum -c
          echo '6107594b972765496f527b458e301e2ae61372c118f776b201250da835398856  mobbattle-port/overlay.part2.b64' | sha256sum -c
          echo 'c048abdc499b0f0b66340d92f333b6807c9131ac13c77eae498a8cbb43e8710e  mobbattle-port/overlay.part3a.b64' | sha256sum -c
          echo '49ce669fe1c25178c61c30352a60a458198a21974c78056de0a7e8937f6297b0  mobbattle-port/overlay.part3c0.b64' | sha256sum -c
          echo '366dd56f98d766b81540f18a5a712b5a5a0912e92de49de436a2374fbb44c686  mobbattle-port/overlay.part3c1.b64' | sha256sum -c
          echo '4a3fd0b83ccacb560c36e00eada6ef5f2631b53d8a07053d28db282d7aa4271e  mobbattle-port/overlay.part3c2.b64' | sha256sum -c
          echo '82bdfbb5876067ebbd70042c0df71f653faa32af7e1a3a6a36a5fdfdaeff13c7  mobbattle-port/overlay.part3c3.b64' | sha256sum -c
          echo '909db4fb3fad34aea7e9478d03329b2f66c43b012e5965fd9cc7c20005966967  mobbattle-port/overlay.part3c4.b64' | sha256sum -c
          echo '30d98f3ca4450aa7335607a1ba7e5a1271b1468c3378a8f1e467be2dd698d3ab  mobbattle-port/overlay.part3c5.b64' | sha256sum -c
          echo '4ebb0e8ae2dda9a2bdef000b1a94b7397f500b2d29d7275051e73c71cf7de660  mobbattle-port/overlay.part3c6.b64' | sha256sum -c
          echo 'f2f0fcaf551c966156b39bd505b609bb39078772ba6d53b51da9db2e7c51f488  mobbattle-port/overlay.part3c7.b64' | sha256sum -c
          echo 'f7089048e17f43d155d2d6d6783503262ff3f56eb2c70cc2eb0840728084b930  mobbattle-port/overlay.part4.b64' | sha256sum -c
          cat mobbattle-port/overlay.part0.b64 mobbattle-port/overlay.part1.b64 mobbattle-port/overlay.part2.b64 mobbattle-port/overlay.part3a.b64 mobbattle-port/overlay.part3c{0,1,2,3,4,5,6,7}.b64 mobbattle-port/overlay.part4.b64 > /tmp/mobbattle-overlay.b64
          base64 --decode /tmp/mobbattle-overlay.b64 > /tmp/mobbattle-overlay.zip
          echo '39d51d3a842abaf416a5ca3067babca6e5d87f520af0c1d006275e8a7a6fc85a  /tmp/mobbattle-overlay.zip' | sha256sum -c
          unzip -t /tmp/mobbattle-overlay.zip
          unzip -o /tmp/mobbattle-overlay.zip -d upstream
          sed -i 's/^mod_version=.*/mod_version=2.8.0-full-parity.1/' upstream/gradle.properties
      - name: Build real Fabric Loom JAR
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :fabric:build --stacktrace --no-daemon
      - name: Run Fabric 1.21.1 dedicated server smoke test
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../audit run fabric/run
          printf 'eula=true\n' > run/eula.txt
          printf 'eula=true\n' > fabric/run/eula.txt
          set +e
          timeout 120s ./gradlew :fabric:runServer --stacktrace --no-daemon > ../audit/server-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then cat ../audit/server-smoke.log; exit "$code"; fi
          grep -Eq 'Done \([0-9.]+s\)!' ../audit/server-smoke.log || { cat ../audit/server-smoke.log; exit 1; }
          if grep -Eiq 'Mixin apply failed|InvalidMixinException|InjectionError|Critical injection failure|EntrypointException|Could not execute entrypoint|FATAL' ../audit/server-smoke.log; then cat ../audit/server-smoke.log; exit 1; fi
      - name: Collect and audit production JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact audit
          FINAL="$(find upstream/fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          test -n "$FINAL"
          cp "$FINAL" artifact/MobBattle-Fabric-1.21.1-2.8.0-FULL-PARITY.jar
          unzip -t artifact/MobBattle-Fabric-1.21.1-2.8.0-FULL-PARITY.jar | tee audit/unzip-test.txt
          unzip -p artifact/MobBattle-Fabric-1.21.1-2.8.0-FULL-PARITY.jar fabric.mod.json | tee audit/fabric.mod.json
          jar tf artifact/MobBattle-Fabric-1.21.1-2.8.0-FULL-PARITY.jar > audit/final-entries.txt
          for required in io/github/flemmli97/mobbattle/common/entity/goal/ForcedTargetGoal.class io/github/flemmli97/mobbattle/common/items/MobStickOneWay.class io/github/flemmli97/mobbattle/common/items/MobGroupOneWay.class io/github/flemmli97/mobbattle/common/utils/ActiveBattlePersistenceCompat.class io/github/flemmli97/mobbattle/common/utils/PiglinAngerCompat.class io/github/flemmli97/mobbattle/common/utils/SelectionPersistenceMobbattle.class io/github/flemmli97/mobbattle/mixin/MobSelectionPersistenceMixin.class io/github/flemmli97/mobbattle/mixin/PiglinAiMixin.class io/github/flemmli97/mobbattle/mixin/PiglinBruteAiMixin.class assets/mobbattle/models/item/mob_stick_one_way.json assets/mobbattle/models/item/mob_group_one_way.json; do grep -Fxq "$required" audit/final-entries.txt || exit 1; done
          sha256sum artifact/MobBattle-Fabric-1.21.1-2.8.0-FULL-PARITY.jar | tee audit/SHA256SUMS.txt
          tar --exclude='.git' --exclude='.gradle' --exclude='build' --exclude='run' --exclude='fabric/run' -czf artifact/MobBattle-Fabric-1.21.1-2.8.0-FULL-PARITY-source.tar.gz -C upstream .
      - name: Upload full-parity build
        uses: actions/upload-artifact@v4
        with:
          name: mobbattle-fabric-1.21.1-full-parity
          path: |
            artifact/MobBattle-Fabric-1.21.1-2.8.0-FULL-PARITY.jar
            artifact/MobBattle-Fabric-1.21.1-2.8.0-FULL-PARITY-source.tar.gz
            audit/*
          if-no-files-found: error
