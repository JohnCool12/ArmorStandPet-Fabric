name: MobBattle Fabric 1.21.1 Full Parity Temp

on:
  push:
    branches: [mobbattle-fabric-121-full-parity]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone exact Mob Battle 2.8.0 / Minecraft 1.21.1 source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Flemmli97/MobBattle.git upstream
          cd upstream
          git checkout --detach d87a81a96dc8a3b0246c4396efe8c96ef2beac24
          test "$(git rev-parse HEAD)" = 'd87a81a96dc8a3b0246c4396efe8c96ef2beac24'
          test "$(grep '^minecraft_version=' gradle.properties)" = 'minecraft_version=1.21.1'
          test "$(grep '^mod_version=' gradle.properties)" = 'mod_version=2.8.0'

      - name: Apply full-parity 1.21.1 source overlay
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode ci/mobbattle-fabric-121-overrides.tar.gz.b64 > /tmp/mobbattle-overrides.tar.gz
          echo 'ca36501f9d1192c0a060fdc11327e820e7517afea8f7b951f1d09c0fc2e86317  /tmp/mobbattle-overrides.tar.gz' | sha256sum --check
          tar -xzf /tmp/mobbattle-overrides.tar.gz -C upstream

          # Minecraft 1.21.1 IronGolem does not override canAttack(LivingEntity).
          # The generic LivingMixin already hooks the inherited LivingEntity method,
          # so the later-version IronGolem-specific mixin is redundant and invalid here.
          rm -f upstream/common/src/main/java/io/github/flemmli97/mobbattle/mixin/IronGolemMixin.java
          python3 - <<'PY'
          import json
          p = 'upstream/common/src/main/resources/mobbattle.mixins.json'
          with open(p, encoding='utf-8') as f:
              data = json.load(f)
          for key in ('mixins', 'server', 'client'):
              if key in data and isinstance(data[key], list):
                  data[key] = [x for x in data[key] if x != 'IronGolemMixin']
          with open(p, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PY

          grep -q '^mod_version=2.8.0-full-parity.1$' upstream/gradle.properties
          grep -q 'MobStickOneWay' upstream/common/src/main/java/io/github/flemmli97/mobbattle/common/registry/MobBattleItems.java
          grep -q 'ActiveBattlePersistenceCompat' upstream/common/src/main/java/io/github/flemmli97/mobbattle/mixin/MobSelectionPersistenceMixin.java
          grep -q 'PiglinAiMixin' upstream/common/src/main/resources/mobbattle.mixins.json
          ! grep -q 'IronGolemMixin' upstream/common/src/main/resources/mobbattle.mixins.json

      - name: Build real Fabric Loom JAR
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :fabric:build --stacktrace --no-daemon

      - name: Run Fabric 1.21.1 dedicated server smoke test
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../audit run fabric/run
          printf 'eula=true\n' > run/eula.txt
          printf 'eula=true\n' > fabric/run/eula.txt
          set +e
          timeout 120s ./gradlew :fabric:runServer --stacktrace --no-daemon > ../audit/server-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            cat ../audit/server-smoke.log
            exit "$code"
          fi
          if ! grep -Eq 'Done \([0-9.]+s\)! For help|Done \([0-9.]+s\)!' ../audit/server-smoke.log; then
            cat ../audit/server-smoke.log
            echo 'Dedicated server never reached Done' >&2
            exit 1
          fi
          if grep -Eiq 'Mixin apply failed|InvalidMixinException|InjectionError|Critical injection failure|EntrypointException|Could not execute entrypoint|FATAL' ../audit/server-smoke.log; then
            cat ../audit/server-smoke.log
            echo 'Fatal mixin/entrypoint failure detected' >&2
            exit 1
          fi
          echo 'FABRIC_1_21_1_DEDICATED_SERVER_SMOKE_PASS'

      - name: Collect and audit production JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact audit
          find upstream/fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print
          FINAL="$(find upstream/fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          test -n "$FINAL"
          cp "$FINAL" artifact/MobBattle-Fabric-1.21.1-2.8.0-FULL-PARITY.jar
          unzip -t artifact/MobBattle-Fabric-1.21.1-2.8.0-FULL-PARITY.jar | tee audit/unzip-test.txt
          unzip -p artifact/MobBattle-Fabric-1.21.1-2.8.0-FULL-PARITY.jar fabric.mod.json | tee audit/fabric.mod.json
          jar tf artifact/MobBattle-Fabric-1.21.1-2.8.0-FULL-PARITY.jar > audit/final-entries.txt
          for required in \
            io/github/flemmli97/mobbattle/common/entity/goal/ForcedTargetGoal.class \
            io/github/flemmli97/mobbattle/common/items/MobStickOneWay.class \
            io/github/flemmli97/mobbattle/common/items/MobGroupOneWay.class \
            io/github/flemmli97/mobbattle/common/utils/ActiveBattlePersistenceCompat.class \
            io/github/flemmli97/mobbattle/common/utils/PiglinAngerCompat.class \
            io/github/flemmli97/mobbattle/common/utils/SelectionPersistenceMobbattle.class \
            io/github/flemmli97/mobbattle/mixin/MobSelectionPersistenceMixin.class \
            io/github/flemmli97/mobbattle/mixin/PiglinAiMixin.class \
            io/github/flemmli97/mobbattle/mixin/PiglinBruteAiMixin.class \
            assets/mobbattle/models/item/mob_stick_one_way.json \
            assets/mobbattle/models/item/mob_group_one_way.json; do
              grep -Fxq "$required" audit/final-entries.txt || { echo "MISSING $required"; exit 1; }
          done
          if grep -q '^META-INF/neoforge.mods.toml$' audit/final-entries.txt; then
            echo 'Unexpected NeoForge metadata in Fabric output' >&2
            exit 1
          fi
          sha256sum artifact/MobBattle-Fabric-1.21.1-2.8.0-FULL-PARITY.jar | tee audit/SHA256SUMS.txt
          tar --exclude='.git' --exclude='.gradle' --exclude='build' -czf artifact/MobBattle-Fabric-1.21.1-2.8.0-FULL-PARITY-source.tar.gz -C upstream .

      - name: Upload full-parity build
        uses: actions/upload-artifact@v4
        with:
          name: mobbattle-fabric-1.21.1-full-parity
          path: |
            artifact/MobBattle-Fabric-1.21.1-2.8.0-FULL-PARITY.jar
            artifact/MobBattle-Fabric-1.21.1-2.8.0-FULL-PARITY-source.tar.gz
            audit/*
          if-no-files-found: error
