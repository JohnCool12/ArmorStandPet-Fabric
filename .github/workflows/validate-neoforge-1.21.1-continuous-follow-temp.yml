name: Validate NeoForge 1.21.1 continuous follow

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact validated fluid-follow baseline
        uses: actions/download-artifact@v4
        with:
          name: armorstandpet-neoforge-1.21.1-fluid-follow
          path: /tmp/base-artifact
          run-id: 30945769991
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate, compile, smoke-test and package
        run: bash ci/validate-neoforge-1.21.1-continuous-follow.sh /tmp/base-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: armorstandpet-neoforge-1.21.1-continuous-follow
          path: artifact/
          if-no-files-found: error
