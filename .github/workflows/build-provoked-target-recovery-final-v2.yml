name: Build Provoked Target Recovery Final V2
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Reconstruct cumulative production source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/egpatch.part-* | base64 --decode > /tmp/fabric-port.patch.xz
          echo '8b5eb02294d41d7ef3af71ce280dcded9920b2ae097f73043cf60c751f94c7ba  /tmp/fabric-port.patch.xz' | sha256sum --check
          git clone -q https://github.com/bigenergy/extra-golems-reborn.git project
          cd project; git checkout -q 6b21ec4a59ca16e8362b26e38fc63b2807042bdf
          xz -dc /tmp/fabric-port.patch.xz | patch -p4 --batch --forward >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix1.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix2.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-bedrock-targetable.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix4.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-advanced-swim.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-surface-swim.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-bedrock-provocation.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-all-eyes-neutral.patch >/dev/null
          cp ../ci/GolemFinalEyesLayer.java src/main/java/com/mcmoddev/golems/client/entity/layer/GolemFinalEyesLayer.java
          cd ..
          for s in apply-strict-neutral.py apply-legacy-neutral-migration.py apply-hybrid-village-neutral.py apply-bedrock-natural-hostility.py apply-stable-village-targeting.py apply-bedrock-true-vanilla-natural-ai.py apply-all-constructed-natural-ai.py apply-village-runtime-parity-fix.py apply-individual-player-target-provenance.py apply-minimum-iron-golem-speed.py apply-sculk-catalyst-player-blindness-exemption.py refine-sculk-catalyst-player-blindness-predicate.py apply-village-golem-pretracking-initialization.py apply-village-golem-failed-replacement-fallback.py apply-village-golem-spawn-helper.py apply-provoked-target-interruption-recovery.py; do python3 ci/$s >/dev/null; done
          python3 ci/fix-provoked-recovery-compile.py >/dev/null
          cp project/src/main/java/com/mcmoddev/golems/entity/GolemBase.java /tmp/prod-GolemBase.java
          cp project/build.gradle /tmp/prod-build.gradle
          cp project/src/main/resources/fabric.mod.json /tmp/prod-fabric.mod.json
          grep -q 'private Player interruptedDirectPlayerProvoker;' /tmp/prod-GolemBase.java
          grep -q 'recoverInterruptedDirectPlayerProvocation' /tmp/prod-GolemBase.java
          ! grep -q 'T-built Extra Golems use one retaliation episode only' /tmp/prod-GolemBase.java
          ! grep -q '!isConstructedNeutral() && !this.isPlayerCreated() && this.getPersistentAngerTarget() != null' /tmp/prod-GolemBase.java
      - name: Install recovery GameTests
        shell: bash
        run: |
          python3 ci/inject-provoked-target-recovery-gametests.py
          python3 ci/fix-provoked-recovery-compile.py >/dev/null
      - name: Run recovery GameTests
        working-directory: project
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p run/gametest; printf 'eula=true\n' > run/gametest/eula.txt
          set +e; gradle runGametest --no-daemon > ../provoked-recovery-gametest.log 2>&1; status=$?; set -e
          test -f build/junit.xml || { tail -500 ../provoked-recovery-gametest.log; exit 1; }
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases=list(ET.parse('build/junit.xml').getroot().iter('testcase'))
          wanted=[c for c in cases if 'directplayerisreacquired' in c.attrib.get('name','').lower() or 'creativecancels' in c.attrib.get('name','').lower()]
          if len(wanted)!=2: raise SystemExit('Expected exactly 2 recovery tests, got '+str(len(wanted)))
          bad=[]
          for c in wanted:
              n=c.find('failure'); n=n if n is not None else c.find('error')
              if n is not None: bad.append((c.attrib.get('name'),n.attrib.get('message')))
          if bad: raise SystemExit('Recovery failures: '+repr(bad))
          print('PASS: player reacquisition and invalid-player hostile recovery both passed.')
          PY
          if [ "$status" -ne 0 ]; then tail -500 ../provoked-recovery-gametest.log; exit 1; fi
      - name: Restore production-only sources
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/prod-GolemBase.java project/src/main/java/com/mcmoddev/golems/entity/GolemBase.java
          cp /tmp/prod-build.gradle project/build.gradle
          cp /tmp/prod-fabric.mod.json project/src/main/resources/fabric.mod.json
          rm -f project/src/main/java/com/mcmoddev/golems/test/ProvokedTargetRecoveryGameTest.java
          rm -rf project/run/gametest project/build/junit.xml
      - name: Build production JAR
        working-directory: project
        run: gradle clean build --stacktrace --no-daemon
      - name: Verify compiled recovery and cumulative resources
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          javap -classpath build/classes/java/main -p -c com.mcmoddev.golems.entity.GolemBase > ../golembase-recovery.txt
          grep -q 'interruptedDirectPlayerProvoker' ../golembase-recovery.txt
          grep -q 'recoverInterruptedDirectPlayerProvocation' ../golembase-recovery.txt
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('src/main/resources/data/golems/golems/golem')
          slow=[]
          for p in root.glob('*.json'):
              try:d=json.loads(p.read_text())
              except:continue
              a=d.get('attributes')
              if isinstance(a,dict) and 'speed' in a and float(a['speed'])<.25: slow.append((p.name,a['speed']))
          if slow: raise SystemExit('Sub-vanilla speeds: '+repr(slow))
          sc=json.loads((root/'sculk_catalyst.json').read_text()); m=[]
          for b in sc['brain']['behaviors']:
              a=b.get('apply',{}); e=a.get('effect',{})
              if b.get('type')=='golems:effect' and b.get('trigger')=='attack' and a.get('target')=='area' and e.get('id')=='minecraft:blindness':m.append(a)
          assert len(m)==1 and m[0].get('exclude_bystander_players') is True and m[0].get('radius')==6.0 and m[0]['effect'].get('duration')==260
          print('PASS: cumulative speed and Sculk behavior preserved')
          PY
          for f in diamond emerald sculk_catalyst ancient_debris obsidian crying_obsidian; do grep -q '"knockback_resistance": 1.0' "src/main/resources/data/golems/golems/golem/$f.json"; done
      - name: Dedicated server smoke test
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/server; printf 'eula=true\n' > run/server/eula.txt
          set +e; timeout --signal=TERM 90s gradle runServer --no-daemon > ../server-provoked-recovery.log 2>&1; status=$?; set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then cat ../server-provoked-recovery.log; exit "$status"; fi
          grep -q 'Done (' run/server/logs/latest.log
      - name: Client render/resource smoke test
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          setsid env ALSOFT_DRIVERS=null LIBGL_ALWAYS_SOFTWARE=true xvfb-run -a gradle runClient --no-daemon > ../client-provoked-recovery.log 2>&1 &
          pid=$!; ok=0
          for i in $(seq 1 90); do
            if [ -f run/client/logs/latest.log ] && grep -q 'minecraft:textures/atlas/blocks.png-atlas' run/client/logs/latest.log; then sleep 10; kill -0 "$pid" 2>/dev/null && ok=1; break; fi
            kill -0 "$pid" 2>/dev/null || break; sleep 1
          done
          kill -TERM -- -"$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; test "$ok" -eq 1
      - name: Collect production artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp project/build/libs/Extra-Golems-Reborn-Fabric-1.21.1-21.1.0.1-fabric.jar artifact/
          unzip -t artifact/Extra-Golems-Reborn-Fabric-1.21.1-21.1.0.1-fabric.jar
          sha256sum artifact/Extra-Golems-Reborn-Fabric-1.21.1-21.1.0.1-fabric.jar
      - uses: actions/upload-artifact@v4
        with:
          name: extra-golems-reborn-fabric-1.21.1-provoked-target-recovery-final-v2
          path: artifact/*.jar
