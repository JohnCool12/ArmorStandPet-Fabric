name: V8 Respawn-Local Chorus Totem Effects Build

on:
  pull_request:
    branches:
      - ci/v10-v8-respawn-effects-base-20260821

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone exact Artifacts 13.2.1 source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/ochotonida/artifacts.git project
          cd project
          git checkout c9c3a3debb1054eb5535600e44dc0834201f0943
          test "$(git rev-parse HEAD)" = "c9c3a3debb1054eb5535600e44dc0834201f0943"
          grep -Fx 'minecraft_version=1.21.1' gradle.properties
          grep -Fx 'mod_version=13.2.1' gradle.properties

      - name: Apply V8 baseline and respawn-local presentation fix
        shell: bash
        run: |
          set -euo pipefail
          cd project
          python "$GITHUB_WORKSPACE/ci/artifacts-v8-minimal-patch.py"
          python "$GITHUB_WORKSPACE/ci/artifacts-v10-v8-respawn-effects.py"

          TELEPORT=common/src/main/java/artifacts/component/ability/DeathProtectionTeleport.java
          COMPAT=common/src/main/java/artifacts/compat/hardcorerevival/HardcoreRevivalFinalDeathCompat.java

          grep -F 'player.server.schedule(new TickTask(player.server.getTickCount() + 1' "$TELEPORT"
          grep -F 'destinationLevel.broadcastEntityEvent(live, (byte) 46);' "$TELEPORT"
          grep -F 'SoundEvents.CHORUS_FRUIT_TELEPORT' "$TELEPORT"
          test "$(grep -Fc 'destinationLevel.broadcastEntityEvent(live, (byte) 46);' "$TELEPORT")" -eq 1
          ! grep -Fq 'oldLevel.playSound' "$TELEPORT"
          ! grep -Fq 'ServerLevel oldLevel = level;' "$TELEPORT"

          grep -F 'player.server.schedule(new TickTask(player.server.getTickCount() + 1' "$COMPAT"
          grep -F 'live.serverLevel().playSound(live, live.getX(), live.getY(), live.getZ(),' "$COMPAT"
          ! grep -Fq 'player.server.execute(' "$COMPAT"

          grep -F 'findRespawnPositionAndUseSpawnBlock(false, DimensionTransition.DO_NOTHING)' "$TELEPORT"
          grep -F 'Codec.intRange(1, 3)' common/src/main/java/artifacts/registry/ModDataComponents.java
          grep -F 'schedulePostTeleportEffects(serverPlayer)' common/src/main/java/artifacts/mixin/compat/hardcorerevival/HardcoreRevivalManagerMixin.java
          test ! -e common/src/generated/resources/data/hardcorerevival/tags/item/passthrough_death_when_held.json
          git diff --check

      - name: Build Fabric 1.21.1
        shell: bash
        run: |
          set -euo pipefail
          cd project
          chmod +x gradlew
          ./gradlew :fabric:build --stacktrace --no-daemon

      - name: Validate finished JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliver
          JAR="$(find project/fabric/build/libs -maxdepth 1 -type f -name 'artifacts-fabric-*.jar' ! -name '*-sources.jar' ! -name '*-dev-shadow.jar' -print -quit)"
          test -n "$JAR"

          jar tf "$JAR" > deliver/jar-list.txt
          grep -Fx 'artifacts/compat/hardcorerevival/HardcoreRevivalFinalDeathCompat.class' deliver/jar-list.txt
          grep -Fx 'artifacts/mixin/compat/hardcorerevival/HardcoreRevivalManagerMixin.class' deliver/jar-list.txt
          ! grep -Fxq 'data/hardcorerevival/tags/item/passthrough_death_when_held.json' deliver/jar-list.txt

          unzip -p "$JAR" assets/artifacts/lang/en_us.json > deliver/en_us.json
          grep -Fq 'artifacts.tooltip.chorus_totem_uses' deliver/en_us.json

          javap -classpath "$JAR" -p -c artifacts.component.ability.DeathProtectionTeleport > deliver/teleport-bytecode.txt
          javap -classpath "$JAR" -p -c artifacts.compat.hardcorerevival.HardcoreRevivalFinalDeathCompat > deliver/compat-bytecode.txt
          grep -Eq 'bipush +46' deliver/teleport-bytecode.txt
          grep -Fq 'net/minecraft/server/TickTask' deliver/teleport-bytecode.txt
          grep -Fq 'net/minecraft/server/TickTask' deliver/compat-bytecode.txt

          cp "$JAR" deliver/artifacts-fabric-13.2.1-chorus-totem-v8-respawn-effects-fix.jar
          sha256sum deliver/artifacts-fabric-13.2.1-chorus-totem-v8-respawn-effects-fix.jar > deliver/SHA256SUMS.txt
          unzip -t deliver/artifacts-fabric-13.2.1-chorus-totem-v8-respawn-effects-fix.jar >/dev/null
          echo success > deliver/STATUS.txt

      - name: Upload finished V8-based mod
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-v8-respawn-effects-fix-finished
          path: deliver/*
          if-no-files-found: error
