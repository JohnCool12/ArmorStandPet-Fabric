name: Build ArmorStandPet Forge 1.20.1

on:
  push:
    branches: [port/forge-1.20.1]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download exact source dependency
        uses: actions/download-artifact@v4
        with:
          name: migrated-src
          path: /tmp/migrated-artifact
          run-id: 30643325011
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconstruct exact independent-health Fabric source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/asp.tar.xz.b64.part-* | base64 --decode > /tmp/asp.tar.xz
          echo '3c3a2a9c821ef83ba5871678a59617b54800fb9c1926dcdb32de401881d45f8b  /tmp/asp.tar.xz' | sha256sum --check
          mkdir -p /tmp/asp-src
          tar -xJf /tmp/asp.tar.xz -C /tmp/asp-src
          cp -a /tmp/asp-src/armorstandpet-fabric ./project

          (cd /tmp/migrated-artifact && sha256sum --check migrated-src.tar.gz.sha256)
          rm -rf project/src
          tar -xzf /tmp/migrated-artifact/migrated-src.tar.gz -C project

          base64 --decode ci/asp-port.patch.xz.b64 > /tmp/asp-port.patch.xz
          xz --decompress --stdout /tmp/asp-port.patch.xz > /tmp/asp-port.patch
          (cd project && patch --batch --forward -p1 < /tmp/asp-port.patch)

          base64 --decode ci/asp-port-fix1.patch.xz.b64 > /tmp/asp-port-fix1.patch.xz
          xz --decompress --stdout /tmp/asp-port-fix1.patch.xz > /tmp/asp-port-fix1.patch
          (cd project && patch --batch --forward -p1 < /tmp/asp-port-fix1.patch)

          base64 --decode ci/asp-port-fix2.patch.xz.b64 > /tmp/asp-port-fix2.patch.xz
          xz --decompress --stdout /tmp/asp-port-fix2.patch.xz > /tmp/asp-port-fix2.patch
          (cd project && patch --batch --forward -p1 < /tmp/asp-port-fix2.patch)

          cp -a ci/overrides/. project/
          python3 ci/fix-client-level.py
          python3 ci/fix-command-args.py
          python3 ci/add-owner-attack-combat.py
          python3 ci/add-combat-toggle.py
          python3 ci/add-combat-preemption.py
          python3 ci/switch-right-arm-animation.py
          python3 ci/remove-combat-timeout.py
          python3 ci/add-pet-mortality.py
          python3 ci/add-player-equipment-combat.py
          python3 ci/port-to-1.21.1.py
          python3 ci/fix-1.21.1-world-event.py
          python3 ci/fix-1.21.1-api-batch.py

          grep -q 'public float health' project/src/main/java/io/github/kyzderp/armorstandpet/types/Pet.java
          grep -q 'data.health = 20.0F' project/src/main/java/io/github/kyzderp/armorstandpet/storage/PetStorage.java
          ! grep -q 'shadowRadius' project/src/client/java/io/github/kyzderp/armorstandpet/client/PetArmorStandRenderer.java

      - name: Apply Forge 1.20.1 port
        shell: bash
        run: |
          set -euo pipefail
          cat ci/forge-port-script.b64.part-* | base64 --decode > /tmp/port-to-forge-1.20.1.py
          echo 'a73ae11aaac1ce330e459516c4371e3d06694c2bbf039c663cf3615d6c6615c0  /tmp/port-to-forge-1.20.1.py' | sha256sum --check
          python3 /tmp/port-to-forge-1.20.1.py

      - name: Validate Forge source parity
        shell: bash
        run: |
          set -euo pipefail
          test -f project/src/main/resources/META-INF/mods.toml
          test ! -f project/src/main/resources/fabric.mod.json
          ! grep -R 'net.fabricmc' project/src
          ! grep -R 'shadowRadius' project/src/main/java/io/github/kyzderp/armorstandpet/client/PetArmorStandRenderer.java

          pet=project/src/main/java/io/github/kyzderp/armorstandpet/types/Pet.java
          storage=project/src/main/java/io/github/kyzderp/armorstandpet/storage/PetStorage.java
          mortality=project/src/main/java/io/github/kyzderp/armorstandpet/combat/PetMortalityController.java
          combat=project/src/main/java/io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.java
          events=project/src/main/java/io/github/kyzderp/armorstandpet/forge/ForgeEventHandlers.java

          grep -q 'public float health' "$pet"
          grep -q 'data.healthModelVersion = 1' "$pet"
          grep -q 'data.health = 20.0F' "$storage"
          grep -q 'pet.health - appliedDamage' "$mortality"
          grep -q 'ATTACK_COOLDOWN_TICKS = 20L' "$combat"
          grep -q 'ATTACK_ANIMATION_TICKS = 9L' "$combat"
          grep -q 'MOVEMENT_STEP_INTERVAL_TICKS = 3L' "$combat"
          grep -q 'onChangedDimension' "$events"
          grep -q 'onEntityInteract' "$events"
          grep -q 'onAttackEntity' "$events"
          grep -q 'onRegisterCommands' "$events"
          grep -q 'onServerTick' "$events"

      - name: Install Forge MDK wrapper
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/forge-mdk.zip \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip
          unzip -q /tmp/forge-mdk.zip -d /tmp/forge-mdk
          cp /tmp/forge-mdk/gradlew project/
          cp /tmp/forge-mdk/gradlew.bat project/
          rm -rf project/gradle
          cp -a /tmp/forge-mdk/gradle project/
          chmod +x project/gradlew

      - name: Build production Forge JAR
        working-directory: project
        run: ./gradlew clean build --stacktrace --no-daemon --console=plain

      - name: Smoke-test dedicated Forge server
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nserver-port=25581\n' > run/server.properties
          set +e
          (sleep 60; echo stop) | timeout 180s ./gradlew runServer --no-daemon --console=plain > ../forge-server-smoke.log 2>&1
          status=${PIPESTATUS[1]}
          set -e
          cat ../forge-server-smoke.log
          grep -q 'Done (' ../forge-server-smoke.log
          ! grep -q 'Failed to complete lifecycle event' ../forge-server-smoke.log
          ! grep -q 'Exception caught during firing event' ../forge-server-smoke.log
          ! grep -q 'Could not execute entrypoint' ../forge-server-smoke.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

      - name: Validate and collect Forge JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp forge-server-smoke.log artifact/
          jar="$(find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          test -n "$jar"
          cp "$jar" artifact/armorstandpet-forge-1.20.1-independent-20-health.jar
          unzip -t artifact/armorstandpet-forge-1.20.1-independent-20-health.jar
          unzip -p artifact/armorstandpet-forge-1.20.1-independent-20-health.jar META-INF/mods.toml | grep -q 'modId="armorstandpet"'
          jar tf artifact/armorstandpet-forge-1.20.1-independent-20-health.jar | grep -qx 'io/github/kyzderp/armorstandpet/ASPetMod.class'
          jar tf artifact/armorstandpet-forge-1.20.1-independent-20-health.jar | grep -qx 'io/github/kyzderp/armorstandpet/entity/PetArmorStandEntity.class'
          jar tf artifact/armorstandpet-forge-1.20.1-independent-20-health.jar | grep -qx 'io/github/kyzderp/armorstandpet/combat/PetMortalityController.class'
          jar tf artifact/armorstandpet-forge-1.20.1-independent-20-health.jar | grep -qx 'io/github/kyzderp/armorstandpet/gui/ChooseTypeScreenHandler.class'

          javap -classpath artifact/armorstandpet-forge-1.20.1-independent-20-health.jar -p -c \
            io.github.kyzderp.armorstandpet.types.Pet | tee artifact/Pet.javap.txt
          grep -q 'float health' artifact/Pet.javap.txt
          grep -q 'PetData.healthModelVersion' artifact/Pet.javap.txt

          javap -classpath artifact/armorstandpet-forge-1.20.1-independent-20-health.jar -p -c \
            io.github.kyzderp.armorstandpet.combat.PetMortalityController | tee artifact/PetMortalityController.javap.txt
          grep -q 'Pet.health' artifact/PetMortalityController.javap.txt

          javap -classpath artifact/armorstandpet-forge-1.20.1-independent-20-health.jar -p -c \
            io.github.kyzderp.armorstandpet.client.PetArmorStandRenderer | tee artifact/PetArmorStandRenderer.javap.txt
          ! grep -q 'shadowRadius' artifact/PetArmorStandRenderer.javap.txt

          sha256sum artifact/armorstandpet-forge-1.20.1-independent-20-health.jar | tee artifact/SHA256SUMS.txt
          find project/src -type f | sort > artifact/source-files.txt

      - name: Upload Forge 1.20.1 mod
        uses: actions/upload-artifact@v4
        with:
          name: armorstandpet-forge-1.20.1-independent-20-health
          path: artifact/
          if-no-files-found: error
