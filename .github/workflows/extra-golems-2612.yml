name: Extra Golems NeoForge 26.1.2 Port
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Restore upstream source and overlays
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/bigenergy/extra-golems-reborn.git project
          cp ci/extra-golems-2612/build.gradle project/build.gradle
          cp ci/extra-golems-2612/gradle.properties project/gradle.properties
          cp ci/extra-golems-2612/settings.gradle project/settings.gradle
          if [ -d ci/extra-golems-2612/overlay ]; then cp -a ci/extra-golems-2612/overlay/. project/; fi
      - name: Compile
        working-directory: project
        run: gradle clean build --stacktrace --no-daemon
      - name: Collect JAR
        if: success()
        shell: bash
        run: |
          mkdir -p artifact
          find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' -exec cp {} artifact/ \;
          ls -lah artifact
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: extra-golems-neoforge-26.1.2
          path: artifact/*.jar
          if-no-files-found: error
