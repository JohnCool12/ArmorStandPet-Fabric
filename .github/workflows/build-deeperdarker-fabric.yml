name: Build Deeper and Darker Fabric Port

on:
  push:
    branches:
      - chatgpt-deeperdarker-build-20260805
    paths:
      - 'dd-build-trigger/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout build payload
        uses: actions/checkout@v4
        with:
          path: payload

      - name: Checkout official 1.4.1 resources
        uses: actions/checkout@v4
        with:
          repository: KyaniteMods/DeeperAndDarker
          ref: v1.4.1
          path: upstream

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Reconstruct Fabric workspace
        shell: bash
        run: |
          set -euxo pipefail
          cp -a upstream work
          rm -rf work/.git work/src/main/java work/src/datagen
          rm -rf work/src/main/resources/META-INF
          rm -rf work/src/main/resources/data/neoforge work/src/main/resources/data/forge
          rm -rf work/src/generated/resources/data/neoforge work/src/generated/resources/data/forge
          for root in work/src/main/resources work/src/generated/resources; do
            if [ -d "$root" ]; then
              find "$root" -type f \( -iname '*neoforge*' -o -iname '*forge*' \) -delete
              find "$root" -path '*loot_modifiers*' -delete
            fi
          done
          cat \
            payload/dd-build-payload-v2/chunk-00.b64 \
            payload/dd-build-payload-v2/chunk-01.b64 \
            payload/dd-build-payload-v2/chunk-02.b64 \
            payload/dd-build-payload-v2/chunk-03.b64 \
            payload/dd-build-payload-v2/chunk-04.b64 \
            payload/dd-build-payload-v2/chunk-05.b64 \
            payload/dd-build-payload-v2/chunk-06.b64 \
            payload/dd-build-payload-v2/chunk-07.b64 \
            payload/dd-build-payload-v2/chunk-08.b64 \
            payload/dd-build-payload-v2/chunk-09.b64 \
            payload/dd-build-payload-v2/chunk-10.b64 \
            payload/dd-build-payload-v2/chunk-11.b64 \
            | tr -d '\n' | base64 -d > fabric-source.tar.xz
          echo "40ab0a531c4bb4123966840b468c3a0a54ae9d1f619e6f1080003c03c2eef518  fabric-source.tar.xz" | sha256sum -c -
          tar -xJf fabric-source.tar.xz -C work
          base64 -d < payload/dd-build-support/fabric_conditions.json.xz.b64 | xz -d > fabric_conditions.json
          python3 payload/dd-build-support/apply_conditions.py work fabric_conditions.json
          if [ -d payload/dd-build-patches ]; then
            cp -a payload/dd-build-patches/. work/
          fi
          cat payload/dd-build-patch-v2/chunk-00.b64 payload/dd-build-patch-v2/chunk-01.b64 payload/dd-build-patch-v2/chunk-02.b64 | base64 -d > compiler-patches-v2.tar.xz
          echo "dc8a3f7b360950cd92722d4f7e9e7356f43b85fbd905972bc46179247ddada76  compiler-patches-v2.tar.xz" | sha256sum -c -
          tar -xJf compiler-patches-v2.tar.xz -C work
          if [ -d payload/dd-build-patches-final ]; then
            cp -a payload/dd-build-patches-final/. work/
          fi
          base64 -d < payload/dd-build-final-fixes/chunk-00.b64 > final-fixes.tar.xz
          echo "efa6e25e4bd13d7326fd3603f4db3eb6caf578faf4ca4abc6d81ec4869fa1067  final-fixes.tar.xz" | sha256sum -c -
          tar -xJf final-fixes.tar.xz -C work
          # Reapply direct hotfix files after archived compiler fixes.
          if [ -d payload/dd-build-patches-final ]; then
            cp -a payload/dd-build-patches-final/. work/
          fi
          chmod +x work/gradlew
          python3 - <<'PY'
          import json, pathlib
          roots=[pathlib.Path('work/src/main/resources'), pathlib.Path('work/src/generated/resources')]
          leftovers=[]
          count=0
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*.json'):
                  data=json.loads(path.read_text(encoding='utf-8'))
                  count += 1
                  if isinstance(data, dict) and ('neoforge:conditions' in data or 'forge:conditions' in data):
                      leftovers.append(str(path))
          print(f'Validated {count} JSON resources')
          if leftovers:
              raise SystemExit('Unconverted loader conditions remain: ' + ', '.join(leftovers[:10]))
          PY

      - name: Build
        working-directory: work
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean build --stacktrace --no-daemon 2>&1 | tee build-output.log

      - name: Render every mod item
        working-directory: work
        shell: bash
        env:
          DEEPERDARKER_ITEM_RENDER_SMOKE_TEST: 'true'
        run: |
          set -euxo pipefail
          rm -rf run/crash-reports run/logs
          timeout 180s xvfb-run -a ./gradlew runClient --stacktrace --no-daemon 2>&1 | tee client-item-render-smoke.log
          grep -q 'DEEPERDARKER_ITEM_RENDER_SMOKE_TEST_PASSED' client-item-render-smoke.log
          ! grep -q 'DEEPERDARKER_ITEM_RENDER_SMOKE_TEST_FAILED' client-item-render-smoke.log
          ! grep -q 'Missing textures in model deeperdarker' client-item-render-smoke.log
          test ! -d run/crash-reports || test -z "$(find run/crash-reports -type f -print -quit)"

      - name: Dedicated server startup smoke test
        working-directory: work
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nserver-port=25576\n' > run/server.properties
          rm -rf run/crash-reports run/logs
          set +e
          timeout 120s ./gradlew runServer --stacktrace --no-daemon 2>&1 | tee server-smoke.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          grep -Eq 'Done \([0-9.]+s\)!|For help, type "help"' server-smoke.log
          test ! -d run/crash-reports || test -z "$(find run/crash-reports -type f -print -quit)"

      - name: Upload JARs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deeperdarker-fabric-build
          path: |
            work/build/libs/*.jar
            work/build/reports/**
            work/build-output.log
            work/client-item-render-smoke.log
            work/server-smoke.log
            work/run/logs/**
            work/run/crash-reports/**
          if-no-files-found: warn
