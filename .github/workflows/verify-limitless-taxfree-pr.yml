name: Verify Limitless Tax Free Compat PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download previously verified true-unlimited Limitless JAR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p base artifact verify
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/JohnCool12/ArmorStandPet-Fabric/actions/artifacts/9311012324/zip \
            -o /tmp/base-artifact.zip
          unzip -q /tmp/base-artifact.zip -d base
          BASE=$(find base -type f -name '*.jar' -print -quit)
          test -n "$BASE"
          echo '62a66a39426fb410783d00870fcc97262a2ce3a2ca7083974e21648a4bd16682  '"$BASE" | sha256sum -c -
          cp "$BASE" artifact/limitless-fabric-2.0.0-1.21.1-true-unlimited-taxfreelevels-compat.jar

      - name: Add Tax Free Levels compatibility metadata
        shell: bash
        run: |
          set -euo pipefail
          JAR=artifact/limitless-fabric-2.0.0-1.21.1-true-unlimited-taxfreelevels-compat.jar
          mkdir -p /tmp/jarpatch
          unzip -p "$JAR" fabric.mod.json > /tmp/jarpatch/fabric.mod.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/jarpatch/fabric.mod.json')
          d=json.loads(p.read_text())
          d.setdefault('custom', {}).setdefault('taxfreelevels:options', {})['mixin.RemoveAnvilLimitMixin']=False
          p.write_text(json.dumps(d, indent=2)+'\n')
          PY
          (cd /tmp/jarpatch && zip -q -u "$GITHUB_WORKSPACE/$JAR" fabric.mod.json)

          unzip -t "$JAR" > verify/unzip-test.txt
          unzip -p "$JAR" fabric.mod.json > verify/fabric.mod.json
          jar tf "$JAR" > verify/jar-list.txt
          javap -classpath "$JAR" -p -c limitless.enchantments.mixin.AnvilMenuMixin > verify/AnvilMenuMixin.javap.txt
          python3 - <<'PY'
          import json
          d=json.load(open('verify/fabric.mod.json'))
          assert d['id']=='limitlessenchantments'
          assert d['version']=='2.0.0'
          assert d['depends']['minecraft']=='1.21.1'
          assert d['custom']['taxfreelevels:options']['mixin.RemoveAnvilLimitMixin'] is False
          PY
          grep -Fq 'limitless$disableTooExpensiveRefusal' verify/AnvilMenuMixin.javap.txt
          grep -Fqx 'semantic/ver/lib/SemanticVersion.class' verify/jar-list.txt
          sha256sum "$JAR" | tee verify/sha256.txt

      - name: Prepare standalone Fabric 1.21.1 server with both mods
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server/mods
          cp artifact/limitless-fabric-2.0.0-1.21.1-true-unlimited-taxfreelevels-compat.jar server/mods/

          TFL_URL=$(curl -fsSL https://api.modrinth.com/v2/version/qmqEy4IO | jq -r '.files[] | select(.primary==true) | .url')
          CLOTH_URL=$(curl -fsSL https://api.modrinth.com/v2/version/HpMb5wGb | jq -r '.files[] | select(.primary==true) | .url')
          test -n "$TFL_URL" && test "$TFL_URL" != null
          test -n "$CLOTH_URL" && test "$CLOTH_URL" != null
          curl -fL "$TFL_URL" -o server/mods/tax-free-levels-1.4.24.jar
          curl -fL "$CLOTH_URL" -o server/mods/cloth-config-15.0.140.jar
          curl -fL 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.116.14+1.21.1/fabric-api-0.116.14+1.21.1.jar' -o server/mods/fabric-api.jar
          curl -fL 'https://maven.architectury.dev/dev/architectury/architectury-fabric/13.0.8/architectury-fabric-13.0.8.jar' -o server/mods/architectury.jar

          INSTALLER=$(curl -fsSL https://meta.fabricmc.net/v2/versions/installer | jq -r '.[0].version')
          test -n "$INSTALLER" && test "$INSTALLER" != null
          curl -fL "https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.19.3/$INSTALLER/server/jar" -o server/fabric-server.jar
          echo 'eula=true' > server/eula.txt

      - name: Start server and check both-mod Mixin compatibility
        shell: bash
        run: |
          set +e
          cd server
          timeout 90s java -Xms512M -Xmx2G -jar fabric-server.jar nogui > ../verify/runserver.log 2>&1
          CODE=$?
          cd ..
          set -e
          tail -220 verify/runserver.log

          grep -Eiq 'taxfreelevels|Tax Free Levels' verify/runserver.log
          grep -Eiq 'limitlessenchantments|Limitless Enchantments' verify/runserver.log
          grep -Eiq 'Done \(' verify/runserver.log

          if grep -Eiq 'Critical injection failure|InjectionError|InvalidMixinException|Mixin apply failed|MixinApplyError|RemoveAnvilLimitMixin.*failed|AnvilMenuMixin.*failed' verify/runserver.log; then
            echo 'Found a fatal Mixin compatibility error.' >&2
            exit 1
          fi
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 124 ]; then
            echo "Server exited unexpectedly with code $CODE" >&2
            exit "$CODE"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: limitless-taxfreelevels-compatible-jar
          path: artifact/*.jar
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: limitless-taxfreelevels-compat-verification
          path: verify/
          if-no-files-found: warn
