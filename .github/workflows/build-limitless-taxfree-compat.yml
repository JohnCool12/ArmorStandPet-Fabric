name: Build Limitless Tax Free Levels Compat

on:
  push:
    branches: [ci/limitless-taxfree-compat-20260817]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build host
        uses: actions/checkout@v4

      - name: Reconstruct and verify custom patches
        shell: bash
        run: |
          set -euo pipefail
          cat ci/limitless-true-unlimited.part-00.b64 ci/limitless-true-unlimited.part-01.b64 ci/limitless-true-unlimited.part-02.b64 \
            | base64 -d | gzip -dc > /tmp/limitless-base.patch
          echo '64d10efb1dd000f109e4eb63aa72f8ecd069a19f4e5bd7df389e2098877f54a3  /tmp/limitless-base.patch' | sha256sum -c -
          base64 -d ci/limitless-taxfree-compat-incremental.b64 > /tmp/taxfree-compat.patch
          echo 'c1e141ac60b2cc9b75120d26ca5733eb47312f94d5872c6095947fe86c6c41f8  /tmp/taxfree-compat.patch' | sha256sum -c -

      - name: Check out exact Limitless Enchantments 1.21.1 source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/ThomasDarkson/limitlessenchantments.git project
          cd project
          git checkout d372fac9103613fefdbffb0fcd70f99223f9726f
          chmod +x gradlew
          git apply --check /tmp/limitless-base.patch
          git apply /tmp/limitless-base.patch
          git apply --check /tmp/taxfree-compat.patch
          git apply /tmp/taxfree-compat.patch

          python3 - <<'PY'
          import json
          p='fabric/src/main/resources/fabric.mod.json'
          data=json.load(open(p, encoding='utf-8'))
          opts=data['custom']['taxfreelevels:options']
          assert opts['mixin.RemoveAnvilLimitMixin'] is False, opts
          PY

      - name: Add exact Tax Free Levels 1.4.24 runtime
        shell: bash
        working-directory: project
        run: |
          cat >> fabric/build.gradle <<'GRADLE'

          repositories {
              maven { url = 'https://api.modrinth.com/maven' }
          }

          dependencies {
              // Tax Free Levels 1.4.24 Fabric, MC 1.21-1.21.1 (Modrinth version qmqEy4IO)
              modRuntimeOnly 'maven.modrinth:jCBrrLTs:qmqEy4IO'
              // Cloth Config 15.0.140 Fabric, MC 1.21-1.21.1
              modRuntimeOnly 'maven.modrinth:9s6osm5g:HpMb5wGb'
          }
          GRADLE

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build remapped Fabric JAR
        shell: bash
        working-directory: project
        run: |
          set -o pipefail
          ./gradlew :fabric:remapJar --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify finished JAR and compatibility metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact verify
          cp build.log verify/build.log
          JAR=$(find project/fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-shadow.jar' ! -name '*-dev-shadow.jar' -print -quit)
          test -n "$JAR"
          cp "$JAR" artifact/limitless-fabric-2.0.0-1.21.1-true-unlimited-taxfreelevels-compat.jar
          JAR=artifact/limitless-fabric-2.0.0-1.21.1-true-unlimited-taxfreelevels-compat.jar

          unzip -t "$JAR" | tee verify/unzip-test.txt
          jar tf "$JAR" > verify/jar-list.txt
          unzip -p "$JAR" fabric.mod.json > verify/fabric.mod.json
          javap -classpath "$JAR" -p -c limitless.enchantments.mixin.AnvilMenuMixin > verify/AnvilMenuMixin.javap.txt
          javap -classpath "$JAR" -p -c limitless.enchantments.LimitlessCommand > verify/LimitlessCommand.javap.txt

          python3 - <<'PY'
          import json
          data=json.load(open('verify/fabric.mod.json', encoding='utf-8'))
          assert data['id']=='limitlessenchantments', data
          assert data['version']=='2.0.0', data
          assert data['depends']['minecraft']=='1.21.1', data
          assert data['custom']['taxfreelevels:options']['mixin.RemoveAnvilLimitMixin'] is False, data
          PY

          grep -Fq 'limitless$disableTooExpensiveRefusal' verify/AnvilMenuMixin.javap.txt
          grep -Fq 'priorpenalty' verify/LimitlessCommand.javap.txt
          grep -Fq 'maxanvilcost' verify/LimitlessCommand.javap.txt
          grep -Fqx 'semantic/ver/lib/SemanticVersion.class' verify/jar-list.txt
          grep -Fq 'limitless/enchantments/mixin/MobMixin.class' verify/jar-list.txt
          sha256sum "$JAR" | tee verify/sha256.txt

      - name: Runtime smoke test with Tax Free Levels 1.4.24
        shell: bash
        run: |
          set +e
          mkdir -p project/fabric/run
          echo 'eula=true' > project/fabric/run/eula.txt
          timeout 70s bash -lc 'cd project && ./gradlew :fabric:runServer --no-daemon' > verify/runserver-taxfree.log 2>&1
          CODE=$?
          set -e
          tail -180 verify/runserver-taxfree.log

          # Confirm both mods actually participated in the runtime.
          grep -Eiq 'tax.?free.?levels|taxfreelevels' verify/runserver-taxfree.log
          grep -Eiq 'limitless.?enchantments|limitlessenchantments' verify/runserver-taxfree.log

          # Reject the specific class of Mixin collisions this compatibility metadata prevents.
          if grep -Eiq 'Critical injection failure|InjectionError|InvalidMixinException|Mixin apply failed|MixinApplyError|NoSuchMethodError|RemoveAnvilLimitMixin.*failed|AnvilMenuMixin.*failed' verify/runserver-taxfree.log; then
            echo 'Runtime mixin compatibility smoke test found a fatal mixin error.' >&2
            exit 1
          fi

          # Timeout is acceptable after healthy server startup; any other immediate failure is not.
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 124 ]; then
            echo "runServer exited unexpectedly with code $CODE" >&2
            exit "$CODE"
          fi

      - name: Upload finished Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: limitless-taxfreelevels-compatible-jar
          path: artifact/*.jar
          if-no-files-found: error

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: limitless-taxfreelevels-compat-verification
          path: verify/
          if-no-files-found: warn
