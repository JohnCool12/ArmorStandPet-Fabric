name: Build Extra Golem Vanilla Target Acquisition
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Reconstruct cumulative production source and replace target acquisition
        shell: bash
        run: |
          set -euo pipefail
          cat ci/egpatch.part-* | base64 --decode > /tmp/fabric-port.patch.xz
          echo '8b5eb02294d41d7ef3af71ce280dcded9920b2ae097f73043cf60c751f94c7ba  /tmp/fabric-port.patch.xz' | sha256sum --check
          git clone -q https://github.com/bigenergy/extra-golems-reborn.git project
          cd project
          git checkout -q 6b21ec4a59ca16e8362b26e38fc63b2807042bdf
          xz -dc /tmp/fabric-port.patch.xz | patch -p4 --batch --forward >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix1.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix2.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-bedrock-targetable.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix4.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-advanced-swim.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-surface-swim.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-bedrock-provocation.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-all-eyes-neutral.patch >/dev/null
          cp ../ci/GolemFinalEyesLayer.java src/main/java/com/mcmoddev/golems/client/entity/layer/GolemFinalEyesLayer.java
          cd ..
          for s in \
            apply-strict-neutral.py \
            apply-legacy-neutral-migration.py \
            apply-hybrid-village-neutral.py \
            apply-bedrock-natural-hostility.py \
            apply-stable-village-targeting.py \
            apply-bedrock-true-vanilla-natural-ai.py \
            apply-all-constructed-natural-ai.py \
            apply-village-runtime-parity-fix.py \
            apply-individual-player-target-provenance.py \
            apply-minimum-iron-golem-speed.py \
            apply-sculk-catalyst-player-blindness-exemption.py \
            refine-sculk-catalyst-player-blindness-predicate.py \
            apply-village-golem-pretracking-initialization.py \
            apply-village-golem-failed-replacement-fallback.py \
            apply-village-golem-spawn-helper.py \
            apply-provoked-target-interruption-recovery.py; do
              python3 ci/$s >/dev/null
          done
          python3 ci/fix-provoked-recovery-compile.py >/dev/null
          python3 ci/apply-no-silent-aggravation-invariant.py >/dev/null
          python3 ci/apply-golem-mob-difficulty-scaling.py >/dev/null
          python3 ci/apply-extra-golem-explosion-knockback-parity.py >/dev/null
          python3 ci/apply-creative-provocation-hard-reset.py >/dev/null
          python3 ci/apply-vanilla-iron-golem-target-acquisition-parity.py

          python3 - <<'PY'
          from pathlib import Path
          s=Path('project/src/main/java/com/mcmoddev/golems/entity/GolemBase.java').read_text()

          def method(sig):
              i=s.index(sig); b=s.index('{',i); d=0
              for j in range(b,len(s)):
                  d += (s[j]=='{') - (s[j]=='}')
                  if d==0: return s[i:j+1]
              raise RuntimeError(sig)

          rg=method('\t@Override\n\tprotected void registerGoals() {')
          assert rg.count('super.registerGoals();') == 1
          assert 'targetSelector.addGoal' not in rg

          st=method('\t@Override\n\tpublic void setTarget(@Nullable LivingEntity pTarget) {')
          assert st.strip().endswith('super.setTarget(pTarget);\n\t}')
          for forbidden in ('isAngryAt(', 'hasVanillaVillageReputationReason', 'interruptedDirectPlayerProvoker', 'isCreative()', 'isSpectator()'):
              assert forbidden not in st, forbidden

          ca=method('\t@Override\n\tpublic boolean canAttackType(final EntityType<?> type) {')
          assert 'return super.canAttackType(type);' in ca
          assert 'EGRegistry' not in ca and 'enableFriendlyFire' not in ca

          tick=method('\t@Override\n\tpublic void tick() {')
          assert 'hardResetInvalidPlayerProvocationBeforeAiTick' not in tick

          cs=method('\t@Override\n\tprotected void customServerAiStep() {')
          for forbidden in ('recoverInterruptedDirectPlayerProvocation', 'sanitizeSilentAggravationState',
                            'maintainConstructedNeutralRetaliation', 'migrateLegacyPlayerCreatedConstructedGolem',
                            'migrateBedrockNaturalHostilityState'):
              assert forbidden not in cs, forbidden

          cfg=method('\tprivate void configureBedrockNaturalIronGolemTargeting() {')
          exact=(
              'this.targetSelector.addGoal(1, new DefendVillageTargetGoal(this));',
              'this.targetSelector.addGoal(2, new HurtByTargetGoal(this));',
              'new NearestAttackableTargetGoal<>(this, Player.class, 10, true, false, this::isAngryAt)',
              'new NearestAttackableTargetGoal<>(this, Mob.class, 5, false, false,',
              'entity instanceof Enemy && !(entity instanceof Creeper)',
              'this.targetSelector.addGoal(4, new ResetUniversalAngerTargetGoal<>(this, false));')
          for x in exact: assert x in cfg, x

          # No material behavior is allowed to create an alternate target selector.
          for f in Path('project/src/main/java/com/mcmoddev/golems/data/behavior').rglob('*.java'):
              txt=f.read_text()
              assert 'targetSelector' not in txt, f'Behavior modifies targetSelector: {f}'

          # Goal reinitialization must not accumulate old/duplicate target goals.
          assert 'this.targetSelector.removeAllGoals(goal -> true);\n\t\t\tthis.registerGoals();' in s
          # Cumulative non-target features remain.
          assert 'Attributes.EXPLOSION_KNOCKBACK_RESISTANCE, 0.0D' in s
          assert Path('project/src/main/java/com/mcmoddev/golems/mixin/IronGolemDamageDifficultyMixin.java').exists()
          print('PASS: Extra Golem target admission/selection delegates to vanilla IronGolem; no custom live recovery remains.')
          PY

      - name: Build production JAR
        working-directory: project
        run: gradle clean build --stacktrace --no-daemon

      - name: Verify compiled vanilla target delegation and cumulative features
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          javap -classpath build/classes/java/main -p -c com.mcmoddev.golems.entity.GolemBase > ../golembase-vanilla-target.txt
          grep -q 'EXPLOSION_KNOCKBACK_RESISTANCE' ../golembase-vanilla-target.txt
          test -f build/classes/java/main/com/mcmoddev/golems/mixin/IronGolemDamageDifficultyMixin.class
          unzip -t build/libs/Extra-Golems-Reborn-Fabric-1.21.1-21.1.0.1-fabric.jar

      - name: Dedicated server smoke test
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          set +e
          timeout --signal=TERM 90s gradle runServer --no-daemon > ../server-vanilla-target.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            cat ../server-vanilla-target.log
            exit "$status"
          fi
          grep -q 'Done (' run/server/logs/latest.log
          ! grep -Eqi 'Mixin apply failed|InjectionError|InvalidInjectionException|MixinTransformerError' run/server/logs/latest.log

      - name: Client resource/render smoke test
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          setsid env ALSOFT_DRIVERS=null LIBGL_ALWAYS_SOFTWARE=true xvfb-run -a gradle runClient --no-daemon > ../client-vanilla-target.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 90); do
            if [ -f run/client/logs/latest.log ] && grep -q 'minecraft:textures/atlas/blocks.png-atlas' run/client/logs/latest.log; then
              sleep 8
              kill -0 "$pid" 2>/dev/null && ok=1
              break
            fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill -TERM -- -"$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          test "$ok" -eq 1
          ! grep -Eqi 'Mixin apply failed|InjectionError|InvalidInjectionException|MixinTransformerError' run/client/logs/latest.log

      - name: Collect artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp project/build/libs/Extra-Golems-Reborn-Fabric-1.21.1-21.1.0.1-fabric.jar artifact/
          unzip -t artifact/Extra-Golems-Reborn-Fabric-1.21.1-21.1.0.1-fabric.jar
          sha256sum artifact/Extra-Golems-Reborn-Fabric-1.21.1-21.1.0.1-fabric.jar

      - uses: actions/upload-artifact@v4
        with:
          name: extra-golems-vanilla-target-acquisition
          path: artifact/*.jar
          if-no-files-found: error
