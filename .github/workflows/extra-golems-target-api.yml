name: Extra Golems 26.1.2 Target API Dump

on:
  push:
    branches: [chatgpt-extra-golems-26.1.2-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Prepare target artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target-mdk
          git clone --depth 1 https://github.com/NeoForgeMDKs/MDK-26.1.2-ModDevGradle.git target-mdk
          sed -i 's/neo_version=26.1.2.97/neo_version=26.1.2.95/' target-mdk/gradle.properties
          cd target-mdk
          gradle createMinecraftArtifacts --no-daemon --console=plain
          cd ..
          bash ci/dump_extra_golems_target_api.sh
      - uses: actions/upload-artifact@v4
        with:
          name: extra-golems-26.1.2-target-api
          path: target-api.txt
          if-no-files-found: error
