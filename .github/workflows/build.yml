name: Build Fabric Mod

on:
  push:
    branches: [ci/build-jar]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Download migrated sources
        uses: actions/download-artifact@v4
        with:
          name: migrated-src
          path: /tmp/migrated-artifact
          run-id: 30643325011
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore project and migrated source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/asp.tar.xz.b64.part-* | base64 --decode > /tmp/asp.tar.xz
          echo '3c3a2a9c821ef83ba5871678a59617b54800fb9c1926dcdb32de401881d45f8b  /tmp/asp.tar.xz' | sha256sum --check
          mkdir -p /tmp/asp-src
          tar -xJf /tmp/asp.tar.xz -C /tmp/asp-src
          cp -a /tmp/asp-src/armorstandpet-fabric ./project
          (cd /tmp/migrated-artifact && sha256sum --check migrated-src.tar.gz.sha256)
          rm -rf project/src
          tar -xzf /tmp/migrated-artifact/migrated-src.tar.gz -C project
          cp -a ci/overrides/. project/
          test -f project/build.gradle

      - name: Build
        working-directory: project
        run: gradle build --stacktrace --no-daemon --console=plain

      - name: Collect production JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} artifact/ \;
          test -n "$(find artifact -maxdepth 1 -type f -name '*.jar' -print -quit)"
          sha256sum artifact/*.jar
          ls -lah artifact

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: armorstandpet-fabric-26.2
          path: artifact/*.jar
          if-no-files-found: error
