name: Build Fabric Mod

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Restore source project
        shell: bash
        run: |
          set -euo pipefail
          cat ci/asp.tar.xz.b64.part-* | base64 --decode > /tmp/asp.tar.xz
          echo '3c3a2a9c821ef83ba5871678a59617b54800fb9c1926dcdb32de401881d45f8b  /tmp/asp.tar.xz' | sha256sum --check
          mkdir -p /tmp/asp-src
          tar -xJf /tmp/asp.tar.xz -C /tmp/asp-src
          cp -a /tmp/asp-src/armorstandpet-fabric ./project
          if [ -d ci/overrides ]; then
            cp -a ci/overrides/. project/
          fi
          test -f project/build.gradle

      - name: Build
        working-directory: project
        run: gradle build --stacktrace --no-daemon

      - name: Collect production JAR
        shell: bash
        run: |
          mkdir -p artifact
          find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} artifact/ \;
          test -n "$(find artifact -maxdepth 1 -type f -name '*.jar' -print -quit)"
          ls -lah artifact

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: armorstandpet-fabric-26.2
          path: artifact/*.jar
          if-no-files-found: error
