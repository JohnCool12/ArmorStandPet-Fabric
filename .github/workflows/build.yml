name: Build Artifacts Kitty Hard Target Helper

on:
  push:
    branches:
      - ci/artifacts-kitty-hard-target-20260825
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CI files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check out exact Artifacts 13.2.1 source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/ochotonida/artifacts.git project
          cd project
          git checkout c9c3a3debb1054eb5535600e44dc0834201f0943
          grep -Fx 'minecraft_version=1.21.1' gradle.properties
          grep -Fx 'mod_version=13.2.1' gradle.properties

      - name: Apply V8 compatibility and Kitty Slippers hard-target patch
        shell: bash
        run: |
          set -euo pipefail
          cd project
          python "$GITHUB_WORKSPACE/ci/artifacts-v8-minimal-patch.py"
          python "$GITHUB_WORKSPACE/ci/artifacts-kitty-hard-target-patch.py"
          grep -F 'ability.kittyslippers.MobTargetMixin' common/src/main/resources/mixins.artifacts.common.json
          grep -F '@ModifyVariable(method = "setTarget"' common/src/main/java/artifacts/mixin/ability/kittyslippers/MobTargetMixin.java
          grep -F '@Inject(method = "tick"' common/src/main/java/artifacts/mixin/ability/kittyslippers/MobTargetMixin.java
          grep -F 'ModTags.CREEPERS' common/src/main/java/artifacts/mixin/ability/kittyslippers/MobTargetMixin.java
          grep -F 'mob instanceof Phantom' common/src/main/java/artifacts/mixin/ability/kittyslippers/MobTargetMixin.java
          python -m json.tool common/src/main/resources/mixins.artifacts.common.json >/dev/null
          git diff --check

      - name: Build Fabric 1.21.1
        shell: bash
        run: |
          set -o pipefail
          cd project
          chmod +x gradlew
          ./gradlew :fabric:build --stacktrace --no-daemon

      - name: Validate helper JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find project/fabric/build/libs -maxdepth 1 -type f -name 'artifacts-fabric-*.jar' ! -name '*-sources.jar' ! -name '*-dev-shadow.jar' -print -quit)"
          test -n "$JAR"
          jar tf "$JAR" > /tmp/jar-list.txt
          grep -Fx 'artifacts/mixin/ability/kittyslippers/MobTargetMixin.class' /tmp/jar-list.txt
          unzip -p "$JAR" mixins.artifacts.common.json > /tmp/mixins.json
          grep -F 'ability.kittyslippers.MobTargetMixin' /tmp/mixins.json
          javap -classpath "$JAR" -c -p artifacts.mixin.ability.kittyslippers.MobTargetMixin > /tmp/kitty-javap.txt
          grep -F 'artifacts$rejectKittySlippersTarget' /tmp/kitty-javap.txt
          grep -F 'artifacts$clearRetainedKittySlippersTarget' /tmp/kitty-javap.txt
          mkdir -p out
          cp "$JAR" out/artifacts-kitty-hard-target-helper.jar
          sha256sum out/artifacts-kitty-hard-target-helper.jar > out/SHA256SUMS.txt

      - name: Upload helper build
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-kitty-hard-target-helper
          path: out/*
          if-no-files-found: error
