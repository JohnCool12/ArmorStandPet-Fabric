name: Build Artifacts Real Death Helper

on:
  push:
    branches:
      - ci/artifacts-finaldeath-20260813
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CI files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check out exact Artifacts 13.2.1 source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/ochotonida/artifacts.git project
          cd project
          git checkout c9c3a3debb1054eb5535600e44dc0834201f0943
          test "$(git rev-parse HEAD)" = "c9c3a3debb1054eb5535600e44dc0834201f0943"
          grep -Fx 'minecraft_version=1.21.1' gradle.properties
          grep -Fx 'mod_version=13.2.1' gradle.properties

      - name: Apply real-death compatibility helper
        shell: bash
        run: |
          set -euo pipefail
          cd project
          python "$GITHUB_WORKSPACE/ci/artifacts-real-death-helper.py"
          grep -F 'findRespawnPositionAndUseSpawnBlock(true, DimensionTransition.DO_NOTHING)' common/src/main/java/artifacts/compat/hardcorerevival/HardcoreRevivalFinalDeathCompat.java
          grep -F 'equippedTotem.setCount(0)' common/src/main/java/artifacts/compat/hardcorerevival/HardcoreRevivalFinalDeathCompat.java
          grep -F 'EquipmentSlotManager.tryEquipAccessory' common/src/main/java/artifacts/compat/hardcorerevival/HardcoreRevivalFinalDeathCompat.java
          grep -F 'compat.hardcorerevival.PlayerListRespawnMixin' common/src/main/resources/mixins.artifacts.common.json
          git diff --check

      - name: Build Fabric 1.21.1 helper
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew :fabric:build --stacktrace --no-daemon

      - name: Validate and collect helper JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          JAR="$(find project/fabric/build/libs -maxdepth 1 -type f -name 'artifacts-fabric-*.jar' ! -name '*-sources.jar' ! -name '*-dev-shadow.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" artifact/artifacts-real-death-helper.jar
          jar tf artifact/artifacts-real-death-helper.jar | grep -q 'artifacts/compat/hardcorerevival/HardcoreRevivalFinalDeathCompat.class'
          jar tf artifact/artifacts-real-death-helper.jar | grep -q 'artifacts/mixin/compat/hardcorerevival/HardcoreRevivalManagerMixin.class'
          jar tf artifact/artifacts-real-death-helper.jar | grep -q 'artifacts/mixin/compat/hardcorerevival/PlayerListRespawnMixin.class'
          unzip -p artifact/artifacts-real-death-helper.jar artifacts/compat/hardcorerevival/HardcoreRevivalFinalDeathCompat.class | strings | grep -q 'PENDING_RESPAWN'
          unzip -p artifact/artifacts-real-death-helper.jar artifacts/mixin/compat/hardcorerevival/HardcoreRevivalManagerMixin.class | strings | grep -q 'notRescuedInTime'
          unzip -p artifact/artifacts-real-death-helper.jar artifacts/mixin/compat/hardcorerevival/PlayerListRespawnMixin.class | strings | grep -q 'respawn'
          sha256sum artifact/artifacts-real-death-helper.jar > artifact/SHA256SUMS.txt
          cat artifact/SHA256SUMS.txt

      - name: Upload helper
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-real-death-helper
          path: artifact/*
          if-no-files-found: error
