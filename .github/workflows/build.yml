name: Inspect Minecraft 26.2 APIs

on:
  push:
    branches: [ci/build-jar]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Download migrated sources
        uses: actions/download-artifact@v4
        with:
          name: migrated-src
          path: /tmp/migrated-artifact
          run-id: 30643325011
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore project and migrated source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/asp.tar.xz.b64.part-* | base64 --decode > /tmp/asp.tar.xz
          echo '3c3a2a9c821ef83ba5871678a59617b54800fb9c1926dcdb32de401881d45f8b  /tmp/asp.tar.xz' | sha256sum --check
          mkdir -p /tmp/asp-src
          tar -xJf /tmp/asp.tar.xz -C /tmp/asp-src
          cp -a /tmp/asp-src/armorstandpet-fabric ./project
          (cd /tmp/migrated-artifact && sha256sum --check migrated-src.tar.gz.sha256)
          rm -rf project/src
          tar -xzf /tmp/migrated-artifact/migrated-src.tar.gz -C project
          cp -a ci/overrides/. project/

      - name: Resolve dependencies and capture compiler diagnostics
        shell: bash
        run: |
          set +e
          cd project
          gradle compileJava compileClientJava --continue --stacktrace --no-daemon --console=plain 2>&1 | tee ../build.log
          exit 0

      - name: Inspect Minecraft and Fabric APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          MCJAR=''
          while IFS= read -r jar; do
            if jar tf "$jar" 2>/dev/null | grep -qx 'net/minecraft/world/entity/Entity.class'; then
              MCJAR="$jar"
              break
            fi
          done < <(find ~/.gradle/caches -type f -name '*.jar' | sort)
          if [ -z "$MCJAR" ]; then
            echo 'Minecraft jar not found' >&2
            exit 1
          fi
          echo "$MCJAR" > diagnostics/minecraft-jar.txt
          jar tf "$MCJAR" | grep -Ei 'Click(Type|Action)|Rotations.class|Value(Input|Output)|TeleportTransition|EntityType\$Builder|ServerPlayer.class|ArmorStand.class' > diagnostics/relevant-classes.txt || true
          for cls in \
            net.minecraft.world.entity.Entity \
            net.minecraft.server.level.ServerPlayer \
            net.minecraft.server.level.ServerLevel \
            net.minecraft.world.entity.decoration.ArmorStand \
            'net.minecraft.world.entity.EntityType$Builder' \
            net.minecraft.world.entity.EntityType \
            net.minecraft.world.inventory.AbstractContainerMenu \
            net.minecraft.world.inventory.ClickType \
            net.minecraft.world.level.storage.ValueInput \
            net.minecraft.world.level.storage.ValueOutput \
            net.minecraft.world.level.portal.TeleportTransition \
            net.minecraft.core.Rotations \
            net.minecraft.core.Registry \
            net.minecraft.resources.Identifier; do
            echo "===== $cls =====" >> diagnostics/javap.txt
            javap -classpath "$MCJAR" -protected "$cls" >> diagnostics/javap.txt 2>&1 || true
          done
          cp build.log diagnostics/build.log

      - name: Inspect focused APIs
        shell: bash
        run: bash ci/inspect-extra.sh diagnostics

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: mc26.2-api-diagnostics-extra
          path: diagnostics/
          if-no-files-found: error
