name: Build Artifacts Real Death Helper

on:
  push:
    branches:
      - ci/artifacts-finaldeath-20260813
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CI files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check out exact Artifacts 13.2.1 source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/ochotonida/artifacts.git project
          cd project
          git checkout c9c3a3debb1054eb5535600e44dc0834201f0943
          test "$(git rev-parse HEAD)" = "c9c3a3debb1054eb5535600e44dc0834201f0943"
          grep -Fx 'minecraft_version=1.21.1' gradle.properties
          grep -Fx 'mod_version=13.2.1' gradle.properties

      - name: Apply real-death compatibility helper
        shell: bash
        run: |
          set -euo pipefail
          cd project
          python "$GITHUB_WORKSPACE/ci/artifacts-real-death-helper.py"
          sed -i 's#Lnet/minecraft/world/entity/player/Player;)V#Lnet/minecraft/class_1657;)V#' common/src/main/java/artifacts/mixin/compat/hardcorerevival/HardcoreRevivalManagerMixin.java
          grep -F 'findRespawnPositionAndUseSpawnBlock(true, DimensionTransition.DO_NOTHING)' common/src/main/java/artifacts/compat/hardcorerevival/HardcoreRevivalFinalDeathCompat.java
          grep -F 'equippedTotem.setCount(0)' common/src/main/java/artifacts/compat/hardcorerevival/HardcoreRevivalFinalDeathCompat.java
          grep -F 'EquipmentSlotManager.tryEquipAccessory' common/src/main/java/artifacts/compat/hardcorerevival/HardcoreRevivalFinalDeathCompat.java
          grep -F 'reset(Lnet/minecraft/class_1657;)V' common/src/main/java/artifacts/mixin/compat/hardcorerevival/HardcoreRevivalManagerMixin.java
          grep -F 'compat.hardcorerevival.PlayerListRespawnMixin' common/src/main/resources/mixins.artifacts.common.json
          git diff --check

      - name: Build Fabric 1.21.1 helper
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/artifacts-real-death-ci
          cd project
          chmod +x gradlew
          ./gradlew :fabric:build --stacktrace --no-daemon 2>&1 | tee /tmp/artifacts-real-death-ci/build.log

      - name: Publish CI result to temporary branch
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p ci/output
          rm -f ci/output/artifacts-real-death-helper.jar ci/output/STATUS.txt ci/output/build-tail.txt
          JAR="$(find project/fabric/build/libs -maxdepth 1 -type f -name 'artifacts-fabric-*.jar' ! -name '*-sources.jar' ! -name '*-dev-shadow.jar' -print -quit 2>/dev/null || true)"
          if [ -n "$JAR" ] \
             && jar tf "$JAR" | grep -q 'artifacts/compat/hardcorerevival/HardcoreRevivalFinalDeathCompat.class' \
             && jar tf "$JAR" | grep -q 'artifacts/mixin/compat/hardcorerevival/HardcoreRevivalManagerMixin.class' \
             && jar tf "$JAR" | grep -q 'artifacts/mixin/compat/hardcorerevival/PlayerListRespawnMixin.class'; then
            cp "$JAR" ci/output/artifacts-real-death-helper.jar
            echo 'success' > ci/output/STATUS.txt
          else
            echo 'failure' > ci/output/STATUS.txt
          fi
          if [ -f /tmp/artifacts-real-death-ci/build.log ]; then
            tail -n 500 /tmp/artifacts-real-death-ci/build.log > ci/output/build-tail.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/output
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] CI: publish Artifacts real-death helper result'
            git push origin HEAD:ci/artifacts-finaldeath-20260813
          fi

      - name: Upload helper
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-real-death-helper
          path: ci/output/*
          if-no-files-found: error
