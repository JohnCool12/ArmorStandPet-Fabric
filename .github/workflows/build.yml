name: Build Extra Golems Fabric - Natural Village Parity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Reconstruct verified cumulative source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/egpatch.part-* | base64 --decode > /tmp/fabric-port.patch.xz
          echo '8b5eb02294d41d7ef3af71ce280dcded9920b2ae097f73043cf60c751f94c7ba  /tmp/fabric-port.patch.xz' | sha256sum --check
          git clone -q https://github.com/bigenergy/extra-golems-reborn.git project
          cd project
          git checkout -q 6b21ec4a59ca16e8362b26e38fc63b2807042bdf
          xz -dc /tmp/fabric-port.patch.xz | patch -p4 --batch --forward >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix1.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix2.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-bedrock-targetable.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix4.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-advanced-swim.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-surface-swim.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-bedrock-provocation.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-all-eyes-neutral.patch >/dev/null
          cp ../ci/GolemFinalEyesLayer.java src/main/java/com/mcmoddev/golems/client/entity/layer/GolemFinalEyesLayer.java
          cd ..
          python3 ci/apply-strict-neutral.py >/dev/null
          python3 ci/apply-legacy-neutral-migration.py >/dev/null
          python3 ci/apply-hybrid-village-neutral.py >/dev/null
          python3 ci/apply-bedrock-natural-hostility.py >/dev/null
          python3 ci/apply-stable-village-targeting.py >/dev/null
          python3 ci/apply-bedrock-true-vanilla-natural-ai.py >/dev/null
          python3 ci/apply-all-constructed-natural-village-ai.py

          python3 - <<'PY'
          from pathlib import Path
          s = Path('project/src/main/java/com/mcmoddev/golems/entity/GolemBase.java').read_text()
          assert 'extra_golems_natural_constructed_v1' in s
          assert 'configureNaturalIronGolemTargeting' in s
          start = s.index('\tpublic void markConstructedNeutral() {')
          end = s.index('\n\tprivate ', start + 2)
          mark = s[start:end]
          assert 'setPlayerCreated(false)' in mark
          assert 'configureNaturalIronGolemTargeting()' in mark
          assert 'addTag(NATURAL_CONSTRUCTED_TAG)' in mark
          assert 'addTag(NEUTRAL_CONSTRUCTED_TAG)' not in mark
          natural_start = s.index('\tprivate void configureNaturalIronGolemTargeting() {')
          natural_end = s.index('\n\tprivate ', natural_start + 2)
          natural = s[natural_start:natural_end]
          for needle in ('new DefendVillageTargetGoal(this)', 'new HurtByTargetGoal(this)',
                         'new NearestAttackableTargetGoal<>(this, Player.class', 'this::isAngryAt',
                         'entity instanceof Enemy && !(entity instanceof Creeper)',
                         'new ResetUniversalAngerTargetGoal<>(this, false)'):
              assert needle in natural, needle
          print('PASS: all T-built Extra Golems use vanilla-natural Iron Golem target stack')
          PY
          for f in diamond emerald sculk_catalyst ancient_debris obsidian crying_obsidian; do
            grep -q '"knockback_resistance": 1.0' "project/src/main/resources/data/golems/golems/golem/$f.json"
          done

      - name: Inject AI and village reputation GameTests
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/inject-bedrock-ai-gametest.py >/dev/null
          python3 ci/patch-bedrock-gametest-normal-difficulty.py >/dev/null
          python3 ci/patch-bedrock-gametest-candidate-debug.py >/dev/null
          python3 ci/inject-village-reputation-gametest.py
          grep -q 'VillageReputationGameTest' project/src/main/resources/fabric.mod.json

      - name: Run vanilla-parity GameTests
        working-directory: project
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p run/gametest
          printf 'eula=true\n' > run/gametest/eula.txt
          set +e
          gradle runGametest --no-daemon > ../gametest-village.log 2>&1
          status=$?
          set -e
          cat ../gametest-village.log
          test -f build/junit.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('build/junit.xml').getroot()
          failures = list(root.iter('failure'))
          errors = list(root.iter('error'))
          for case in root.iter('testcase'):
              for tag in ('failure','error'):
                  node = case.find(tag)
                  if node is not None:
                      print('FAILED:', case.attrib.get('name'), node.attrib.get('message'))
          if failures or errors:
              raise SystemExit(f'GameTest failed: {len(failures)} failure(s), {len(errors)} error(s)')
          names = [c.attrib.get('name','') for c in root.iter('testcase')]
          print('GameTests:', names)
          if not any('constructedExtraGolemObeysVanillaVillageReputation' in n for n in names):
              raise SystemExit('Village reputation parity GameTest was not executed')
          print('PASS: Extra Golem village reputation targeting matches vanilla natural Iron Golem control')
          PY
          if [ "$status" -ne 0 ]; then exit "$status"; fi

      - name: Remove CI-only tests and build production JAR
        shell: bash
        run: |
          set -euo pipefail
          rm -f project/src/main/java/com/mcmoddev/golems/test/VillageReputationGameTest.java
          python3 ci/remove-bedrock-ai-gametest.py >/dev/null
          ! grep -q 'fabric-gametest' project/src/main/resources/fabric.mod.json
          cd project
          gradle clean build --stacktrace --no-daemon
          ! jar tf build/libs/Extra-Golems-Reborn-Fabric-1.21.1-21.1.0.1-fabric.jar | grep -q 'GameTest'

      - name: Verify production AI bytecode
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          javap -classpath build/classes/java/main -p -c com.mcmoddev.golems.entity.GolemBase > ../golem-base-final.txt
          grep -q 'configureNaturalIronGolemTargeting' ../golem-base-final.txt
          grep -q 'DefendVillageTargetGoal' ../golem-base-final.txt
          grep -q 'HurtByTargetGoal' ../golem-base-final.txt
          grep -q 'ResetUniversalAngerTargetGoal' ../golem-base-final.txt

      - name: Dedicated server smoke test
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          set +e
          timeout --signal=TERM 90s gradle runServer --no-daemon > ../server-final.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then cat ../server-final.log; exit "$status"; fi
          grep -q 'Done (' run/server/logs/latest.log

      - name: Client resource/render smoke test
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          setsid env ALSOFT_DRIVERS=null LIBGL_ALWAYS_SOFTWARE=true xvfb-run -a gradle runClient --no-daemon > ../client-final.log 2>&1 &
          pid=$!
          success=0
          for i in $(seq 1 90); do
            if [ -f run/client/logs/latest.log ] && grep -q 'minecraft:textures/atlas/blocks.png-atlas' run/client/logs/latest.log; then
              sleep 10
              if kill -0 "$pid" 2>/dev/null; then success=1; fi
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          kill -TERM -- -"$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ "$success" -ne 1 ]; then cat ../client-final.log; exit 1; fi

      - name: Collect and integrity-check production JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} artifact/ \;
          JAR=$(find artifact -maxdepth 1 -type f -name '*.jar' -print -quit)
          test -n "$JAR"
          unzip -t "$JAR"
          sha256sum "$JAR"

      - uses: actions/upload-artifact@v4
        with:
          name: extra-golems-reborn-fabric-1.21.1-natural-village-reputation-verified
          path: artifact/*.jar
          if-no-files-found: error
