name: Build Damage Indicators Fabric 1.21.1 v1.1.2

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Restore and patch Damage Indicators source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/astryxion/Damage-Indicators.git upstream
          cp -a 'upstream/Fabric 1.21.1' project
          cd project
          patch --batch -p1 < ../ci/damage-indicators-v1.1.2.patch
          grep -q 'mod_version=1.21.1-1.1.2' gradle.properties

      - name: Build patched mod
        working-directory: project
        run: gradle build --stacktrace --no-daemon

      - name: Collect production JAR
        shell: bash
        run: |
          mkdir -p artifact
          find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} artifact/ \;
          test -n "$(find artifact -maxdepth 1 -type f -name '*.jar' -print -quit)"
          ls -lah artifact

      - name: Upload patched mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: damage-indicators-fabric-1.21.1-effect-sync-fix-v1.1.2
          path: artifact/*.jar
          if-no-files-found: error
