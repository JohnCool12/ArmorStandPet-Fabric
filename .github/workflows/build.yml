name: Build Extra Golems Fabric

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build carrier
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Reconstruct Fabric port patch
        shell: bash
        run: |
          set -euo pipefail
          cat ci/egpatch.part-* | base64 --decode > /tmp/fabric-port.patch.xz
          echo '8b5eb02294d41d7ef3af71ce280dcded9920b2ae097f73043cf60c751f94c7ba  /tmp/fabric-port.patch.xz' | sha256sum --check

      - name: Restore exact source and apply Fabric port
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/bigenergy/extra-golems-reborn.git project
          cd project
          git checkout 6b21ec4a59ca16e8362b26e38fc63b2807042bdf
          xz -dc /tmp/fabric-port.patch.xz | patch -p4 --batch --forward
          if [ -d ../ci/eg-overrides ]; then
            cp -a ../ci/eg-overrides/. .
          fi
          test -f build.gradle
          test -f src/main/resources/fabric.mod.json
          grep -q 'fabric-loom' build.gradle

      - name: Build
        working-directory: project
        run: gradle clean build --stacktrace --no-daemon

      - name: Collect production JAR
        shell: bash
        run: |
          mkdir -p artifact
          find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} artifact/ \;
          test -n "$(find artifact -maxdepth 1 -type f -name '*.jar' -print -quit)"
          ls -lah artifact

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: extra-golems-reborn-fabric-1.21.1
          path: artifact/*.jar
          if-no-files-found: error
