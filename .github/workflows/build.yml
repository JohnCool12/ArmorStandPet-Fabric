name: Build Artifacts Chorus Totem Belt Fix V2

on:
  push:
    branches:
      - ci/artifacts-chorus-totem-20260812
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CI files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check out exact Artifacts 13.2.1 source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/ochotonida/artifacts.git project
          cd project
          git checkout c9c3a3debb1054eb5535600e44dc0834201f0943
          test "$(git rev-parse HEAD)" = "c9c3a3debb1054eb5535600e44dc0834201f0943"
          grep -Fx 'minecraft_version=1.21.1' gradle.properties
          grep -Fx 'mod_version=13.2.1' gradle.properties

      - name: Apply asserted Chorus Totem source changes
        shell: bash
        run: |
          set -euo pipefail
          cd project
          python - <<'PY'
          from pathlib import Path
          def r(path,old,new):
              p=Path(path); t=p.read_text(encoding='utf-8')
              if t.count(old)!=1: raise SystemExit(f'{path}: expected one match for {old[:50]!r}')
              p.write_text(t.replace(old,new,1),encoding='utf-8')
          r('common/src/main/java/artifacts/registry/ModDataComponents.java','import net.minecraft.network.RegistryFriendlyByteBuf;\nimport net.minecraft.network.codec.StreamCodec;','import net.minecraft.network.RegistryFriendlyByteBuf;\nimport net.minecraft.network.codec.ByteBufCodecs;\nimport net.minecraft.network.codec.StreamCodec;')
          r('common/src/main/java/artifacts/registry/ModDataComponents.java','    public static final Supplier<DataComponentType<Value<Boolean>>> HIDE_WHEN_INVISIBLE = registerSynced("hide_when_invisible", ValueTypes.enabledField().codec(), ValueTypes.BOOLEAN.streamCodec());\n','    public static final Supplier<DataComponentType<Value<Boolean>>> HIDE_WHEN_INVISIBLE = registerSynced("hide_when_invisible", ValueTypes.enabledField().codec(), ValueTypes.BOOLEAN.streamCodec());\n    public static final Supplier<DataComponentType<Integer>> CHORUS_TOTEM_USES = registerSynced("chorus_totem_uses", Codec.intRange(1, 3), ByteBufCodecs.INT);\n')
          r('common/src/main/java/artifacts/registry/ModItems.java','    public static final Holder<Item> CHORUS_TOTEM = wearableItem("chorus_totem", builder -> builder\n            .component(ModDataComponents.DEATH_PROTECTION_TELEPORT.get(), new DeathProtectionTeleport(','    public static final Holder<Item> CHORUS_TOTEM = wearableItem("chorus_totem", builder -> builder\n            .component(ModDataComponents.CHORUS_TOTEM_USES.get(), 3)\n            .component(ModDataComponents.DEATH_PROTECTION_TELEPORT.get(), new DeathProtectionTeleport(')
          r('common/src/main/java/artifacts/mixin/ability/deathprotectionteleport/LivingEntityMixin.java','import net.minecraft.tags.DamageTypeTags;\n','')
          r('common/src/main/java/artifacts/mixin/ability/deathprotectionteleport/LivingEntityMixin.java','        if (!totem.isEmpty()\n                && entity.level() instanceof ServerLevel level\n                && !damageSource.is(DamageTypeTags.BYPASSES_INVULNERABILITY)\n        ) {','        if (!totem.isEmpty()\n                && entity.level() instanceof ServerLevel level\n        ) {')
          r('common/src/main/java/artifacts/mixin/ability/deathprotectionteleport/LivingEntityMixin.java','                    if (ability.consumedOnUse().get()) {\n                        totem.shrink(1);\n                    } else if (entity instanceof Player player) {\n                        player.getCooldowns().addCooldown(totem.getItem(), ability.cooldown().get() * 20);\n                    }','                    int usesLeft = totem.getOrDefault(ModDataComponents.CHORUS_TOTEM_USES.get(), 3);\n                    if (usesLeft <= 1) {\n                        totem.shrink(1);\n                    } else {\n                        totem.set(ModDataComponents.CHORUS_TOTEM_USES.get(), usesLeft - 1);\n                    }')
          r('common/src/main/java/artifacts/item/WearableArtifactItem.java','    public void appendHoverText(ItemStack itemStack, TooltipContext tooltipContext, List<Component> list, TooltipFlag tooltipFlag) {\n        if (Artifacts.CONFIG.client.showTooltips.get()','    public void appendHoverText(ItemStack itemStack, TooltipContext tooltipContext, List<Component> list, TooltipFlag tooltipFlag) {\n        Integer chorusTotemUses = itemStack.get(ModDataComponents.CHORUS_TOTEM_USES.get());\n        if (chorusTotemUses != null) {\n            list.add(Component.translatable("artifacts.tooltip.chorus_totem_uses", chorusTotemUses).withStyle(ChatFormatting.LIGHT_PURPLE));\n        }\n\n        if (Artifacts.CONFIG.client.showTooltips.get()')
          r('common/src/generated/resources/assets/artifacts/lang/en_us.json','  "artifacts.config.items.chorus_totem.consumeOnUse.description": "Whether the Chorus Totem is consumed after activating",','  "artifacts.config.items.chorus_totem.consumeOnUse.description": "Legacy compatibility setting; the Chorus Totem always consumes one of its three uses in this build",')
          r('common/src/generated/resources/assets/artifacts/lang/en_us.json','  "item.artifacts.chorus_totem": "Chorus Totem",','  "item.artifacts.chorus_totem": "Chorus Totem",\n  "artifacts.tooltip.chorus_totem_uses": "%s uses left",')
          PY
          python "$GITHUB_WORKSPACE/ci/artifacts-chorus-beltfix.py"
          python "$GITHUB_WORKSPACE/ci/artifacts-chorus-beltfix-v2.py"

          grep -F 'CHORUS_TOTEM_USES' common/src/main/java/artifacts/registry/ModItems.java
          grep -F 'Codec.intRange(1, 3)' common/src/main/java/artifacts/registry/ModDataComponents.java
          ! grep -F 'BYPASSES_INVULNERABILITY' common/src/main/java/artifacts/mixin/ability/deathprotectionteleport/LivingEntityMixin.java
          ! grep -F 'ability.consumedOnUse().get()' common/src/main/java/artifacts/mixin/ability/deathprotectionteleport/LivingEntityMixin.java
          grep -F 'LivingDamageEvent;setDamageAmount(F)V' common/src/main/java/artifacts/mixin/compat/hardcorerevival/KnockoutHandlerMixin.java
          grep -F 'return 0F;' common/src/main/java/artifacts/mixin/compat/hardcorerevival/KnockoutHandlerMixin.java
          ! grep -F 'isKnockoutEnabledFor' common/src/main/java/artifacts/mixin/compat/hardcorerevival/KnockoutHandlerMixin.java
          ! grep -F 'getInventory()' common/src/main/java/artifacts/mixin/compat/hardcorerevival/KnockoutHandlerMixin.java
          grep -F 'consumePreventKnockout' common/src/main/java/artifacts/mixin/compat/hardcorerevival/HardcoreRevivalManagerMixin.java
          grep -F 'compat.hardcorerevival.HardcoreRevivalManagerMixin' common/src/main/resources/mixins.artifacts.common.json
          python -m json.tool common/src/generated/resources/assets/artifacts/lang/en_us.json >/dev/null
          python -m json.tool common/src/main/resources/mixins.artifacts.common.json >/dev/null
          git diff --check
          git diff --stat

      - name: Validate Hardcore Revival target structure
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.21.1 https://github.com/TwelveIterations/HardcoreRevival.git hardcorerevival
          grep -F 'event.setDamageAmount(Math.min(event.getDamageAmount(), Math.max(0f, player.getHealth() - 1f)));' hardcorerevival/common/src/main/java/net/blay09/mods/hardcorerevival/handler/KnockoutHandler.java
          grep -F 'HardcoreRevivalManager.knockout(player, damageSource);' hardcorerevival/common/src/main/java/net/blay09/mods/hardcorerevival/handler/KnockoutHandler.java
          grep -F 'public static void knockout(Player player, DamageSource source)' hardcorerevival/common/src/main/java/net/blay09/mods/hardcorerevival/HardcoreRevivalManager.java

      - name: Build Fabric 1.21.1 JAR
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew :fabric:build --stacktrace --no-daemon

      - name: Validate and collect production JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          JAR="$(find project/fabric/build/libs -maxdepth 1 -type f -name 'artifacts-fabric-*.jar' ! -name '*-sources.jar' ! -name '*-dev-shadow.jar' -print -quit)"
          test -n "$JAR"
          OUT=artifact/artifacts-fabric-13.2.1-chorus-totem-3uses-beltfix-v2.jar
          cp "$JAR" "$OUT"
          unzip -p "$OUT" fabric.mod.json | grep -q '"id": "artifacts"'
          jar tf "$OUT" | grep -q 'artifacts/mixin/ability/deathprotectionteleport/LivingEntityMixin.class'
          jar tf "$OUT" | grep -q 'artifacts/mixin/compat/hardcorerevival/KnockoutHandlerMixin.class'
          jar tf "$OUT" | grep -q 'artifacts/mixin/compat/hardcorerevival/HardcoreRevivalManagerMixin.class'
          unzip -p "$OUT" mixins.artifacts.common.json | grep -q 'compat.hardcorerevival.HardcoreRevivalManagerMixin'
          unzip -p "$OUT" assets/artifacts/lang/en_us.json | grep -q 'artifacts.tooltip.chorus_totem_uses'
          unzip -p "$OUT" artifacts/mixin/compat/hardcorerevival/KnockoutHandlerMixin.class | strings | grep -q 'setDamageAmount'
          unzip -p "$OUT" artifacts/mixin/compat/hardcorerevival/HardcoreRevivalManagerMixin.class | strings | grep -q 'knockout'
          sha256sum "$OUT" > artifact/SHA256SUMS.txt
          cat artifact/SHA256SUMS.txt

      - name: Upload finished mod
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-fabric-1.21.1-chorus-totem-3uses-beltfix-v2
          path: artifact/*
          if-no-files-found: error
