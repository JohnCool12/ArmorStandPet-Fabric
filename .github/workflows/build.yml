name: Reconstruct Extra Golems V4 Source

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact V4 carrier sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/pull/71/head:refs/heads/pr71
          git worktree add /tmp/carrier pr71
          cd /tmp/carrier

          cat ci/egpatch.part-* | base64 --decode > /tmp/fabric-port.patch.xz
          echo '8b5eb02294d41d7ef3af71ce280dcded9920b2ae097f73043cf60c751f94c7ba  /tmp/fabric-port.patch.xz' | sha256sum --check
          git clone -q https://github.com/bigenergy/extra-golems-reborn.git project
          cd project
          git checkout -q 6b21ec4a59ca16e8362b26e38fc63b2807042bdf
          xz -dc /tmp/fabric-port.patch.xz | patch -p4 --batch --forward >/dev/null
          cd ..

          cp -a project /tmp/fabric-baseline

          cd project
          patch -p1 --batch --forward < ../ci/eg-fix1.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix2.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-bedrock-targetable.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-fix4.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-advanced-swim.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-surface-swim.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-bedrock-provocation.patch >/dev/null
          patch -p1 --batch --forward < ../ci/eg-all-eyes-neutral.patch >/dev/null
          cp ../ci/GolemFinalEyesLayer.java src/main/java/com/mcmoddev/golems/client/entity/layer/GolemFinalEyesLayer.java
          cd ..
          for s in apply-strict-neutral.py apply-legacy-neutral-migration.py apply-hybrid-village-neutral.py apply-bedrock-natural-hostility.py apply-stable-village-targeting.py apply-bedrock-true-vanilla-natural-ai.py apply-all-constructed-natural-ai.py apply-village-runtime-parity-fix.py apply-individual-player-target-provenance.py apply-minimum-iron-golem-speed.py apply-sculk-catalyst-player-blindness-exemption.py refine-sculk-catalyst-player-blindness-predicate.py apply-village-golem-pretracking-initialization.py apply-village-golem-failed-replacement-fallback.py apply-village-golem-spawn-helper.py apply-provoked-target-interruption-recovery.py; do python3 ci/$s >/dev/null; done
          python3 ci/fix-provoked-recovery-compile.py >/dev/null
          python3 ci/apply-no-silent-aggravation-invariant.py >/dev/null
          python3 ci/apply-golem-mob-difficulty-scaling.py >/dev/null
          python3 ci/apply-extra-golem-explosion-knockback-parity.py >/dev/null
          python3 ci/apply-creative-provocation-hard-reset.py >/dev/null
          python3 ci/normalize-setgolemid-target-rebuild.py >/dev/null
          python3 ci/apply-vanilla-iron-golem-target-acquisition-parity.py >/dev/null
          python3 ci/strip-custom-target-acquisition-dead-code.py >/dev/null

          cd /tmp
          diff -ruN --exclude=.git fabric-baseline carrier/project > /tmp/v4-post-port.patch || test $? -eq 1
          tar -C /tmp/carrier -czf /tmp/extra-golems-v4-source.tar.gz project
          tar -C /tmp -czf /tmp/extra-golems-fabric-baseline.tar.gz fabric-baseline
          wc -l /tmp/v4-post-port.patch

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: extra-golems-v4-reconstructed-source
          path: |
            /tmp/extra-golems-v4-source.tar.gz
            /tmp/extra-golems-fabric-baseline.tar.gz
            /tmp/v4-post-port.patch
          if-no-files-found: error
