name: Build ArmorStandPet 26.2

on:
  push:
    branches: [ci/build-jar]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Download migrated sources
        uses: actions/download-artifact@v4
        with:
          name: migrated-src
          path: /tmp/migrated-artifact
          run-id: 30643325011
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore and port project
        shell: bash
        run: |
          set -euo pipefail
          cat ci/asp.tar.xz.b64.part-* | base64 --decode > /tmp/asp.tar.xz
          echo '3c3a2a9c821ef83ba5871678a59617b54800fb9c1926dcdb32de401881d45f8b  /tmp/asp.tar.xz' | sha256sum --check
          mkdir -p /tmp/asp-src
          tar -xJf /tmp/asp.tar.xz -C /tmp/asp-src
          cp -a /tmp/asp-src/armorstandpet-fabric ./project

          (cd /tmp/migrated-artifact && sha256sum --check migrated-src.tar.gz.sha256)
          rm -rf project/src
          tar -xzf /tmp/migrated-artifact/migrated-src.tar.gz -C project

          base64 --decode ci/asp-port.patch.xz.b64 > /tmp/asp-port.patch.xz
          echo 'c65adafe5136df3c2cf0209dd09a9cb0c2d3b7de4644d5611029c11d0ef07565  /tmp/asp-port.patch.xz' | sha256sum --check
          xz --decompress --stdout /tmp/asp-port.patch.xz > /tmp/asp-port.patch
          (cd project && patch --batch --forward -p1 < /tmp/asp-port.patch)

          base64 --decode ci/asp-port-fix1.patch.xz.b64 > /tmp/asp-port-fix1.patch.xz
          echo '44a7ac832a503236d845a234cfd791f495f4be0ce92c21b591c400ba4d6e30eb  /tmp/asp-port-fix1.patch.xz' | sha256sum --check
          xz --decompress --stdout /tmp/asp-port-fix1.patch.xz > /tmp/asp-port-fix1.patch
          (cd project && patch --batch --forward -p1 < /tmp/asp-port-fix1.patch)

          cp -a ci/overrides/. project/
          test -f project/build.gradle
          test -f project/src/main/resources/fabric.mod.json

      - name: Build production JAR
        working-directory: project
        run: gradle clean build --stacktrace --no-daemon --console=plain

      - name: Validate and collect production JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} artifact/ \;
          test -n "$(find artifact -maxdepth 1 -type f -name '*.jar' -print -quit)"
          for jar in artifact/*.jar; do
            unzip -t "$jar"
            unzip -p "$jar" fabric.mod.json | grep -q '"id": "armorstandpet"'
            jar tf "$jar" | grep -q 'io/github/kyzderp/armorstandpet/ASPetMod.class'
          done
          sha256sum artifact/*.jar | tee artifact/SHA256SUMS.txt
          ls -lah artifact

      - name: Upload finished mod
        uses: actions/upload-artifact@v4
        with:
          name: armorstandpet-fabric-26.2
          path: artifact/
          if-no-files-found: error
