name: Extra Golems 26.1.2 Compile Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare clean upstream source and apply deterministic migration
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/bigenergy/extra-golems-reborn.git work
          python3 ci/eg_migrate.py work
          python3 ci/eg_migrate_v3.py work
          python3 ci/eg_migrate_v4.py work
          python3 ci/eg_migrate_v5.py work
          python3 ci/eg_migrate_v7.py work
          python3 ci/eg_migrate_v8prep.py work
          python3 ci/eg_migrate_v8.py work
          python3 ci/eg_migrate_v9.py work
          python3 ci/eg_migrate_v10.py work
          python3 ci/eg_migrate_v11.py work
          python3 ci/eg_migrate_v12.py work
          chmod +x work/gradlew
      - name: Build exact NeoForge 26.1.2.95 target
        id: build
        shell: bash
        run: |
          set +e
          cd work
          ./gradlew --no-daemon clean build 2>&1 | tee ../build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Runtime construction self-test
        if: steps.build.outputs.exit_code == '0'
        id: runtime
        shell: bash
        run: |
          set +e
          cd work
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'eula=true\n' > eula.txt
          timeout 100s ./gradlew --no-daemon runServer 2>&1 | tee ../server.log
          run_code=${PIPESTATUS[0]}
          cd ..
          echo "run_code=$run_code" >> "$GITHUB_OUTPUT"
          grep '\[EGPORT\]' server.log || true
          if grep -Eq '\[EGPORT\].*golem_count=[1-9][0-9]*.*diamond_tag=true.*diamond_match=.*diamond' server.log; then
            echo 'construction_ok=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'construction_ok=false' >> "$GITHUB_OUTPUT"
          exit 1
      - name: Package diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics/generated
          cp build.log diagnostics/build.log || true
          cp server.log diagnostics/server.log || true
          cp work/build.gradle diagnostics/build.gradle || true
          cp work/gradle.properties diagnostics/gradle.properties || true
          cp work/src/main/java/com/mcmoddev/golems/entity/GolemBase.java diagnostics/generated/GolemBase.java || true
          cp work/src/main/java/com/mcmoddev/golems/EGRegistry.java diagnostics/generated/EGRegistry.java || true
          cp work/src/main/java/com/mcmoddev/golems/EGEvents.java diagnostics/generated/EGEvents.java || true
          cp work/src/main/java/com/mcmoddev/golems/client/entity/GolemRenderer.java diagnostics/generated/GolemRenderer.java || true
          cp work/src/main/java/com/mcmoddev/golems/client/entity/GolemDynamicTextures.java diagnostics/generated/GolemDynamicTextures.java || true
          cp work/src/main/java/com/mcmoddev/golems/client/entity/layer/GolemLayerListLayer.java diagnostics/generated/GolemLayerListLayer.java || true
          cp -r work/src/main/resources/data/golems/recipe diagnostics/generated/recipe || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extra-golems-compile-probe
          path: diagnostics
      - name: Upload built mod
        if: steps.build.outputs.exit_code == '0' && steps.runtime.outputs.construction_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: extra-golems-neoforge-26.1.2
          path: work/build/libs/*.jar
      - name: Fail if compiler failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
