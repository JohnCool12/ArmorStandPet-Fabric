name: Migrate Fabric Sources

on:
  push:
    branches: [ci/build-jar]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Restore source project
        shell: bash
        run: |
          set -euo pipefail
          cat ci/asp.tar.xz.b64.part-* | base64 --decode > /tmp/asp.tar.xz
          echo '3c3a2a9c821ef83ba5871678a59617b54800fb9c1926dcdb32de401881d45f8b  /tmp/asp.tar.xz' | sha256sum --check
          mkdir -p /tmp/asp-src
          tar -xJf /tmp/asp.tar.xz -C /tmp/asp-src
          cp -a /tmp/asp-src/armorstandpet-fabric ./project
          cp ci/migration-build.gradle project/build.gradle

      - name: Migrate main source mappings
        working-directory: project
        run: gradle migrateMappings --mappings 'net.minecraft:mappings:1.21.11' --overrideInputsIHaveABackup --stacktrace --no-daemon --console=plain

      - name: Migrate client source mappings
        working-directory: project
        run: gradle migrateClientMappings --mappings 'net.minecraft:mappings:1.21.11' --overrideInputsIHaveABackup --stacktrace --no-daemon --console=plain

      - name: Package migrated sources
        shell: bash
        run: |
          set -euo pipefail
          tar -czf migrated-src.tar.gz -C project src
          sha256sum migrated-src.tar.gz > migrated-src.tar.gz.sha256
          ls -lah migrated-src.tar.gz*

      - name: Upload migrated sources
        uses: actions/upload-artifact@v4
        with:
          name: migrated-src
          path: |
            migrated-src.tar.gz
            migrated-src.tar.gz.sha256
          if-no-files-found: error
