name: Extra Golems 26.1.2 Compile Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare clean upstream source and apply deterministic migration
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/bigenergy/extra-golems-reborn.git work
          python3 ci/eg_migrate.py work
          python3 ci/eg_migrate_v3.py work
          chmod +x work/gradlew
      - name: Compile exact NeoForge 26.1.2.95 target
        id: build
        shell: bash
        run: |
          set +e
          cd work
          ./gradlew --no-daemon clean compileJava 2>&1 | tee ../build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Package diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          cp build.log diagnostics/build.log || true
          cp work/build.gradle diagnostics/build.gradle || true
          cp work/gradle.properties diagnostics/gradle.properties || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extra-golems-compile-probe
          path: diagnostics
      - name: Fail if compiler failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
