name: Build Extra Golems NeoForge 26.1.2

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transform-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build original NeoForge 1.21.1 mod
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/bigenergy/extra-golems-reborn.git project
          cd project
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon
          cd ..
          mkdir -p input
          find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} input/Extra-Golems-Reborn-NeoForge-1.21.1.jar \;
          test -s input/Extra-Golems-Reborn-NeoForge-1.21.1.jar

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Retromod migration CLI
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Bownlux/Retromod.git retromod
          cd retromod
          mvn package -q -DskipTests -Dexec.skip=true
          cp target/*-all.jar ../retromod-all.jar

      - name: Transform NeoForge mod to Minecraft 26.1.2
        shell: bash
        run: |
          set -euo pipefail
          java -jar retromod-all.jar transform input/Extra-Golems-Reborn-NeoForge-1.21.1.jar \
            --target 26.1.2 --target-loader neoforge \
            --output Extra-Golems-Reborn-NeoForge-26.1.2-baseline.jar --verify --force \
            2>&1 | tee transform.log
          jar tf Extra-Golems-Reborn-NeoForge-26.1.2-baseline.jar > jar-contents.txt
          test -s Extra-Golems-Reborn-NeoForge-26.1.2-baseline.jar
          grep -E 'META-INF/(neoforge.mods.toml|mods.toml)' jar-contents.txt

      - name: Upload transformed baseline
        uses: actions/upload-artifact@v4
        with:
          name: extra-golems-neoforge-26.1.2-baseline
          path: |
            input/Extra-Golems-Reborn-NeoForge-1.21.1.jar
            Extra-Golems-Reborn-NeoForge-26.1.2-baseline.jar
            transform.log
            jar-contents.txt
          if-no-files-found: error
