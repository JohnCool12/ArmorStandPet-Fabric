name: Build Extra Golems NeoForge 26.1.2

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retromod-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build Retromod CLI
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Bownlux/Retromod.git retromod
          cd retromod
          git checkout f5d85bd31e37ea59560f2a0d729fb4b9709950b3
          mvn package -q -DskipTests -Dexec.skip=true
          find target -maxdepth 1 -type f -name '*.jar' -print
          mkdir -p ../artifact
          cp target/*.jar ../artifact/ || true
      - name: Upload Retromod build
        uses: actions/upload-artifact@v4
        with:
          name: retromod-cli-build
          path: artifact/*.jar
          if-no-files-found: error
