name: V9 Respawn Particles Binary Build

on:
  pull_request:
    branches:
      - ci/v9-particles-pr-base-20260821

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Clone exact Artifacts 13.2.1 source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/ochotonida/artifacts.git project
          cd project
          git checkout c9c3a3debb1054eb5535600e44dc0834201f0943
          test "$(git rev-parse HEAD)" = "c9c3a3debb1054eb5535600e44dc0834201f0943"
          grep -Fx 'minecraft_version=1.21.1' gradle.properties
          grep -Fx 'mod_version=13.2.1' gradle.properties
      - name: Apply V8 plus exact respawn teleport particles
        shell: bash
        run: |
          set -euo pipefail
          cd project
          python "$GITHUB_WORKSPACE/ci/artifacts-v8-minimal-patch.py"
          python "$GITHUB_WORKSPACE/ci/artifacts-v9-respawn-particles.py"
          grep -F 'player.serverLevel().broadcastEntityEvent(player, (byte) 46);' common/src/main/java/artifacts/component/ability/DeathProtectionTeleport.java
          test "$(grep -Fc 'broadcastEntityEvent(player, (byte) 46)' common/src/main/java/artifacts/component/ability/DeathProtectionTeleport.java)" -eq 1
          grep -F 'findRespawnPositionAndUseSpawnBlock(false, DimensionTransition.DO_NOTHING)' common/src/main/java/artifacts/component/ability/DeathProtectionTeleport.java
          grep -F 'schedulePostTeleportEffects(serverPlayer)' common/src/main/java/artifacts/mixin/compat/hardcorerevival/HardcoreRevivalManagerMixin.java
          grep -F 'Codec.intRange(1, 3)' common/src/main/java/artifacts/registry/ModDataComponents.java
          test ! -e common/src/generated/resources/data/hardcorerevival/tags/item/passthrough_death_when_held.json
          git diff --check
      - name: Build Fabric 1.21.1
        shell: bash
        run: |
          set -euo pipefail
          cd project
          chmod +x gradlew
          ./gradlew :fabric:build --stacktrace --no-daemon
      - name: Validate finished JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliver

          mapfile -t JARS < <(find project/fabric/build/libs -maxdepth 1 -type f -name 'artifacts-fabric-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-dev-shadow.jar' -print | sort)
          printf 'Candidate runtime JARs (%s):\n' "${#JARS[@]}"
          printf '  %s\n' "${JARS[@]}"
          test "${#JARS[@]}" -eq 1
          JAR="${JARS[0]}"

          jar tf "$JAR" > deliver/jar-list.txt
          grep -Fqx 'artifacts/compat/hardcorerevival/HardcoreRevivalFinalDeathCompat.class' deliver/jar-list.txt
          grep -Fqx 'artifacts/mixin/compat/hardcorerevival/HardcoreRevivalManagerMixin.class' deliver/jar-list.txt
          grep -Fqx 'artifacts/mixin/compat/hardcorerevival/DeathProtectionTeleportKnockoutOnlyMixin.class' deliver/jar-list.txt
          if grep -Fqx 'data/hardcorerevival/tags/item/passthrough_death_when_held.json' deliver/jar-list.txt; then
            echo 'ERROR: held-item Hardcore Revival passthrough tag unexpectedly present' >&2
            exit 1
          fi

          unzip -p "$JAR" assets/artifacts/lang/en_us.json > deliver/en_us.json
          grep -F 'artifacts.tooltip.chorus_totem_uses' deliver/en_us.json >/dev/null

          javap -classpath "$JAR" -p -c artifacts.component.ability.DeathProtectionTeleport > deliver/teleport-bytecode.txt
          grep -E 'bipush[[:space:]]+46' deliver/teleport-bytecode.txt >/dev/null

          OUT=deliver/artifacts-fabric-13.2.1-chorus-totem-respawn-particles-v9.jar
          cp "$JAR" "$OUT"
          sha256sum "$OUT" > deliver/SHA256SUMS.txt
          unzip -t "$OUT" > deliver/unzip-test.txt
          echo success > deliver/STATUS.txt
      - name: Upload finished V9 mod
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-v9-respawn-particles-finished
          path: deliver/*
          if-no-files-found: error
