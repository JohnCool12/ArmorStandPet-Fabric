name: Verify Clean Limitless Flame Impact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  verify-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build clean final JAR from already-verified Flame artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p base final verify /tmp/clean
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/JohnCool12/ArmorStandPet-Fabric/actions/artifacts/9585310795/zip -o /tmp/base.zip
          unzip -q /tmp/base.zip -d base
          BASE=$(find base -type f -name '*.jar' -print -quit)
          echo 'b96d4dc719d62d4902539f65f981cff3a34260930b17d4c1d4a970060be45204  '"$BASE" | sha256sum -c -
          JAR=final/limitless-fabric-2.0.0-1.21.1-true-unlimited-flame-impact-scaling.jar
          cp "$BASE" "$JAR"

          unzip -p "$JAR" limitless-flame-impact.mixins.json > /tmp/clean/limitless-flame-impact.mixins.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/clean/limitless-flame-impact.mixins.json')
          d=json.loads(p.read_text())
          d.pop('refmap', None)
          p.write_text(json.dumps(d, indent=2)+'\n')
          PY
          (cd /tmp/clean && zip -q -u "$GITHUB_WORKSPACE/$JAR" limitless-flame-impact.mixins.json)

          unzip -t "$JAR" > verify/unzip.txt
          unzip -p "$JAR" fabric.mod.json > verify/fabric.mod.json
          unzip -p "$JAR" limitless-flame-impact.mixins.json > verify/flame-mixin.json
          javap -classpath "$JAR" -p -v limitless.enchantments.mixin.AbstractArrowMixin > verify/AbstractArrowMixin.javap.txt
          python3 - <<'PY'
          import json
          meta=json.load(open('verify/fabric.mod.json'))
          assert 'taxfreelevels:options' not in meta.get('custom', {})
          assert 'limitless-flame-impact.mixins.json' in meta['mixins']
          mix=json.load(open('verify/flame-mixin.json'))
          assert 'refmap' not in mix
          assert mix['mixins']==['AbstractArrowMixin']
          PY
          grep -Fq 'method_7454(Lnet/minecraft/class_3966;)V' verify/AbstractArrowMixin.javap.txt
          grep -Fq 'Lnet/minecraft/class_1297;method_5639(F)V' verify/AbstractArrowMixin.javap.txt
          grep -Fq 'method_8225' verify/AbstractArrowMixin.javap.txt
          sha256sum "$JAR" | tee verify/sha256.txt

      - name: Runtime test on Fabric 1.21.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server/mods
          cp final/*.jar server/mods/
          curl -fsSL 'https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.19.3/1.1.1/server/jar' -o server/fabric-server-launch.jar
          curl -fsSL 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.116.14+1.21.1/fabric-api-0.116.14+1.21.1.jar' -o server/mods/fabric-api.jar
          curl -fsSL 'https://maven.architectury.dev/dev/architectury/architectury-fabric/13.0.8/architectury-fabric-13.0.8.jar' -o server/mods/architectury.jar
          echo 'eula=true' > server/eula.txt
          set +e
          cd server
          timeout 120s java -Dmixin.debug.verbose=true -Xms512M -Xmx1G -jar fabric-server-launch.jar nogui > ../verify/server.log 2>&1
          CODE=$?
          cd ..
          set -e
          tail -220 verify/server.log
          grep -Fq 'Mixing AbstractArrowMixin from limitless-flame-impact.mixins.json' verify/server.log
          grep -Eq 'Done \([0-9.]+s\)!' verify/server.log
          if grep -Fq "Reference map 'limitless-flame-impact-refmap.json'" verify/server.log; then exit 1; fi
          if grep -Eiq 'Critical injection failure|InjectionError|InvalidMixinException|Mixin apply failed|MixinApplyError|AbstractArrowMixin.*failed' verify/server.log; then exit 1; fi
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 124 ]; then exit "$CODE"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: limitless-flame-impact-scaling-clean-jar
          path: final/*.jar
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: limitless-flame-impact-scaling-clean-verification
          path: verify/
          if-no-files-found: warn
