name: Compile NeoForge 1.21.1 independent-health port v2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact Fabric independent-health source
        uses: actions/download-artifact@v4
        with:
          name: armorstandpet-independent-1.21.1-source
          path: /tmp/exact-source
          run-id: 30869378177
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconstruct audited NeoForge source
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/exact-source && sha256sum --check armorstandpet-independent-1.21.1-source.tar.gz.sha256)
          mkdir baseline project
          tar -xzf /tmp/exact-source/armorstandpet-independent-1.21.1-source.tar.gz -C baseline
          cp -a baseline/. project/

          base64 --decode ci/neoforge-1.21.1-independent-health-port.patch.xz.b64 > /tmp/neoforge-port.patch.xz
          echo 'a53bd5af28378c8192f2a8e60e52c1ed0ce300c4628a3cd73b6546a3d170a2dd  /tmp/neoforge-port.patch.xz' | sha256sum --check
          xz --decompress --stdout /tmp/neoforge-port.patch.xz > /tmp/neoforge-port.patch
          echo '9d095f1e07db54340ff7bbe60f8384a001c6bc2161fe5fe761f106567f0efdff  /tmp/neoforge-port.patch' | sha256sum --check
          (cd project && patch --batch --forward -p1 < /tmp/neoforge-port.patch)

          echo 'a2d5105ccb17032a31e25aa676234a38a91a46a15777eb1a10f599d0403c605d  ci/neoforge-1.21.1-interaction-event-fix.patch' | sha256sum --check
          (cd project && patch --batch --forward -p1 < ../ci/neoforge-1.21.1-interaction-event-fix.patch)
          cat /tmp/neoforge-port.patch ci/neoforge-1.21.1-interaction-event-fix.patch > /tmp/neoforge-combined-port.patch

      - name: Revalidate preserved gameplay source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys
          base = Path('baseline/src/main/java')
          port = Path('project/src/main/java')
          allowed = {
              'io/github/kyzderp/armorstandpet/ASPetMod.java',
              'io/github/kyzderp/armorstandpet/Lang.java',
              'io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.java',
              'io/github/kyzderp/armorstandpet/config/ModConfig.java',
              'io/github/kyzderp/armorstandpet/entity/ModEntities.java',
              'io/github/kyzderp/armorstandpet/entity/StandFactory.java',
              'io/github/kyzderp/armorstandpet/hooks/BuildingCheck.java',
              'io/github/kyzderp/armorstandpet/listeners/PetRespawnListener.java',
              'io/github/kyzderp/armorstandpet/listeners/PlayerActionListener.java',
              'io/github/kyzderp/armorstandpet/scheduler/TickScheduler.java',
          }
          failures = []
          count = 0
          for source in sorted(base.rglob('*.java')):
              rel = source.relative_to(base).as_posix()
              if rel in allowed:
                  continue
              target = port / rel
              if not target.is_file() or source.read_bytes() != target.read_bytes():
                  failures.append(rel)
              count += 1
          old_renderer = Path('baseline/src/client/java/io/github/kyzderp/armorstandpet/client/PetArmorStandRenderer.java')
          new_renderer = Path('project/src/main/java/io/github/kyzderp/armorstandpet/client/PetArmorStandRenderer.java')
          if old_renderer.read_bytes() != new_renderer.read_bytes():
              failures.append('PetArmorStandRenderer relocation')
          if failures:
              print(*failures, sep='\n')
              sys.exit(1)
          print(f'Preserved {count} original Java files byte-for-byte plus exact renderer relocation.')

          baseline = (base / 'io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.java').read_text()
          ported = (port / 'io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.java').read_text()
          ported = ported.replace('public static void tick(MinecraftServer server)', 'private static void onServerTick(MinecraftServer server)')
          ported = ported.replace('public static void clearAll()', 'private static void clearAll()')
          baseline = baseline.replace('import net.fabricmc.fabric.api.event.lifecycle.v1.ServerLifecycleEvents;\n', '')
          baseline = baseline.replace('import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;\n', '')
          baseline = baseline.replace('\tprivate static boolean registered;\n', '')
          start = baseline.index('\tpublic static synchronized void register()')
          end = baseline.index('\n\t/**', start)
          baseline = baseline[:start] + baseline[end + 1:]
          if baseline != ported:
              raise SystemExit('Combat algorithm changed beyond loader wiring.')
          print('Combat controller algorithm exactly preserved after loader normalization.')
          PY

          ! grep -R --line-number 'net\.fabricmc\|fabric\.mod\.json\|fabric-loom' project/src project/build.gradle project/settings.gradle project/gradle.properties
          grep -q 'MOVEMENT_STEP_INTERVAL_TICKS = 3L' project/src/main/java/io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.java
          grep -q 'ATTACK_COOLDOWN_TICKS = 20L' project/src/main/java/io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.java
          grep -q 'ATTACK_ANIMATION_TICKS = 9L' project/src/main/java/io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.java
          grep -q 'pet.animateWalk();' project/src/main/java/io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.java
          grep -q 'pet.takeStep();' project/src/main/java/io/github/kyzderp/armorstandpet/combat/OwnerAttackCombatController.java
          grep -q 'public float health' project/src/main/java/io/github/kyzderp/armorstandpet/types/Pet.java
          grep -q 'healthModelVersion' project/src/main/java/io/github/kyzderp/armorstandpet/storage/PetData.java
          grep -q 'event.setCancellationResult(InteractionResult.FAIL);' project/src/main/java/io/github/kyzderp/armorstandpet/neoforge/NeoForgeEventHandlers.java

      - name: Install official NeoForge wrapper and compile
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/neoforge-mdk.zip https://github.com/NeoForgeMDKs/MDK-1.21.1-ModDevGradle/archive/refs/heads/main.zip
          unzip -q /tmp/neoforge-mdk.zip -d /tmp/neoforge-mdk
          mdk="$(find /tmp/neoforge-mdk -mindepth 1 -maxdepth 1 -type d -print -quit)"
          cp "$mdk/gradlew" "$mdk/gradlew.bat" project/
          rm -rf project/gradle
          cp -a "$mdk/gradle" project/
          chmod +x project/gradlew
          cd project
          ./gradlew clean build --stacktrace --no-daemon --console=plain

      - name: Smoke-test dedicated NeoForge server
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nserver-port=25585\n' > run/server.properties
          set +e
          (sleep 90; echo stop) | timeout 360s ./gradlew runServer --no-daemon --console=plain > ../neoforge-1.21.1-server-smoke.log 2>&1
          status=${PIPESTATUS[1]}
          set -e
          cat ../neoforge-1.21.1-server-smoke.log
          grep -q 'Done (' ../neoforge-1.21.1-server-smoke.log
          ! grep -q 'Failed to complete lifecycle event' ../neoforge-1.21.1-server-smoke.log
          ! grep -q 'Exception caught during firing event' ../neoforge-1.21.1-server-smoke.log
          ! grep -Eiq '(^|\]) *(ERROR|FATAL) ' ../neoforge-1.21.1-server-smoke.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi

      - name: Package validated artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifact
          jar="$(find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          test -n "$jar"
          cp "$jar" artifact/ArmorStandPet-NeoForge-1.21.1-independent-health.jar
          cp neoforge-1.21.1-server-smoke.log artifact/ArmorStandPet-NeoForge-1.21.1-independent-health-server-smoke.log
          cp /tmp/neoforge-combined-port.patch artifact/ArmorStandPet-Fabric-1.21.1-to-NeoForge-1.21.1-port.patch
          unzip -t artifact/ArmorStandPet-NeoForge-1.21.1-independent-health.jar
          unzip -p artifact/ArmorStandPet-NeoForge-1.21.1-independent-health.jar META-INF/neoforge.mods.toml | grep -q 'modId="armorstandpet"'
          jar tf artifact/ArmorStandPet-NeoForge-1.21.1-independent-health.jar | grep -q 'OwnerAttackCombatController.class'
          jar tf artifact/ArmorStandPet-NeoForge-1.21.1-independent-health.jar | grep -q 'PetArmorStandRenderer.class'
          ! jar tf artifact/ArmorStandPet-NeoForge-1.21.1-independent-health.jar | grep -q 'fabric.mod.json'
          cat > artifact/PORT_VALIDATION.txt <<'EOF'
          ArmorStandPet NeoForge 1.21.1 independent-health port
          Exact Fabric baseline: e1dac61fd7648c13c728ccc8bfb04b280ea9e9bc
          Port version: 2.0.0+neoforge.1.21.1
          NeoForge: 21.1.244; Minecraft: 1.21.1; Java: 21

          Verified:
          - exact baseline artifact checksum
          - 94 original Java files byte-for-byte preserved
          - exact renderer relocation
          - normalized combat-controller equality
          - independent-health and persistence markers
          - full production compilation
          - dedicated-server startup
          - JAR metadata and required classes
          EOF
          rm -rf project/.gradle project/build project/run
          (cd project && zip -qr ../artifact/ArmorStandPet-NeoForge-1.21.1-independent-health-source.zip . -x '.git/*' '.github/*' '.gradle/*' 'build/*' 'run/*')
          sha256sum artifact/*.jar artifact/*-source.zip artifact/*.patch > artifact/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: armorstandpet-neoforge-1.21.1-independent-health-v2
          path: artifact/
          if-no-files-found: error
