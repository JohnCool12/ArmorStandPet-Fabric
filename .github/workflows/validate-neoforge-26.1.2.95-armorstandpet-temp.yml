name: Validate ArmorStandPet NeoForge 26.1.2.95

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Download exact validated 26.1.2 clean baseline
        uses: actions/download-artifact@v4
        with:
          name: armorstandpet-neoforge-26.1.2-uninterrupted-follow-clean
          path: /tmp/base-artifact
          run-id: 34103115504
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Retarget exact source to NeoForge 26.1.2.95
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project artifact
          mkdir project artifact
          unzip -q /tmp/base-artifact/ArmorStandPet-NeoForge-26.1.2-uninterrupted-follow-source.zip -d project
          sed -i 's/^neo_version=.*/neo_version=26.1.2.95/' project/gradle.properties
          sed -i 's/^mod_version=.*/mod_version=3.0.1+neoforge.26.1.2-uninterrupted-follow/' project/gradle.properties
          grep -q '^minecraft_version=26.1.2$' project/gradle.properties
          grep -q '^neo_version=26.1.2.95$' project/gradle.properties
          grep -q '^mod_version=3.0.1+neoforge.26.1.2-uninterrupted-follow$' project/gradle.properties
      - name: Build against NeoForge 26.1.2.95
        working-directory: project
        run: ./gradlew clean build --stacktrace --no-daemon --console=plain
      - name: Verify packaged dependency range
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          test -n "$jar"
          unzip -p "$jar" META-INF/neoforge.mods.toml > /tmp/neoforge.mods.toml
          grep -Fq 'versionRange="[26.1.2.95,)"' /tmp/neoforge.mods.toml
          cp "$jar" artifact/ArmorStandPet-NeoForge-26.1.2.95-uninterrupted-follow.jar
      - name: Dedicated-server smoke test on 26.1.2.95
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project/run
          printf 'eula=true\n' > project/run/eula.txt
          printf 'online-mode=false\nserver-port=25590\n' > project/run/server.properties
          set +e
          (cd project && (sleep 90; echo stop) | timeout 360s ./gradlew runServer --no-daemon --console=plain) > artifact/ArmorStandPet-NeoForge-26.1.2.95-server-smoke.log 2>&1
          status=$?
          set -e
          cat artifact/ArmorStandPet-NeoForge-26.1.2.95-server-smoke.log
          grep -q 'Done (' artifact/ArmorStandPet-NeoForge-26.1.2.95-server-smoke.log
          grep -q 'ArmorStandPet NeoForge 26.1.2 initialized.' artifact/ArmorStandPet-NeoForge-26.1.2.95-server-smoke.log
          ! grep -Eiq '(^|\]) *(ERROR|FATAL) ' artifact/ArmorStandPet-NeoForge-26.1.2.95-server-smoke.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
      - name: Package source and checksums
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project/.gradle project/build project/run
          (cd project && zip -qr ../artifact/ArmorStandPet-NeoForge-26.1.2.95-uninterrupted-follow-source.zip . -x '.git/*' '.github/*' '.gradle/*' 'build/*' 'run/*')
          printf '%s\n' \
            'ArmorStandPet NeoForge 26.1.2.95 compatibility build' \
            '=================================================' \
            'Minecraft: 26.1.2' \
            'NeoForge build target/minimum: 26.1.2.95' \
            'Java: 25' \
            'Mod version: 3.0.1+neoforge.26.1.2-uninterrupted-follow' \
            '' \
            'Validated by:' \
            '- compiling the complete production source against NeoForge 26.1.2.95' \
            '- verifying the packaged dependency range starts at 26.1.2.95' \
            '- launching a dedicated NeoForge 26.1.2.95 server to Done' \
            > artifact/VALIDATION.txt
          sha256sum artifact/ArmorStandPet-NeoForge-26.1.2.95-uninterrupted-follow.jar artifact/ArmorStandPet-NeoForge-26.1.2.95-uninterrupted-follow-source.zip artifact/ArmorStandPet-NeoForge-26.1.2.95-server-smoke.log artifact/VALIDATION.txt > artifact/SHA256SUMS.txt
      - name: Upload validated artifact
        uses: actions/upload-artifact@v4
        with:
          name: armorstandpet-neoforge-26.1.2.95-uninterrupted-follow
          path: artifact/
          if-no-files-found: error
