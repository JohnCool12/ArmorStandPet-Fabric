name: Fetch upstream CoFH source

on:
  push:
    branches:
      - chatgpt/cofh-payload-audit-20260816

jobs:
  fetch-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact CoFH Core 11.0.2 upstream
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 1.20.x https://github.com/CoFH/CoFHCore.git /tmp/CoFHCore-upstream
          grep '^mod_version=' /tmp/CoFHCore-upstream/gradle.properties
          grep '^mc_version=' /tmp/CoFHCore-upstream/gradle.properties
          tar -C /tmp -cJf "$GITHUB_WORKSPACE/CoFHCore-upstream-11.0.2.tar.xz" CoFHCore-upstream
          sha256sum "$GITHUB_WORKSPACE/CoFHCore-upstream-11.0.2.tar.xz"
      - uses: actions/upload-artifact@v4
        with:
          name: cofhcore-upstream-11.0.2-source
          path: CoFHCore-upstream-11.0.2.tar.xz
          if-no-files-found: error
