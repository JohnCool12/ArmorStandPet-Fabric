plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure { distributionType = Wrapper.DistributionType.BIN }
version = project.minecraft_version + '-' + project.mod_version
group = project.mod_group_id
base { archivesName = project.mod_name }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        client { client(); systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
        server { server(); programArgument '--nogui'; systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
        gameTestServer { type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
        data { clientData(); programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath }
        configureEach { systemProperty 'forge.logging.markers', 'REGISTRIES'; logLevel = org.slf4j.event.Level.INFO }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }
configurations { runtimeClasspath.extendsFrom localRuntime }
repositories {
    maven { name='MMD'; url='https://maven.mcmoddev.com/' }
    maven { name='CurseMaven'; url='https://www.cursemaven.com/'; content { includeGroup 'curse.maven' } }
}
sourceSets.main.java.exclude 'com/mcmoddev/golems/integration/TOPDescriptionManager.java'
sourceSets.main.java.exclude 'com/mcmoddev/golems/integration/JadeDescriptionManager.java'

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [minecraft_version:minecraft_version, minecraft_version_range:minecraft_version_range,
        neo_version:neo_version, loader_version_range:loader_version_range, mod_id:mod_id, mod_name:mod_name,
        mod_license:mod_license, mod_version:mod_version, mod_authors:mod_authors, mod_description:mod_description]
    inputs.properties replaceProperties; expand replaceProperties
    from 'src/main/templates'; into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
jar { manifest { attributes(['Specification-Title':'Extra-Golems','Specification-Vendor':"${mod_authors}",'Specification-Version':'1','Implementation-Title':project.mod_id,'Implementation-Version':"${version}",'Implementation-Vendor':'skyjay1']) } }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
